рез Epson Status Monitor или панель принтера запустите \"Head Cleaning\"\n2️⃣ Распечатайте тест дюз (Nozzle Check), определите, какой цвет не выходит\n3️⃣ Если в СНПЧ/баках мало чернил — долейте и убедитесь, что в трубках нет воздуха\n4️⃣ Аккуратно слегка сожмите трубки, чтобы сдвинуть пузырьки воздуха в сторону чернил\n5️⃣ Выполните Deep/Power Cleaning (расходует больше чернил, но чистит сильнее)\n6️⃣ Если не помогает — головка полностью забита, нужна химическая чистка или замена у мастера"}, {"label_uz": "🖨️ Epson: Ranglar aralashib, xira chiqadi", "label_ru": "🖨️ Epson: Цвета смешиваются, блёклые", "text_uz": "🖨️ *EPSON (RANGLI) — RANGLAR ARALASHIB, XIRA CHIQADI*\n\n🔍 *Keng tavsif:*\nRasm yoki matnda ranglar noto'g'ri, aralashgan yoki xira ko'rinadi. Sabab — bir nay boshqa rang bilan aralashgani, nozzle qisman tiqilgani yoki sifatsiz siyoh ishlatilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Nozzle Check orqali qaysi rang aralashganini/zaifligini aniqlang\n2️⃣ Head Cleaning'ni 2-3 marta ketma-ket bajaring\n3️⃣ CISS naylarini tekshiring — ular bir-biriga tegib, siyoh aralashishiga sabab bo'lmayaptimi\n4️⃣ Har bir tank/idishga faqat mos rangdagi siyoh quyilganini tasdiqlang\n5️⃣ Sifatsiz/mos kelmaydigan siyoh nozzle va rang aralashuvini yomonlashtiradi — Epson uchun mos siyoh ishlating\n6️⃣ Muammo davom etsa, damper (siyoh filtri) yoki bosh o'zi nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — ЦВЕТА СМЕШИВАЮТСЯ, БЛЁКЛЫЕ*\n\n🔍 *Подробное описание:*\nНа отпечатке цвета выходят неправильно, смешиваются или блёклые. Причина — перекрёстное смешение в трубках, частичное засорение дюз или некачественные чернила.\n\n✅ *Подробное решение:*\n1️⃣ Тестом дюз определите, какой цвет смешивается/слабый\n2️⃣ Выполните Head Cleaning 2-3 раза подряд\n3️⃣ Проверьте трубки СНПЧ — не соприкасаются ли они, вызывая смешение чернил\n4️⃣ Убедитесь, что в каждый бак залиты чернила правильного цвета\n5️⃣ Некачественные/несовместимые чернила ухудшают засорение дюз и смешение цветов — используйте подходящие для Epson чернила\n6️⃣ Если проблема остаётся — неисправен демпфер (фильтр чернил) или сама головка, нужна диагностика у мастера"}, {"label_uz": "🖨️ Epson: \"Chiqindi siyoh yostiqchasi to'ldi\"", "label_ru": "🖨️ Epson: \"Впитывающая подушка заполнена\"", "text_uz": "🖨️ *EPSON (RANGLI) — \"CHIQINDI SIYOH YOSTIQCHASI TO'LDI\"*\n\n🔍 *Keng tavsif:*\nEkranda \"Waste Ink Pad is full\" yoki mos chiroqlar yonib, printer chop etishdan to'xtaydi. Chiqindi siyoh yostiqchasi (ink pad) tozalashda sarflangan siyohni yig'ib, to'lib qolgan — bu dasturiy hisoblagich orqali boshqariladi.\n\n✅ *Batafsil yechim:*\n1️⃣ Bu xatoni uy sharoitida to'liq bartaraf etib bo'lmaydi — bu xavfsizlik bloklanishi\n2️⃣ Ustaga olib borilganda: yostiqcha (pad) fizik almashtiriladi yoki tozalanadi\n3️⃣ So'ngra Epson Adjustment Program (rasmiy servis dasturi) orqali hisoblagich (waste ink counter) reset qilinadi\n4️⃣ Faqat hisoblagichni reset qilib, yostiqchani almashtirmaslik — kelajakda siyoh oqib, printerni butunlay ishdan chiqarishi mumkin, shuning uchun ikkalasi ham bajarilishi shart\n5️⃣ Kelajakda oldini olish uchun: keraksiz tozalash (cleaning) funksiyalarini kamroq ishlating, chunki har bir tozalash chiqindi siyoh hajmini oshiradi", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — \"ВПИТЫВАЮЩАЯ ПОДУШКА ПЕРЕПОЛНЕНА\"*\n\n🔍 *Подробное описание:*\nНа экране появляется \"Waste Ink Pad is full\" или мигают соответствующие индикаторы, печать останавливается. Впитывающая подушка собирает чернила, расходуемые при чистке, и переполнилась — это отслеживается программным счётчиком.\n\n✅ *Подробное решение:*\n1️⃣ Эту ошибку нельзя полностью устранить дома — это защитная блокировка\n2️⃣ У мастера: подушка физически заменяется или очищается\n3️⃣ Затем через официальную сервисную программу Epson Adjustment Program сбрасывается счётчик отработанных чернил\n4️⃣ Сброс счётчика без замены подушки опасен — в будущем чернила могут протечь и полностью вывести принтер из строя, поэтому нужны оба действия\n5️⃣ Для профилактики: реже используйте функции очистки без необходимости, так как каждая чистка увеличивает объём отработанных чернил"}, {"label_uz": "🖨️ Epson: Qog'oz tortmayapti", "label_ru": "🖨️ Epson: Не захватывает бумагу", "text_uz": "🖨️ *EPSON (RANGLI) — QOG'OZ TORTMAYAPTI*\n\n🔍 *Keng tavsif:*\nPrinter qog'ozni ichiga tortmaydi yoki tortishga urinib, orqaga qaytaradi. Sabab — pickup rolik silliqlashib, ishqalanish kuchini yo'qotgani yoki qog'oz noto'g'ri turdagi.\n\n✅ *Batafsil yechim:*\n1️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n2️⃣ Qog'oz turini tekshiring — juda yupqa yoki juda qalin qog'oz muammo keltirib chiqaradi, 70-80 gr/m² oddiy qog'oz ishlating\n3️⃣ Lotokdagi qog'oz sonini kamaytiring va yon-orqa cheklagichlarni tekis moslang\n4️⃣ Printer sozlamalarida qog'oz o'lchami/turi to'g'ri tanlanganini tekshiring\n5️⃣ Muammo davom etsa, rolikning ishqalanish yuzasi yeyilgan — almashtirish kerak, bu ustaxonada tez bajariladigan ta'mir", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — НЕ ЗАХВАТЫВАЕТ БУМАГУ*\n\n🔍 *Подробное описание:*\nПринтер не захватывает бумагу или, пытаясь, выталкивает её обратно. Причина — ролик захвата стал скользким и потерял сцепление, либо неподходящий тип бумаги.\n\n✅ *Подробное решение:*\n1️⃣ Протрите ролик слегка влажной тканью от пыли\n2️⃣ Проверьте тип бумаги — слишком тонкая или толстая создаёт проблему, используйте обычную бумагу 70-80 г/м²\n3️⃣ Уменьшите количество листов в лотке, ровно выставьте боковые/задние направляющие\n4️⃣ Проверьте, правильно ли выбран размер/тип бумаги в настройках принтера\n5️⃣ Если не помогает — изношена поверхность ролика, требуется замена, это быстрый ремонт у мастера"}, {"label_uz": "🖨️ Epson: Bosh (karetka) harakatlanmayapti", "label_ru": "🖨️ Epson: Каретка (головка) не двигается", "text_uz": "🖨️ *EPSON (RANGLI) — BOSH (KARETKA) HARAKATLANMAYAPTI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilganda bosh (karetka) o'z joyidan siljimaydi yoki g'ichirlab, yarim yo'lda to'xtab qoladi. Sabab — karetka yo'lida qog'oz bo'lagi yoki yot jism, quritilgan siyoh yopishib qolgani yoki enkoder lentaga chang o'tirgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, ichkarida qog'oz bo'lagi yoki begona jism yo'qligini tekshiring\n2️⃣ Karetka relsini (yo'lini) quruq mato bilan artib, quritilgan siyoh izlarini tozalang\n3️⃣ Shaffof enkoder lentani (karetka ustidagi ingichka plyonka) spirt shimdirilgan paxta bilan asta artib, chang va siyoh izlarini tozalang\n4️⃣ Printerni qayta yoqib, karetka o'z joyiga (parking position) qaytishini kuzating\n5️⃣ Yordam bermasa — karetka motori yoki uning belt (tasma)i nosoz, ustaxonada almashtirish kerak", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — КАРЕТКА (ГОЛОВКА) НЕ ДВИГАЕТСЯ*\n\n🔍 *Подробное описание:*\nПри включении каретка не сдвигается с места или, скрипя, останавливается на полпути. Причина — кусок бумаги или посторонний предмет на пути каретки, засохшие чернила или пыль на энкодерной ленте.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и проверьте, нет ли внутри бумаги или постороннего предмета\n2️⃣ Протрите направляющую каретки сухой тканью, удалите засохшие следы чернил\n3️⃣ Аккуратно протрите прозрачную энкодерную ленту (тонкая плёнка над кареткой) ватой со спиртом, удалив пыль и следы чернил\n4️⃣ Включите принтер и понаблюдайте, возвращается ли каретка в исходное положение (парковку)\n5️⃣ Если не помогает — неисправен мотор каретки или его ремень, требуется замена у мастера"}, {"label_uz": "🖨️ Epson: Kompyuter tanimayapti / drayver xato", "label_ru": "🖨️ Epson: Компьютер не видит / ошибка драйвера", "text_uz": "🖨️ *EPSON (RANGLI) — KOMPYUTER TANIMAYAPTI / DRAYVER XATO*\n\n🔍 *Keng tavsif:*\nKompyuter printerni umuman ko'rmaydi yoki chop etishga urinishda \"drayver xatosi\" chiqadi. Sabab — drayver eskirgan/buzilgan, USB port muammosi yoki printer spooler xizmati (Windows) osilib qolgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Drayverni to'liq o'chirib (Boshqaruv paneli → Qurilmalar), rasmiy Epson sayti (yoki ilovasi) orqali eng so'nggi drayverni qayta o'rnating\n2️⃣ USB kabelni almashtirib ko'ring, boshqa USB portga ulang\n3️⃣ Windows'da \"Print Spooler\" xizmatini qayta ishga tushiring (Xizmatlar → Print Spooler → Restart)\n4️⃣ Printerni \"Standart printer\" qilib belgilang va offline holatda emasligini tekshiring\n5️⃣ Wi-Fi orqali ulangan bo'lsa, printer va kompyuter bir xil tarmoqda ekanini tasdiqlang\n6️⃣ Barchasi natija bermasa — USB porti yoki printer platasida muammo bo'lishi mumkin, ustaxonada diagnostika kerak", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — КОМПЬЮТЕР НЕ ВИДИТ / ОШИБКА ДРАЙВЕРА*\n\n🔍 *Подробное описание:*\nКомпьютер вообще не видит принтер или при печати выдаёт \"ошибку драйвера\". Причина — устаревший/повреждённый драйвер, проблема с USB-портом или зависла служба диспетчера печати (Windows).\n\n✅ *Подробное решение:*\n1️⃣ Полностью удалите драйвер (Панель управления → Устройства), установите последнюю версию с официального сайта/приложения Epson\n2️⃣ Попробуйте другой USB-кабель и другой USB-порт\n3️⃣ Перезапустите службу \"Диспетчер печати\" (Службы → Print Spooler → Перезапустить)\n4️⃣ Установите принтер как \"по умолчанию\" и проверьте, что он не в состоянии \"офлайн\"\n5️⃣ Если подключение по Wi-Fi — убедитесь, что принтер и компьютер в одной сети\n6️⃣ Если ничего не помогло — возможна проблема с USB-портом или платой принтера, нужна диагностика у мастера"}, {"label_uz": "🖨️ Epson: Siyoh darajasini aniqlay olmayapti (tank sensori)", "label_ru": "🖨️ Epson: Не определяет уровень чернил (датчик бака)", "text_uz": "🖨️ *EPSON (RANGLI) — SIYOH DARAJASINI ANIQLAY OLMAYAPTI (TANK SENSORI)*\n\n🔍 *Keng tavsif:*\nEcoTank/CISS tizimli Epson printerda siyoh tanklar to'la bo'lsa ham, ekranda \"siyoh tugadi\" yoki \"tank darajasini o'qib bo'lmadi\" degan xabar chiqadi. Sabab — optik sensor kirlangan, yorug'lik yo'li to'sib qolgan yoki firmware xatosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Epson Status Monitor orqali \"Ink Levels\" ni tekshiring, agar tanklar haqiqatan to'la bo'lsa, davom eting\n2️⃣ Printerni to'liq o'chirib, 1 daqiqadan so'ng qayta yoqing — sensor holatini qayta o'qishga majburlaydi\n3️⃣ Tank derazasi (shisha/plastik) ni tashqi tomondan yumshoq mato bilan artib, chang yoki siyoh tomchilari yo'qligini tekshiring\n4️⃣ Printer paneli orqali \"Ink Level Reset\" yoki \"Maintenance\" bo'limida mavjud bo'lsa, tank darajasini qo'lda tasdiqlang\n5️⃣ Firmware'ni Epson rasmiy dasturi orqali eng so'nggi versiyaga yangilang\n6️⃣ Muammo davom etsa, ichki optik sensor nosoz bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — НЕ ОПРЕДЕЛЯЕТ УРОВЕНЬ ЧЕРНИЛ (ДАТЧИК БАКА)*\n\n🔍 *Подробное описание:*\nНа принтере Epson с системой EcoTank/СНПЧ, даже если баки полные, на экране появляется сообщение \"чернила закончились\" или \"не удалось считать уровень бака\". Причина — загрязнён оптический датчик, перекрыт путь света или сбой прошивки.\n\n✅ *Подробное решение:*\n1️⃣ Через Epson Status Monitor проверьте \"Ink Levels\", если баки действительно полные — продолжайте\n2️⃣ Полностью выключите принтер, подождите минуту и включите снова — это заставит датчик перечитать состояние\n3️⃣ Протрите окошко бака (стекло/пластик) снаружи мягкой тканью, проверьте отсутствие пыли или капель чернил\n4️⃣ Если на панели есть \"Ink Level Reset\" или \"Maintenance\" — вручную подтвердите уровень бака\n5️⃣ Обновите прошивку через официальную программу Epson\n6️⃣ Если не помогает — возможна неисправность внутреннего оптического датчика, нужна диагностика у мастера"}, {"label_uz": "🖨️ Epson: Chop etish juda sekin / to'xtab-to'xtab boradi", "label_ru": "🖨️ Epson: Печать очень медленная / с остановками", "text_uz": "🖨️ *EPSON (RANGLI) — CHOP ETISH JUDA SEKIN / TO'XTAB-TO'XTAB BORADI*\n\n🔍 *Keng tavsif:*\nPrinter chop etadi, lekin juda sekin ishlaydi yoki har bir qatordan so'ng to'xtab-to'xtab davom etadi. Sabab — yuqori sifat rejimi tanlangani, bufer/xotira yetishmasligi, USB/Wi-Fi ulanish sekinligi yoki bosh (printhead) qisman tiqilgani bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Print sozlamalarida sifatni \"Standard\"/\"Draft\" rejimiga tushiring\n2️⃣ Nozzle Check bajarib, bosh qisman tiqilmaganini tekshiring — tiqilgan bo'lsa Head Cleaning qiling (bu sekinlashishga sabab bo'lishi mumkin)\n3️⃣ Wi-Fi orqali ulangan bo'lsa, USB kabelga o'tkazib tezlikni solishtiring\n4️⃣ Drayverni eng so'nggi versiyaga yangilang\n5️⃣ Katta hajmli rasm/fayllarni chop etishdan oldin siqing\n6️⃣ Kompyuterda fon dasturlari (antivirus va h.k.) resursni band qilmayotganini tekshiring", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — ПЕЧАТЬ ОЧЕНЬ МЕДЛЕННАЯ / С ОСТАНОВКАМИ*\n\n🔍 *Подробное описание:*\nПринтер печатает, но очень медленно или останавливается после каждой строки. Причина — выбран режим высокого качества, нехватка буфера/памяти, медленное USB/Wi-Fi соединение или частичное засорение печатающей головки.\n\n✅ *Подробное решение:*\n1️⃣ В настройках печати снизьте качество до \"Standard\"/\"Draft\"\n2️⃣ Выполните Nozzle Check, проверьте засорение головки — при засорении выполните Head Cleaning (это может быть причиной замедления)\n3️⃣ Если подключено по Wi-Fi, сравните скорость с USB-кабелем\n4️⃣ Обновите драйвер до последней версии\n5️⃣ Сжимайте большие файлы изображений перед печатью\n6️⃣ Проверьте, не занимают ли ресурсы компьютера фоновые программы (антивирус и т.д.)"}, {"label_uz": "🖨️ Epson: Printer umuman yonmayapti", "label_ru": "🖨️ Epson: Принтер вообще не включается", "text_uz": "🖨️ *EPSON (RANGLI) — PRINTER UMUMAN YONMAYDI*\n\n🔍 *Keng tavsif:*\nTugma bosilganda printer hech qanday belgi bermaydi — chiroq yonmaydi, ovoz chiqmaydi. Sabab — quvvat kabeli/adapter nosoz, rozetkada tok yo'q yoki printer ichidagi quvvat blogi (power supply) ishdan chiqqan bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Quvvat kabelini boshqa rozetkaga ulab tekshiring — rozetkaning o'zi ishlab turganiga ishonch hosil qiling (boshqa qurilma bilan sinang)\n2️⃣ Kabel va adapterni ko'zdan kechiring — kuygan hid, yorilgan joy yoki egilgan sim bo'lsa, ishlatmang\n3️⃣ Agar ajratiladigan quvvat kabeli bo'lsa, uni boshqa mos kabel bilan almashtirib ko'ring\n4️⃣ Printerni 10 daqiqa quvvatdan uzib turing, so'ng qayta ulang\n5️⃣ Yuqoridagilar yordam bermasa, printer ichidagi quvvat blogi (power supply board) nosoz — bu foydalanuvchi tomonidan tuzatib bo'lmaydigan ta'mir, ustaxonaga olib boring", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — ПРИНТЕР ВООБЩЕ НЕ ВКЛЮЧАЕТСЯ*\n\n🔍 *Подробное описание:*\nПри нажатии кнопки принтер никак не реагирует — индикатор не загорается, звука нет. Причина — неисправен кабель питания/адаптер, нет тока в розетке или вышел из строя блок питания внутри принтера.\n\n✅ *Подробное решение:*\n1️⃣ Подключите кабель питания к другой розетке — убедитесь, что сама розетка работает (проверьте другим устройством)\n2️⃣ Осмотрите кабель и адаптер — при запахе гари, трещинах или переломе провода не используйте их\n3️⃣ Если кабель питания съёмный, попробуйте заменить его на другой подходящий\n4️⃣ Отключите принтер от питания на 10 минут, затем включите снова\n5️⃣ Если ничего не помогает — неисправен блок питания внутри принтера, самостоятельно не устраняется, обратитесь к мастеру"}, {"label_uz": "🖨️ Epson: CISS/tank tizimidan siyoh oqib chiqadi", "label_ru": "🖨️ Epson: Протекают чернила из СНПЧ/бака", "text_uz": "🖨️ *EPSON (RANGLI) — CISS/TANK TIZIMIDAN SIYOH OQIB CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter tanklari yoki naychalar atrofida siyoh tomchilari yoki dog'lar ko'rinadi. Sabab — tank qopqog'i to'liq yopilmagan, naycha yorilgan/uzilgan, havo tiqilib qolib bosim hosil bo'lgan yoki tank ortiqcha to'ldirilgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni darhol o'chiring va atrofdagi siyohni quruq mato bilan arting\n2️⃣ Har bir tank qopqog'i to'liq va mahkam yopilganini tekshiring\n3️⃣ Naychalarni ko'zdan kechiring — yorilgan, ezilgan yoki ulanishdan chiqqan joy bo'lsa, buni o'zingiz ta'mirlashga urinmang\n4️⃣ Tank \"MAX\" chizig'idan oshiб to'ldirilmaganini tekshiring — ortiqcha siyoh bosim ostida sizib chiqishi mumkin\n5️⃣ Printer transport (tashish) rejimida bo'lmagan holda siljitilgan yoki yiqilgan bo'lsa, ichki naycha uzilishi mumkin\n6️⃣ Sizish davom etsa yoki naycha shikastlangan bo'lsa — printerni ishlatishni to'xtating va ustaxonaga olib boring, chunki siyoh elektron qismlarga tegib jiddiy zarar yetkazishi mumkin", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — ПРОТЕКАЮТ ЧЕРНИЛА ИЗ СНПЧ/БАКА*\n\n🔍 *Подробное описание:*\nВокруг баков или трубок принтера видны капли или пятна чернил. Причина — крышка бака закрыта не до конца, повреждена/отсоединена трубка, образовалась воздушная пробка с давлением или бак переполнен.\n\n✅ *Подробное решение:*\n1️⃣ Немедленно выключите принтер и вытрите чернила сухой тканью\n2️⃣ Проверьте, что крышка каждого бака полностью и плотно закрыта\n3️⃣ Осмотрите трубки — при обнаружении трещин, пережатия или отсоединения не пытайтесь чинить самостоятельно\n4️⃣ Убедитесь, что бак не залит выше отметки \"MAX\" — избыток чернил может просачиваться под давлением\n5️⃣ Если принтер перемещали или роняли не в транспортном режиме, внутренняя трубка могла отсоединиться\n6️⃣ Если протечка продолжается или трубка повреждена — прекратите использование и обратитесь к мастеру, так как чернила могут серьёзно повредить электронику"}]}, {"name": "🖨️ Brother (rangli)", "items": [{"label_uz": "🖨️ Brother: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Brother: Выходит пустой лист", "text_uz": "🖨️ *BROTHER (RANGLI) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nBrother printer qog'ozni chop etadi, lekin varaqda hech narsa ko'rinmaydi. Sabab — kartrijdagi himoya lentasi olinmagani, nozzle tiqilgani yoki siyoh tugagani.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, pastki himoya lentasi olib tashlanganini tekshiring\n2️⃣ Printer paneli/Brother iPrint&Scan orqali \"Cleaning\" funksiyasini ishga tushiring\n3️⃣ Test Print (sinov chop etish) sahifasini bosib chiqaring — qaysi rang chiqmayotganini aniqlang\n4️⃣ Kartrij kontaktlarini quruq mato bilan artib qaytadan o'rnating\n5️⃣ Siyoh darajasini tekshiring, kerak bo'lsa kartrijni almashtiring\n6️⃣ Bir necha marta tozalashdan keyin ham natija bo'lmasa — bosh tiqilib qolgan, ustaga olib boring", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер Brother печатает, но на листе ничего не видно. Причина — не снята защитная лента с картриджа, засорены дюзы или закончились чернила.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, проверьте, снята ли нижняя защитная лента\n2️⃣ Через панель принтера или Brother iPrint&Scan запустите функцию \"Cleaning\"\n3️⃣ Распечатайте тестовую страницу — определите, какой цвет не выходит\n4️⃣ Протрите контакты картриджа сухой тканью и установите обратно\n5️⃣ Проверьте уровень чернил, при необходимости замените картридж\n6️⃣ Если несколько чисток не помогли — головка забита, обратитесь к мастеру"}, {"label_uz": "🖨️ Brother: Ranglar noto'g'ri chiqadi", "label_ru": "🖨️ Brother: Цвета выходят неправильно", "text_uz": "🖨️ *BROTHER (RANGLI) — RANGLAR NOTO'G'RI CHIQADI*\n\n🔍 *Keng tavsif:*\nChop etilgan rasm ranglari haqiqatdagidan farq qiladi yoki xira/aralashgan ko'rinadi. Sabab — nozzle qisman tiqilgani, rang profili sozlamasi yoki kartrij muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Test Print orqali qaysi rang zaif/noto'g'ri ekanini aniqlang\n2️⃣ Cleaning funksiyasini 2-3 marta ketma-ket bajaring\n3️⃣ Kompyuter drayveridagi rang boshqaruvi (Color Management) sozlamasini \"Avtomatik\" ga qaytaring\n4️⃣ Qog'oz turi sozlamasini tekshiring — foto qog'oz uchun boshqa, oddiy qog'oz uchun boshqa profil kerak\n5️⃣ Kartrijni almashtirib ko'ring — ayniqsa noorigin siyoh ranglarni buzadi\n6️⃣ Yordam bermasa, print bosh moduli tekshirilishi kerak — ustaxonaga murojaat qiling", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — ЦВЕТА ВЫХОДЯТ НЕПРАВИЛЬНО*\n\n🔍 *Подробное описание:*\nЦвета на отпечатке отличаются от реальных или выглядят блёклыми/смешанными. Причина — частичное засорение дюз, настройки цветового профиля или проблема с картриджем.\n\n✅ *Подробное решение:*\n1️⃣ Тестовой печатью определите, какой цвет слабый/неправильный\n2️⃣ Выполните Cleaning 2-3 раза подряд\n3️⃣ В настройках драйвера верните Color Management в режим \"Автоматически\"\n4️⃣ Проверьте тип бумаги — для фотобумаги и обычной бумаги нужны разные профили\n5️⃣ Попробуйте заменить картридж — особенно неоригинальные чернила искажают цвет\n6️⃣ Если не помогает — нужна проверка печатающего модуля, обратитесь к мастеру"}, {"label_uz": "🖨️ Brother: \"Unable to print\" / kartrij xatosi", "label_ru": "🖨️ Brother: \"Unable to print\" / ошибка картриджа", "text_uz": "🖨️ *BROTHER (RANGLI) — \"UNABLE TO PRINT\" / KARTRIJ XATOSI*\n\n🔍 *Keng tavsif:*\nEkranda \"Unable to Print XX\" yoki kartrij bilan bog'liq xato kodi chiqadi, printer chop etishdan bosh tortadi. Sabab — kartrij noto'g'ri o'rnatilgan, chip nosoz yoki ichki mexanizm xatosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Xato kodini yozib oling (masalan \"Unable to Print 46\", \"48\" va h.k.) — bu Brother saytida aniq izohga ega\n2️⃣ Printerni o'chirib, kartrijlarni chiqarib qayta \"klik\" ovozi bilan o'rnating\n3️⃣ Printerni elektr tarmog'idan 1 daqiqaga uzib, qayta ulang\n4️⃣ Agar xato siyoh purge (chiqindi) tizimi bilan bog'liq bo'lsa (masalan \"Ink absorber\"), bu ustaxonada texnik xizmat talab qiladi\n5️⃣ O'zingiz servis dasturisiz \"reset\" qilishga urinmang — noto'g'ri bajarilsa xato takrorlanaveradi\n6️⃣ Xato kodi bo'yicha aniq yechim topilmasa, ustaxonaga diagnostikaga olib boring", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — \"UNABLE TO PRINT\" / ОШИБКА КАРТРИДЖА*\n\n🔍 *Подробное описание:*\nНа экране появляется \"Unable to Print XX\" или код ошибки, связанный с картриджем, принтер отказывается печатать. Причина — картридж установлен неправильно, неисправен чип или ошибка внутреннего механизма.\n\n✅ *Подробное решение:*\n1️⃣ Запишите код ошибки (например \"Unable to Print 46\", \"48\" и т.д.) — по нему есть точное описание на сайте Brother\n2️⃣ Выключите принтер, извлеките картриджи и заново установите до щелчка\n3️⃣ Отключите принтер от сети на 1 минуту и включите снова\n4️⃣ Если ошибка связана с системой отвода чернил (например \"Ink absorber\") — нужно техническое обслуживание у мастера\n5️⃣ Не пытайтесь сбросить счётчик без сервисной программы — при ошибке код будет появляться снова\n6️⃣ Если по коду не удаётся найти решение — отвезите принтер на диагностику к мастеру"}, {"label_uz": "🖨️ Brother: Qog'oz qisilib qoladi", "label_ru": "🖨️ Brother: Замятие бумаги", "text_uz": "🖨️ *BROTHER (RANGLI) — QOG'OZ QISILIB QOLADI*\n\n🔍 *Keng tavsif:*\nChop etish jarayonida qog'oz yo'lda tiqilib qoladi, \"Paper Jam\" xabari chiqadi. Sabab — rolik yeyilgani, qog'oz sifatsiz yoki noto'g'ri joylashtirilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, orqa/old qopqoqni ochib, qisilgan qog'ozni yo'nalishi bo'yicha asta torting\n2️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n3️⃣ Qog'oz lotogini yarmigacha to'ldiring, cheklagichlarni to'g'ri sozlang\n4️⃣ Bukilgan yoki namiqqan qog'ozdan foydalanmang\n5️⃣ Printer ichida mayda qog'oz bo'lagi qolmaganini tekshiring\n6️⃣ Takrorlansa — rolik almashtirilishi kerak, oddiy va tez ta'mir", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — ЗАМЯТИЕ БУМАГИ*\n\n🔍 *Подробное описание:*\nВо время печати бумага застревает, появляется сообщение \"Paper Jam\". Причина — износ ролика, некачественная бумага или неправильная загрузка.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте заднюю/переднюю крышку и аккуратно извлеките застрявшую бумагу по направлению движения\n2️⃣ Протрите ролик слегка влажной тканью от пыли\n3️⃣ Заполняйте лоток наполовину, правильно выставьте направляющие\n4️⃣ Не используйте мятую или влажную бумагу\n5️⃣ Проверьте, не остались ли внутри мелкие кусочки бумаги\n6️⃣ Если повторяется — нужна замена ролика, простой и быстрый ремонт"}, {"label_uz": "🖨️ Brother: Wi-Fi ulanmaydi", "label_ru": "🖨️ Brother: Не подключается к Wi-Fi", "text_uz": "🖨️ *BROTHER (RANGLI) — WI-FI ULANMAYDI*\n\n🔍 *Keng tavsif:*\nPrinter Wi-Fi tarmog'iga ulanmaydi yoki ulanish tez-tez uziladi. Sabab — noto'g'ri parol/tarmoq nomi, 5GHz tarmoqqa ulanishga urinish yoki router masofasi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer panelidan Network → WLAN Setup Wizard orqali tarmoqni qaytadan sozlang\n2️⃣ Faqat 2.4GHz tarmoqqa ulaning (5GHz ko'p Brother modellarida qo'llab-quvvatlanmaydi)\n3️⃣ Printer va routerni bir-biriga yaqinroq joylashtiring — masofa yoki devor signalni zaiflashtirishi mumkin\n4️⃣ Router va printerni qayta ishga tushiring\n5️⃣ Brother iPrint&Scan ilovasi orqali printerni qayta qidiring\n6️⃣ Yordam bermasa, USB orqali vaqtincha ulang va ustadan tarmoq sozlashni so'rang", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — НЕ ПОДКЛЮЧАЕТСЯ К WI-FI*\n\n🔍 *Подробное описание:*\nПринтер не подключается к Wi-Fi или соединение часто обрывается. Причина — неверный пароль/имя сети, попытка подключения к 5GHz или удалённость от роутера.\n\n✅ *Подробное решение:*\n1️⃣ На панели принтера через Network → WLAN Setup Wizard заново настройте сеть\n2️⃣ Подключайтесь только к сети 2.4GHz (5GHz не поддерживается многими моделями Brother)\n3️⃣ Расположите принтер ближе к роутеру — расстояние или стены ослабляют сигнал\n4️⃣ Перезагрузите роутер и принтер\n5️⃣ Через приложение Brother iPrint&Scan повторите поиск принтера\n6️⃣ Если не помогает — временно подключитесь через USB и обратитесь к мастеру для настройки сети"}, {"label_uz": "🖨️ Brother: Doim \"Cleaning\" holatida qotib qoladi", "label_ru": "🖨️ Brother: Постоянно висит в режиме \"Cleaning\"", "text_uz": "🖨️ *BROTHER (RANGLI) — DOIM \"CLEANING\" HOLATIDA QOTIB QOLADI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilganda doimo \"Cleaning\" yoki \"Please Wait\" holatida qotib qoladi, chop etishga o'tmaydi. Sabab — tozalash tsikli tugamayapti, kartrij/purge tizimida siyoh oqimi buzilgan yoki dastur xatosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni to'liq o'chirib, elektr shnurini 2-3 daqiqaga rozetkadan chiqarib, qayta ulang\n2️⃣ Kartrijlarni chiqarib, ularning to'g'ri o'rnatilganini va zarar ko'rmaganini tekshiring\n3️⃣ Printer paneli orqali \"Factory Reset\" (zavod sozlamalariga qaytarish) imkoniyati bo'lsa, uni bajarib ko'ring\n4️⃣ Xatolik davom etsa, bu odatda purge/pump mexanizmi yoki siyoh yostiqchasi muammosi — o'zingiz tuzatib bo'lmaydi\n5️⃣ Ustaxonaga olib boring — texnik xizmat dasturi orqali diagnostika va kerakli qism (pump/pad) almashtiriladi", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — ПОСТОЯННО ВИСИТ В РЕЖИМЕ \"CLEANING\"*\n\n🔍 *Подробное описание:*\nПри включении принтер постоянно находится в состоянии \"Cleaning\" или \"Please Wait\" и не переходит к печати. Причина — цикл очистки не завершается, нарушен поток чернил в системе отвода или программный сбой.\n\n✅ *Подробное решение:*\n1️⃣ Полностью выключите принтер, выньте шнур из розетки на 2-3 минуты и включите снова\n2️⃣ Извлеките картриджи, проверьте правильность установки и отсутствие повреждений\n3️⃣ Если на панели есть опция \"Factory Reset\" (сброс к заводским настройкам) — попробуйте выполнить её\n4️⃣ Если ошибка сохраняется — обычно это проблема насоса отвода чернил или впитывающей подушки, самостоятельно не устраняется\n5️⃣ Обратитесь к мастеру — через сервисную программу проведут диагностику и заменят нужную деталь (насос/подушку)"}, {"label_uz": "🖨️ Brother: \"Ink absorber almost full\" xabari", "label_ru": "🖨️ Brother: Сообщение \"Ink absorber almost full\"", "text_uz": "🖨️ *BROTHER (RANGLI) — \"INK ABSORBER ALMOST FULL\" XABARI*\n\n🔍 *Keng tavsif:*\nEkranda yoki dasturda \"Ink absorber almost full\" yoki \"Ink absorber box is full\" degan ogohlantirish chiqadi. Bu Canon/Epson'dagi kabi chiqindi siyoh yostiqchasi to'lib borayotganini bildiradi — davom etilsa printer to'xtab qoladi.\n\n✅ *Batafsil yechim:*\n1️⃣ Bu ogohlantirish bosqichida hali chop etish davom etadi, lekin tez orada to'liq to'xtaydi — kechiktirmasdan chora ko'ring\n2️⃣ Brother printerlari uchun rasmiy \"Ink Absorber Reset\" yoki servis dasturi orqali hisoblagichni reset qilish talab qilinadi\n3️⃣ Reset qilishdan oldin, ustaxonada yostiqcha (pad) fizik jihatdan almashtirilishi yoki tozalanishi shart — aks holda siyoh printer ichiga oqib zarar yetkazadi\n4️⃣ O'zingiz dastursiz reset qilishga urinmang — noto'g'ri bajarilsa boshqa xatoliklar chiqishi mumkin\n5️⃣ Ustaxonaga olib boring — pad almashtirish va servis dasturi orqali reset birga bajariladi", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — СООБЩЕНИЕ \"INK ABSORBER ALMOST FULL\"*\n\n🔍 *Подробное описание:*\nНа экране или в программе появляется предупреждение \"Ink absorber almost full\" или \"Ink absorber box is full\". Как и у Canon/Epson, это означает, что поглотитель отработанных чернил заполняется — при продолжении принтер остановится.\n\n✅ *Подробное решение:*\n1️⃣ На этом этапе печать пока продолжается, но скоро полностью остановится — не откладывайте решение\n2️⃣ Для принтеров Brother требуется сброс счётчика через официальную функцию \"Ink Absorber Reset\" или сервисную программу\n3️⃣ Перед сбросом у мастера должен быть физически заменён или очищен поглотитель (pad) — иначе чернила протекут внутрь принтера и повредят его\n4️⃣ Не пытайтесь сбросить счётчик самостоятельно без программы — при ошибке могут появиться новые сбои\n5️⃣ Обратитесь к мастеру — замена поглотителя и сброс через сервисную программу выполняются вместе"}, {"label_uz": "🖨️ Brother: Chop sifati past, chiziqlar bor", "label_ru": "🖨️ Brother: Низкое качество печати, полосы", "text_uz": "🖨️ *BROTHER (RANGLI) — CHOP SIFATI PAST, CHIZIQLAR BOR*\n\n🔍 *Keng tavsif:*\nChop etilgan sahifada gorizontal chiziqlar, oqargan joylar yoki notekis rang ko'rinadi. Sabab — nozzle qisman tiqilgani, print bosh moslashtirilmagani (alignment) yoki kartrijda siyoh kam qolgani bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer paneli yoki dasturi orqali Nozzle Check (purkagich tekshiruvi) sahifasini chop eting\n2️⃣ Head Cleaning funksiyasini ishga tushiring, natija yaxshilanmasa 2-3 marta orasida tanaffus bilan takrorlang\n3️⃣ Print Head Alignment (bosh moslashtirish)ni bajaring\n4️⃣ Har bir rang kartrijining siyoh darajasini tekshiring, kam bo'lsa almashtiring\n5️⃣ Original bo'lmagan siyoh/kartrij nozzle'ni tezroq tiqishi mumkin — sifatli mahsulotga o'ting\n6️⃣ Chiziqlar davom etsa, bosh eskirgan yoki chuqur tiqilgan — ustaxonada professional tozalash kerak", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — НИЗКОЕ КАЧЕСТВО ПЕЧАТИ, ПОЛОСЫ*\n\n🔍 *Подробное описание:*\nНа отпечатке видны горизонтальные полосы, выцветшие участки или неравномерный цвет. Причина — частичное засорение дюз, сбой выравнивания головки или заканчиваются чернила в картридже.\n\n✅ *Подробное решение:*\n1️⃣ Через панель принтера или программу распечатайте тест дюз (Nozzle Check)\n2️⃣ Запустите Head Cleaning, при отсутствии результата повторите 2-3 раза с паузой\n3️⃣ Выполните Print Head Alignment (выравнивание головки)\n4️⃣ Проверьте уровень чернил каждого картриджа, при нехватке замените\n5️⃣ Неоригинальные чернила/картриджи быстрее забивают дюзы — перейдите на качественные\n6️⃣ Если полосы остаются — головка изношена или сильно забита, нужна профессиональная чистка у мастера"}, {"label_uz": "🖨️ Brother: LCD ekran muzlab/qorayib qoladi", "label_ru": "🖨️ Brother: Экран зависает / гаснет", "text_uz": "🖨️ *BROTHER (RANGLI) — LCD EKRAN MUZLAB/QORAYIB QOLADI*\n\n🔍 *Keng tavsif:*\nPrinter paneli (LCD ekran) yoqilganda qorayib qoladi, muzlaydi yoki hech qanday buyruqqa javob bermaydi, garchi printer o'zi ishlab tursa ham. Sabab — dastur (firmware) osilishi, ekran kabeli bo'shashgani yoki quvvat beqarorligi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni tugma orqali emas, to'liq quvvatdan (rozetkadan) uzib, 2-3 daqiqadan so'ng qayta ulang — bu qattiq \"reset\" beradi\n2️⃣ Elektr tarmog'i barqarorligini tekshiring — stabilizator ishlatish tavsiya etiladi\n3️⃣ Printer firmware'ini Brother rasmiy dasturi orqali eng so'nggi versiyaga yangilang\n4️⃣ Muammo qayta-qayta takrorlansa, ekran paneli ichidagi kabel ulanishi bo'shashgan bo'lishi mumkin\n5️⃣ Yordam bermasa — ekran moduli yoki boshqaruv platasi nosoz, ustaxonada diagnostika kerak", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — ЭКРАН ЗАВИСАЕТ / ГАСНЕТ*\n\n🔍 *Подробное описание:*\nПанель принтера (LCD экран) при включении гаснет, зависает или не реагирует на команды, хотя сам принтер работает. Причина — зависание прошивки, ослабленный кабель экрана или нестабильное питание.\n\n✅ *Подробное решение:*\n1️⃣ Отключите принтер полностью от питания (не кнопкой) на 2-3 минуты и включите снова — это даст жёсткий сброс\n2️⃣ Проверьте стабильность электросети — рекомендуется использовать стабилизатор\n3️⃣ Обновите прошивку принтера через официальную программу Brother\n4️⃣ Если проблема повторяется регулярно, возможно ослаблен кабель внутри панели экрана\n5️⃣ Если не помогает — неисправен модуль экрана или плата управления, нужна диагностика у мастера"}, {"label_uz": "🖨️ Brother: Skaner/faks ishlamayapti", "label_ru": "🖨️ Brother: Сканер/факс не работает", "text_uz": "🖨️ *BROTHER (RANGLI) — SKANER/FAKS ISHLAMAYAPTI*\n\n🔍 *Keng tavsif:*\nKo'p funksiyali Brother printerda chop etish ishlaydi, lekin skanerlash yoki faks funksiyasi xato beradi yoki umuman ishga tushmaydi. Sabab — dastur (ControlCenter/iPrint&Scan) o'rnatilmagan, telefon liniyasi ulanmagan (faks uchun) yoki skaner mexanizmi nosoz.\n\n✅ *Batafsil yechim:*\n1️⃣ Brother iPrint&Scan yoki ControlCenter dasturini kompyuter/telefonga o'rnating yoki yangilang\n2️⃣ Skaner shishasini yumshoq, quruq mato bilan artib, chang/dog' yo'qligini tekshiring\n3️⃣ Faks ishlamasa, telefon liniyasi kabeli printerga va devor rozetkasiga to'g'ri ulanganini tekshiring\n4️⃣ Printerni qayta ishga tushiring, USB/tarmoq ulanishini qayta tekshiring\n5️⃣ Windows/Mac'da skaner drayverini alohida qayta o'rnating\n6️⃣ Davom etsa, skaner yoki faks moduli mexanik jihatdan nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *BROTHER (ЦВЕТНОЙ) — СКАНЕР/ФАКС НЕ РАБОТАЕТ*\n\n🔍 *Подробное описание:*\nНа МФУ Brother печать работает, но сканирование или факс выдаёт ошибку или вообще не запускается. Причина — не установлена программа (ControlCenter/iPrint&Scan), не подключена телефонная линия (для факса) или неисправен механизм сканера.\n\n✅ *Подробное решение:*\n1️⃣ Установите или обновите Brother iPrint&Scan или ControlCenter на компьютере/телефоне\n2️⃣ Протрите стекло сканера мягкой сухой тканью, проверьте отсутствие пыли/пятен\n3️⃣ Если не работает факс, проверьте подключение телефонного кабеля к принтеру и настенной розетке\n4️⃣ Перезапустите принтер, заново проверьте USB/сетевое подключение\n5️⃣ Переустановите отдельно драйвер сканера в Windows/Mac\n6️⃣ Если не помогает — механически неисправен модуль сканера или факса, нужна диагностика у мастера"}]}]}, {"id": "lazer", "name_uz": "Lazer printer", "name_ru": "Лазерный принтер", "brands": [{"name": "🖨️ HP (lazer)", "items": [{"label_uz": "🖨️ HP-L: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ HP-L: Выходит пустой лист", "text_uz": "🖨️ *HP (LAZER) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter qog'ozni tortadi, lekin varaqda hech narsa chop etilmaydi yoki juda xira iz qoladi. Lazer printerlarda bu odatda toner kartriji bo'sh bo'lgani, kartrijdagi muhrlovchi lenta olinmagani yoki yuklash (transfer) g'ildiragi nosozligi sababli bo'ladi.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, uning yon tomonidagi muhrlovchi lentani (sealing tape) to'liq olib tashlanganini tekshiring — yangi kartrijlarda bu tez-tez unutiladi\n2️⃣ Kartrijni chiqarib, chapdan o'ngga 5-6 marta asta silkiting — toner notekis taqsimlangan bo'lishi mumkin\n3️⃣ Toner darajasini printer paneli/dasturi orqali tekshiring, agar 0% bo'lsa kartrijni almashtiring\n4️⃣ Test sahifasini (Configuration/Test Page) chop etib, muammo davom etayotganini tasdiqlang\n5️⃣ Yuklash g'ildiragi (transfer roller) yoki drum aylanmayotgan bo'lsa, printer ichidan g'ildirak harakatini eshitib/ko'rib tekshiring\n6️⃣ Yordam bermasa — drum yoki yuklash bloki nosoz, ustaxonada tekshirilishi kerak", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер захватывает бумагу, но ничего не печатает или печать почти незаметна. У лазерных принтеров обычно причина — пустой тонер-картридж, не снята защитная лента с картриджа или неисправен ролик переноса.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и проверьте, полностью ли снята защитная лента (sealing tape) сбоку — на новых картриджах это частая забывчивость\n2️⃣ Извлеките картридж и покачайте его из стороны в сторону 5-6 раз — тонер мог распределиться неравномерно\n3️⃣ Проверьте уровень тонера через панель/программу принтера, при 0% замените картридж\n4️⃣ Распечатайте тестовую страницу (Configuration/Test Page), убедитесь, что проблема сохраняется\n5️⃣ Проверьте, вращается ли ролик переноса (transfer roller) или барабан — прислушайтесь/присмотритесь при печати\n6️⃣ Если не помогает — неисправен барабан или узел переноса, нужна проверка у мастера"}, {"label_uz": "🖨️ HP-L: Chiziqlar, dog'lar chop etiladi", "label_ru": "🖨️ HP-L: Полосы, пятна на печати", "text_uz": "🖨️ *HP (LAZER) — CHIZIQLAR, DOG'LAR CHOP ETILADI*\n\n🔍 *Keng tavsif:*\nChop etilgan varaqda takrorlanuvchi vertikal chiziqlar, doiralar yoki qora/oq dog'lar ko'rinadi. Sabab — drum (fotoval) tirnalgani yoki ifloslangani, tozalash pichog'i (cleaning blade) yeyilgani yoki fyuzerda toner qoldig'i to'planib qolgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drum (yashil yoki jigarrang aylanuvchi silindr) yuzasini yorug'likka tutib ko'ring — tirnalgan yoki dog' bormi?\n2️⃣ Chiziqlar orasidagi masofani o'lchang — bu drum yoki fyuzer diametriga mos kelsa, aynan o'sha qism nosoz ekanini bildiradi\n3️⃣ Kartrijni yumshoq, quruq mato bilan tashqi tomondan (drumga tegmasdan) changdan tozalang\n4️⃣ Sifatsiz qayta to'ldirilgan kartrij ishlatilgan bo'lsa, drum tezroq shikastlanadi — original yoki sifatli kartrijga o'ting\n5️⃣ Muammo davom etsa, drum yoki tozalash pichog'i almashtirilishi kerak — bu ustaxonada bajariladigan ta'mir", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ПОЛОСЫ, ПЯТНА НА ПЕЧАТИ*\n\n🔍 *Подробное описание:*\nНа отпечатке видны повторяющиеся вертикальные полосы, круги или чёрные/белые пятна. Причина — поцарапан или загрязнён барабан (drum), изношено чистящее лезвие (cleaning blade) или в печке (fuser) скопился остаток тонера.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и осмотрите поверхность барабана (зелёный/коричневый вращающийся цилиндр) на свету — есть царапины или пятна?\n2️⃣ Измерьте расстояние между полосами — если оно совпадает с диаметром барабана или печки, значит неисправен именно этот узел\n3️⃣ Протрите картридж снаружи мягкой сухой тканью от пыли, не касаясь барабана\n4️⃣ Некачественный перезаправленный картридж быстрее повреждает барабан — перейдите на оригинальный или качественный картридж\n5️⃣ Если не помогает — нужна замена барабана или чистящего лезвия, это ремонт у мастера"}, {"label_uz": "🖨️ HP-L: \"Cartridge is not genuine\" xabari", "label_ru": "🖨️ HP-L: Сообщение \"Cartridge is not genuine\"", "text_uz": "🖨️ *HP (LAZER) — \"CARTRIDGE IS NOT GENUINE\" XABARI*\n\n🔍 *Keng tavsif:*\nEkranda \"The cartridge is not genuine HP\" yoki shunga o'xshash ogohlantirish chiqadi. Bu odatda xato emas, balki HP ning original bo'lmagan yoki qayta to'ldirilgan kartrijlarni aniqlash tizimi. Ko'p hollarda printer baribir ishlayveradi, lekin ba'zi modellarda chop etishni bloklashi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Xabarni yopib, \"Continue\" yoki \"OK\" tugmasini bosing — printer ko'p hollarda shunchaki ishlashda davom etadi\n2️⃣ Printer sozlamalarida \"Cartridge Policy\" yoki \"Supply Notifications\" bo'limini toping va uni \"Continue\" holatiga o'zgartiring (agar mavjud bo'lsa)\n3️⃣ Kartrij chipi zararlangan bo'lsa, printer chop etishni butunlay rad etishi mumkin — original yoki yangi chipli kartrijga almashtiring\n4️⃣ Firmware yangilanishi original bo'lmagan kartrijlarni yanada qattiqroq bloklashi mumkin — bu haqda ustadan maslahat oling\n5️⃣ Doimiy original kartrij ishlatish — bu xabarni butunlay yo'q qiladi va chop etish sifatini yaxshilaydi", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — СООБЩЕНИЕ \"CARTRIDGE IS NOT GENUINE\"*\n\n🔍 *Подробное описание:*\nНа экране появляется \"The cartridge is not genuine HP\" или похожее предупреждение. Обычно это не ошибка, а система HP для определения неоригинальных или перезаправленных картриджей. Часто принтер продолжает работать, но на некоторых моделях печать может блокироваться.\n\n✅ *Подробное решение:*\n1️⃣ Закройте сообщение и нажмите \"Continue\" или \"OK\" — принтер обычно продолжает работать\n2️⃣ В настройках принтера найдите \"Cartridge Policy\" или \"Supply Notifications\" и переключите на \"Continue\" (если доступно)\n3️⃣ Если чип картриджа повреждён, принтер может полностью отказаться печатать — замените на оригинальный или картридж с новым чипом\n4️⃣ Обновление прошивки может усилить блокировку неоригинальных картриджей — проконсультируйтесь с мастером\n5️⃣ Постоянное использование оригинального картриджа полностью убирает это сообщение и улучшает качество печати"}, {"label_uz": "🖨️ HP-L: Qog'oz qisilib qoladi (jam)", "label_ru": "🖨️ HP-L: Замятие бумаги (jam)", "text_uz": "🖨️ *HP (LAZER) — QOG'OZ QISILIB QOLADI (JAM)*\n\n🔍 *Keng tavsif:*\nChop etish jarayonida qog'oz yo'lda tiqilib qoladi, \"Paper Jam\" xabari chiqadi. Lazer printerlarda bu rolik yeyilgani, qog'oz namligi yoki fyuzer ichida qog'oz qolib ketgani sababli bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, barcha qopqoqlarni ochib qisilgan qog'ozni yo'nalishi bo'yicha asta, yirtib qoldirmasdan torting\n2️⃣ Fyuzer (isitish) blokini ham tekshiring — bu odatda orqa tomonda, issiq bo'lishi mumkin, ehtiyot bo'ling\n3️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n4️⃣ Namlangan, bukilgan yoki juda qalin qog'ozdan foydalanmang — lazer printer uchun mos (80 gr/m² atrofida) qog'oz ishlating\n5️⃣ Lotokka ko'p qog'oz solmang va cheklagichlarni to'g'ri sozlang\n6️⃣ Takrorlansa, tortuvchi yoki uzatuvchi rolik almashtirilishi kerak — ustaxonada bajariladigan oddiy ta'mir", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ЗАМЯТИЕ БУМАГИ (JAM)*\n\n🔍 *Подробное описание:*\nВо время печати бумага застревает, появляется сообщение \"Paper Jam\". У лазерных принтеров причина — износ ролика, влажность бумаги или бумага застряла внутри печки (fuser).\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте все крышки и аккуратно, не разрывая, извлеките застрявшую бумагу по направлению движения\n2️⃣ Проверьте также блок печки (fuser) — обычно сзади, он может быть горячим, будьте осторожны\n3️⃣ Протрите ролик слегка влажной тканью от пыли\n4️⃣ Не используйте влажную, мятую или слишком плотную бумагу — для лазерного принтера подходит бумага около 80 г/м²\n5️⃣ Не перегружайте лоток, правильно выставьте направляющие\n6️⃣ Если повторяется — нужна замена ролика захвата или подачи, простой ремонт у мастера"}, {"label_uz": "🖨️ HP-L: Doim \"Paper Jam\" — qog'oz bo'lmasa ham", "label_ru": "🖨️ HP-L: Постоянно \"Paper Jam\" без бумаги", "text_uz": "🖨️ *HP (LAZER) — DOIM \"PAPER JAM\" — QOG'OZ BO'LMASA HAM*\n\n🔍 *Keng tavsif:*\nPrinter qog'oz to'liq olib tashlangan holatda ham \"Paper Jam\" xatosini ko'rsataveradi. Sabab — qog'oz sezgichi (sensor) nosoz, sinib qolgan yoki changga botib qolgan, yoxud ichkarida ko'zga ko'rinmaydigan mayda qog'oz bo'lagi qolgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Barcha qopqoqlarni ochib, fonar yordamida printer ichini diqqat bilan tekshiring — mayda qog'oz bo'lagi qolgan bo'lishi mumkin\n2️⃣ Sezgich (odatda plastik oq/qora richagcha) joylashgan joyni toping va uni asta bosib-qo'yib, erkin harakatlanishini tekshiring\n3️⃣ Sezgichni quruq paxta yoki cho'tka bilan changdan tozalang\n4️⃣ Printerni to'liq o'chirib, 1 daqiqa kutib qayta yoqing (xato hisoblagichini reset qiladi)\n5️⃣ Xato davom etsa — sezgich sinib qolgan yoki simlari uzilgan, almashtirish kerak, bu ustaxonada bajariladigan ta'mir", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ПОСТОЯННО \"PAPER JAM\" БЕЗ БУМАГИ*\n\n🔍 *Подробное описание:*\nПринтер продолжает показывать \"Paper Jam\", даже когда вся бумага извлечена. Причина — неисправен, сломан или запылён датчик бумаги (sensor), либо внутри остался незаметный кусочек бумаги.\n\n✅ *Подробное решение:*\n1️⃣ Откройте все крышки и с фонариком внимательно осмотрите внутренности принтера — может остаться мелкий кусочек бумаги\n2️⃣ Найдите датчик (обычно белый/чёрный пластиковый рычажок) и проверьте, свободно ли он двигается при нажатии\n3️⃣ Протрите датчик сухой ватой или щёткой от пыли\n4️⃣ Полностью выключите принтер, подождите 1 минуту и включите снова (сброс счётчика ошибки)\n5️⃣ Если ошибка сохраняется — датчик сломан или оборваны провода, требуется замена, это ремонт у мастера"}, {"label_uz": "🖨️ HP-L: Tarmoq/drayver ko'rmayapti", "label_ru": "🖨️ HP-L: Не видит сеть/ошибка драйвера", "text_uz": "🖨️ *HP (LAZER) — TARMOQ/DRAYVER KO'RMAYAPTI*\n\n🔍 *Keng tavsif:*\nKompyuter yoki telefon printerni tarmoqda topa olmaydi yoki chop etishga urinishda drayver xatosi chiqadi. Sabab — printer boshqa tarmoqqa ulangan, IP manzil o'zgargan yoki drayver eskirgan/buzilgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer paneli orqali tarmoq sozlamalarini tekshiring, kerak bo'lsa Wi-Fi/Ethernet ulanishini qaytadan sozlang\n2️⃣ HP Smart ilovasi yoki drayverni eng so'nggi versiyaga yangilang\n3️⃣ Printer va kompyuter/telefon bir xil tarmoqda ekanini tasdiqlang\n4️⃣ Windows'da \"Print Spooler\" xizmatini qayta ishga tushiring (Xizmatlar → Print Spooler → Restart)\n5️⃣ Router va printerni qayta ishga tushiring (reboot)\n6️⃣ Yordam bermasa, USB orqali vaqtincha ulang va ustadan tarmoq sozlashni so'rang", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — НЕ ВИДИТ СЕТЬ/ОШИБКА ДРАЙВЕРА*\n\n🔍 *Подробное описание:*\nКомпьютер или телефон не находят принтер в сети, либо при печати появляется ошибка драйвера. Причина — принтер подключён к другой сети, изменился IP-адрес или устарел/повреждён драйвер.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте сетевые настройки через панель принтера, при необходимости заново настройте Wi-Fi/Ethernet\n2️⃣ Обновите приложение HP Smart или драйвер до последней версии\n3️⃣ Убедитесь, что принтер и компьютер/телефон в одной сети\n4️⃣ Перезапустите службу \"Диспетчер печати\" (Службы → Print Spooler → Перезапустить)\n5️⃣ Перезагрузите роутер и принтер\n6️⃣ Если не помогает — временно подключитесь через USB и обратитесь к мастеру для настройки сети"}, {"label_uz": "🖨️ HP-L: Fuser xatosi (Error 50/qizigan hid)", "label_ru": "🖨️ HP-L: Ошибка фьюзера (Error 50/запах гари)", "text_uz": "🖨️ *HP (LAZER) — FUSER XATOSI (ERROR 50/QIZIGAN HID)*\n\n🔍 *Keng tavsif:*\nPrinter ekranida \"Error 50\" yoki \"Fuser Error\" chiqadi, ba'zan qog'ozdan kuygan plastik hidi keladi. Fuser — toner naqshini qog'ozga issiqlik bilan \"eritib\" birlashtiruvchi qism. Xato sabab — fuser isimayapti, haddan tashqari qizigan yoki eskirgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, 15-20 daqiqa sovutish uchun kutib turing (fuser juda issiq bo'lishi mumkin — qo'l tegizmang)\n2️⃣ Qayta yoqib, xatolik takrorlanishini kuzating\n3️⃣ Elektr tarmog'i barqarorligini tekshiring — kuchlanish sakrashi fuser sensorini chalkashtirishi mumkin\n4️⃣ Bu xato uy sharoitida tuzatib bo'lmaydigan qattiq apparat nosozligi — fuser moduli (isitish elementi yoki termistor) almashtirilishi kerak\n5️⃣ Kuygan hid kuchli bo'lsa, printerni darhol o'chirib ishlatishni to'xtating va ustaxonaga olib boring — yong'in xavfi bo'lishi mumkin", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ОШИБКА ФЬЮЗЕРА (ERROR 50/ЗАПАХ ГАРИ)*\n\n🔍 *Подробное описание:*\nНа экране принтера появляется \"Error 50\" или \"Fuser Error\", иногда от бумаги пахнет горелым пластиком. Фьюзер — узел, который термически закрепляет тонер на бумаге. Причина ошибки — фьюзер не нагревается, перегревается или изношен.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и дайте остыть 15-20 минут (фьюзер может быть очень горячим — не трогайте руками)\n2️⃣ Включите снова и понаблюдайте, повторится ли ошибка\n3️⃣ Проверьте стабильность электросети — скачки напряжения могут сбивать датчик фьюзера\n4️⃣ Эта ошибка — серьёзная аппаратная неисправность, дома не устраняется, требуется замена модуля фьюзера (нагревательного элемента или термистора)\n5️⃣ При сильном запахе гари немедленно выключите принтер, прекратите использование и обратитесь к мастеру — возможен риск возгорания"}, {"label_uz": "🖨️ HP-L: Rasm takrorlanadi (ghosting)", "label_ru": "🖨️ HP-L: Повторяющееся изображение (ghosting)", "text_uz": "🖨️ *HP (LAZER) — RASM TAKRORLANADI (GHOSTING)*\n\n🔍 *Keng tavsif:*\nChop etilgan sahifada bir xil rasm/matn soyasi bir necha marta pastroqda takrorlanib chiqadi (\"ghosting\"). Sabab — drum (baraban) aylanishi bilan chastotasi mos keladigan masofada eski tasvir izi qolgani, drum eskirgani yoki tozalash raklasi (cleaning blade) nosoz.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drum barabanini yorug'likdan himoya qiling (uzoq ochiq qoldirmang)\n2️⃣ Drum yuzasini yumshoq, quruq mato bilan (agar ishlab chiqaruvchi ruxsat bersa) ehtiyotkorlik bilan artib ko'ring\n3️⃣ Boshqa (ishlaydigan) kartrij bilan sinab ko'ring — agar ghosting yo'qolsa, muammo aynan drumda\n4️⃣ Qorong'i/quruq muhitda saqlang, namlik drum ishlashiga salbiy ta'sir qiladi\n5️⃣ Drum resursi tugagan bo'lsa (odatda 12,000-20,000 sahifa) — drum unit yoki butun kartrij almashtirilishi kerak", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ПОВТОРЯЮЩЕЕСЯ ИЗОБРАЖЕНИЕ (GHOSTING)*\n\n🔍 *Подробное описание:*\nНа отпечатке одна и та же тень изображения/текста повторяется несколько раз ниже (\"ghosting\"). Причина — след старого изображения на расстоянии, совпадающем с частотой вращения барабана, износ барабана или неисправность чистящего лезвия (cleaning blade).\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, защитите барабан от света (не оставляйте открытым надолго)\n2️⃣ Аккуратно протрите поверхность барабана мягкой сухой тканью (если это допускает производитель)\n3️⃣ Проверьте с другим (рабочим) картриджем — если ghosting исчез, проблема именно в барабане\n4️⃣ Храните в тёмном/сухом месте, влажность негативно влияет на работу барабана\n5️⃣ Если ресурс барабана исчерпан (обычно 12 000–20 000 страниц) — нужна замена блока барабана или всего картриджа"}, {"label_uz": "🖨️ HP-L: Juda sekin chop etadi / uzoq isinadi", "label_ru": "🖨️ HP-L: Очень медленная печать / долгий прогрев", "text_uz": "🖨️ *HP (LAZER) — JUDA SEKIN CHOP ETADI / UZOQ ISINADI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilgandan chop etishga tayyor bo'lguncha yoki har bir sahifa orasida g'ayrioddiy uzoq vaqt ketadi. Sabab — sovuq muhitdan keyin fuser isinishi uzoq davom etishi, yuqori sifat rejimi yoki drayver/spooler muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Print sifatini \"Normal\"/\"Draft\" rejimiga tushiring — \"Best\"/\"High Quality\" sekinroq ishlaydi\n2️⃣ Printerni sovuq xonadan issiqroq joyga o'tkazing — past harorat fuser isinishini sekinlashtiradi\n3️⃣ Windows Print Spooler xizmatini qayta ishga tushiring\n4️⃣ Drayverni eng so'nggi versiyaga yangilang\n5️⃣ Katta hajmli fayllarni chop etishdan oldin siqing\n6️⃣ Muammo davom etsa, fuser yoki formatlash platasi (formatter board) eskirgan bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ОЧЕНЬ МЕДЛЕННАЯ ПЕЧАТЬ / ДОЛГИЙ ПРОГРЕВ*\n\n🔍 *Подробное описание:*\nОт включения принтера до готовности к печати или между страницами проходит необычно много времени. Причина — долгий прогрев фьюзера после холода, выбранный режим высокого качества или проблема драйвера/спулера.\n\n✅ *Подробное решение:*\n1️⃣ Снизьте качество печати до \"Normal\"/\"Draft\" — \"Best\"/\"High Quality\" печатает медленнее\n2️⃣ Переставьте принтер из холодного помещения в более тёплое — низкая температура замедляет прогрев фьюзера\n3️⃣ Перезапустите службу Print Spooler в Windows\n4️⃣ Обновите драйвер до последней версии\n5️⃣ Сжимайте большие файлы перед печатью\n6️⃣ Если не помогает — возможно изношен фьюзер или плата форматирования (formatter board), нужна диагностика у мастера"}, {"label_uz": "🖨️ HP-L: Ikki tomonlama (duplex) chop etishda xato", "label_ru": "🖨️ HP-L: Ошибка двусторонней печати (duplex)", "text_uz": "🖨️ *HP (LAZER) — IKKI TOMONLAMA (DUPLEX) CHOP ETISHDA XATO*\n\n🔍 *Keng tavsif:*\nDuplex (ikki tomonlama) chop etish tanlanganda qog'oz noto'g'ri aylanadi, ikkinchi tomon bo'sh chiqadi yoki qog'oz duplex modulida qisilib qoladi. Sabab — duplex modul to'liq o'rnatilmagan, qog'oz turi mos emas yoki sensor kirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Duplex modul (agar ajratiladigan bo'lsa) printerga to'liq va tekis o'rnatilganini tekshiring\n2️⃣ Drayver sozlamalarida \"Print on Both Sides\" yoqilganini tasdiqlang\n3️⃣ Duplex uchun mos qog'oz qalinligini (odatda 75-90 g/m²) ishlating\n4️⃣ Duplex modulni chiqarib, rolik va sensorlarini changdan tozalang\n5️⃣ Muammo davom etsa, duplex modul mexanik jihatdan nosoz — ustaxonada tekshirtiring yoki modulni almashtiring", "text_ru": "🖨️ *HP (ЛАЗЕРНЫЙ) — ОШИБКА ДВУСТОРОННЕЙ ПЕЧАТИ (DUPLEX)*\n\n🔍 *Подробное описание:*\nПри выборе двусторонней печати бумага неправильно переворачивается, вторая сторона выходит пустой, либо бумага застревает в модуле duplex. Причина — модуль установлен не до конца, неподходящий тип бумаги или загрязнён датчик.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте, что модуль duplex (если съёмный) установлен полностью и ровно\n2️⃣ В настройках драйвера подтвердите включение \"Print on Both Sides\"\n3️⃣ Используйте бумагу подходящей плотности (обычно 75-90 г/м²)\n4️⃣ Извлеките модуль duplex, очистите ролики и датчики от пыли\n5️⃣ Если проблема остаётся — модуль механически неисправен, нужна диагностика или замена у мастера"}]}, {"name": "🖨️ Canon (lazer)", "items": [{"label_uz": "🖨️ Canon-L: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Canon-L: Выходит пустой лист", "text_uz": "🖨️ *CANON (LAZER) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter chop etadi, lekin varaqda hech narsa ko'rinmaydi. Sabab — toner kartriji bo'sh, muhrlovchi lenta olinmagan yoki drum bilan yuklash g'ildiragi orasidagi kontakt uzilgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, muhrlovchi lenta to'liq olib tashlanganini tekshiring\n2️⃣ Kartrijni chapdan o'ngga bir necha marta asta silkitib, tonerni tekis taqsimlang\n3️⃣ Toner darajasini printer dasturi (Canon IJ Status Monitor yoki shunga o'xshash) orqali tekshiring\n4️⃣ Kartrij kontaktlarini quruq mato bilan artib, qaytadan mahkam o'rnating\n5️⃣ Test sahifasini chop etib, natijani tekshiring\n6️⃣ Yordam bermasa — drum yoki yuklash bloki nosoz, ustaxonada tekshirish kerak", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер печатает, но на листе ничего не видно. Причина — пустой тонер-картридж, не снята защитная лента или нарушен контакт между барабаном и роликом переноса.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, проверьте, полностью ли снята защитная лента\n2️⃣ Покачайте картридж из стороны в сторону несколько раз, чтобы равномерно распределить тонер\n3️⃣ Проверьте уровень тонера через программу принтера (Canon IJ Status Monitor или аналог)\n4️⃣ Протрите контакты картриджа сухой тканью и плотно установите обратно\n5️⃣ Распечатайте тестовую страницу и проверьте результат\n6️⃣ Если не помогает — неисправен барабан или узел переноса, нужна проверка у мастера"}, {"label_uz": "🖨️ Canon-L: Vertikal chiziqlar, dog'lar", "label_ru": "🖨️ Canon-L: Вертикальные полосы, пятна", "text_uz": "🖨️ *CANON (LAZER) — VERTIKAL CHIZIQLAR, DOG'LAR*\n\n🔍 *Keng tavsif:*\nChop etilgan varaqda takrorlanuvchi vertikal chiziqlar yoki dog'lar ko'rinadi. Sabab — drum tirnalgani/ifloslangani, tozalash pichog'i yeyilgani yoki fyuzer valigida toner qoldig'i borligi.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drum yuzasini yorug'likda tekshiring — tirnalgan yoki dog'li joy bormi?\n2️⃣ Chiziqlar orasidagi masofani o'lchab, qaysi qism (drum yoki fyuzer) sabab bo'layotganini aniqlang\n3️⃣ Kartrijni tashqi tomondan yumshoq quruq mato bilan artib, drumga tegmasdan changini tozalang\n4️⃣ Sifatsiz qayta to'ldirilgan kartrij drum tez shikastlanishiga sabab bo'ladi — original/sifatli kartrijga o'ting\n5️⃣ Muammo davom etsa, drum yoki fyuzer almashtirilishi kerak — ustaxonada bajariladi", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ВЕРТИКАЛЬНЫЕ ПОЛОСЫ, ПЯТНА*\n\n🔍 *Подробное описание:*\nНа отпечатке видны повторяющиеся вертикальные полосы или пятна. Причина — поцарапан/загрязнён барабан, изношено чистящее лезвие или остаток тонера на валу печки.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и осмотрите барабан на свету — есть царапины или пятна?\n2️⃣ Измерьте расстояние между полосами, чтобы понять, барабан или печка являются причиной\n3️⃣ Протрите картридж снаружи мягкой сухой тканью, не касаясь барабана\n4️⃣ Некачественный перезаправленный картридж быстрее повреждает барабан — перейдите на оригинальный/качественный\n5️⃣ Если не помогает — требуется замена барабана или печки, ремонт у мастера"}, {"label_uz": "🖨️ Canon-L: Kartrij tanilmayapti (E000/E002)", "label_ru": "🖨️ Canon-L: Картридж не определяется (E000/E002)", "text_uz": "🖨️ *CANON (LAZER) — KARTRIJ TANILMAYAPTI (E000/E002)*\n\n🔍 *Keng tavsif:*\nEkranda yoki chiroqlar orqali E000, E002 kabi xato kodi chiqib, printer kartrijni \"ko'rmayapti\". Sabab — kartrij noto'g'ri o'rnatilgan, kontaktlar kirlangan yoki chip nosoz.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, kartrijni chiqarib qayta \"klik\" ovozi bilan o'rnating\n2️⃣ Kartrij kontaktlarini (metall qismlarini) quruq mato bilan artib, quritib joylang\n3️⃣ Xato kodini yozib oling — Canon rasmiy saytida shu kod bo'yicha aniq izoh bor\n4️⃣ Printerni elektr tarmog'idan 1 daqiqaga uzib, qayta ulang\n5️⃣ Qayta to'ldirilgan kartrij chipi \"o'lgan\" bo'lishi mumkin — original yoki yangi chipli kartrijga almashtiring\n6️⃣ Xato davom etsa — kartrij ushlagichi yoki asosiy platada muammo, ustaxonada diagnostika kerak", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — КАРТРИДЖ НЕ ОПРЕДЕЛЯЕТСЯ (E000/E002)*\n\n🔍 *Подробное описание:*\nНа экране или индикаторами появляется код ошибки E000, E002 и т.п., принтер \"не видит\" картридж. Причина — картридж неправильно установлен, загрязнены контакты или неисправен чип.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, извлеките картридж и заново установите до щелчка\n2️⃣ Протрите металлические контакты картриджа сухой тканью, дайте высохнуть и установите\n3️⃣ Запишите код ошибки — на официальном сайте Canon есть точное описание по этому коду\n4️⃣ Отключите принтер от сети на 1 минуту и включите снова\n5️⃣ Чип перезаправленного картриджа может быть \"мёртвым\" — замените на оригинальный или картридж с новым чипом\n6️⃣ Если ошибка сохраняется — проблема в держателе картриджа или основной плате, нужна диагностика у мастера"}, {"label_uz": "🖨️ Canon-L: Qog'oz qisilib qoladi", "label_ru": "🖨️ Canon-L: Замятие бумаги", "text_uz": "🖨️ *CANON (LAZER) — QOG'OZ QISILIB QOLADI*\n\n🔍 *Keng tavsif:*\nChop etish jarayonida qog'oz yo'lda tiqilib qoladi. Sabab — rolik yeyilgani, qog'oz sifatsiz/namligi yoki fyuzer ichida qog'oz qolib ketgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, barcha qopqoqlarni ochib qisilgan qog'ozni asta torting\n2️⃣ Fyuzer blokini ham tekshiring (odatda orqada, issiq bo'lishi mumkin — ehtiyot bo'ling)\n3️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n4️⃣ Lazer printer uchun mos, quruq va tekis qog'oz (80 gr/m² atrofida) ishlating\n5️⃣ Lotokka ko'p qog'oz solmang, cheklagichlarni to'g'ri sozlang\n6️⃣ Takrorlansa — rolik almashtirilishi kerak, ustaxonada tez bajariladigan ta'mir", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ЗАМЯТИЕ БУМАГИ*\n\n🔍 *Подробное описание:*\nВо время печати бумага застревает по пути. Причина — износ ролика, некачественная/влажная бумага или бумага застряла в печке.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте все крышки и аккуратно извлеките застрявшую бумагу\n2️⃣ Проверьте также блок печки (обычно сзади, может быть горячим — будьте осторожны)\n3️⃣ Протрите ролик слегка влажной тканью от пыли\n4️⃣ Используйте подходящую сухую ровную бумагу (около 80 г/м²)\n5️⃣ Не перегружайте лоток, правильно выставьте направляющие\n6️⃣ Если повторяется — нужна замена ролика, быстрый ремонт у мастера"}, {"label_uz": "🖨️ Canon-L: Xatolik kodi doim yonib turadi", "label_ru": "🖨️ Canon-L: Код ошибки горит постоянно", "text_uz": "🖨️ *CANON (LAZER) — XATOLIK KODI DOIM YONIB TURADI*\n\n🔍 *Keng tavsif:*\nPrinter panelida biror xato kodi (masalan E-kod) doimiy yonib turadi va printer ishlashdan bosh tortadi. Bu ichki mexanizm, sensor yoki plata xatosi bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Xato kodini aniq yozib oling — Canon rasmiy qo'llanmasida yoki saytida shu kodga mos izoh bor\n2️⃣ Printerni to'liq o'chirib, elektr shnurini 2-3 daqiqaga chiqarib, qayta ulang (hard reset)\n3️⃣ Barcha qopqoqlar to'liq yopilganini va kartrij to'g'ri o'rnatilganini tekshiring\n4️⃣ Ichkarida begona jism yoki qog'oz bo'lagi qolmaganini tekshiring\n5️⃣ Xato kodi qayta chiqsa — bu odatda uy sharoitida tuzatib bo'lmaydigan ichki nosozlik, ustaxonada diagnostika va zarur ehtiyot qism almashtirilishi kerak", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — КОД ОШИБКИ ГОРИТ ПОСТОЯННО*\n\n🔍 *Подробное описание:*\nНа панели принтера постоянно горит код ошибки (например E-код), принтер отказывается работать. Это может быть ошибка механизма, датчика или платы.\n\n✅ *Подробное решение:*\n1️⃣ Точно запишите код ошибки — в официальном руководстве или на сайте Canon есть описание по этому коду\n2️⃣ Полностью выключите принтер, выньте шнур на 2-3 минуты и включите снова (hard reset)\n3️⃣ Проверьте, что все крышки полностью закрыты, а картридж установлен правильно\n4️⃣ Проверьте, не осталось ли внутри постороннего предмета или кусочка бумаги\n5️⃣ Если код появляется снова — это обычно внутренняя неисправность, которую нельзя устранить дома, нужна диагностика и замена детали у мастера"}, {"label_uz": "🖨️ Canon-L: Kompyuter/tarmoqda ko'rinmayapti", "label_ru": "🖨️ Canon-L: Не виден на компьютере/в сети", "text_uz": "🖨️ *CANON (LAZER) — KOMPYUTER/TARMOQDA KO'RINMAYAPTI*\n\n🔍 *Keng tavsif:*\nKompyuter yoki telefon printerni tarmoqda ko'rmaydi yoki USB orqali ham tanimaydi. Sabab — drayver eskirgan, tarmoq sozlamasi noto'g'ri yoki USB port/kabel muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Drayverni to'liq o'chirib, Canon rasmiy saytidan eng so'nggi versiyani qayta o'rnating\n2️⃣ USB ulanishda — kabelni almashtirib, boshqa portga ulab ko'ring\n3️⃣ Tarmoq ulanishida — printer va kompyuter/telefon bir xil Wi-Fi tarmog'ida ekanini tekshiring\n4️⃣ Windows'da \"Print Spooler\" xizmatini qayta ishga tushiring\n5️⃣ Router va printerni qayta ishga tushiring (reboot)\n6️⃣ Yordam bermasa — printer tarmoq platasi yoki USB porti nosoz bo'lishi mumkin, ustaxonada diagnostika kerak", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — НЕ ВИДЕН НА КОМПЬЮТЕРЕ/В СЕТИ*\n\n🔍 *Подробное описание:*\nКомпьютер или телефон не видят принтер в сети, либо принтер не распознаётся даже через USB. Причина — устаревший драйвер, неверные сетевые настройки или проблема с USB-портом/кабелем.\n\n✅ *Подробное решение:*\n1️⃣ Полностью удалите драйвер и установите последнюю версию с официального сайта Canon\n2️⃣ При подключении по USB — попробуйте другой кабель и другой порт\n3️⃣ При сетевом подключении — убедитесь, что принтер и компьютер/телефон в одной Wi-Fi сети\n4️⃣ Перезапустите службу \"Диспетчер печати\" в Windows\n5️⃣ Перезагрузите роутер и принтер\n6️⃣ Если не помогает — возможна неисправность сетевой платы или USB-порта принтера, нужна диагностика у мастера"}, {"label_uz": "🖨️ Canon-L: Fuser (isitish blogi) xatosi", "label_ru": "🖨️ Canon-L: Ошибка фьюзера (термоблока)", "text_uz": "🖨️ *CANON (LAZER) — FUSER (ISITISH BLOGI) XATOSI*\n\n🔍 *Keng tavsif:*\nPrinter ekranida fuser bilan bog'liq xato kodi chiqadi, chop etilgan qog'ozda toner to'liq birikmagan (qo'l bilan artilganda o'chib ketadi) yoki kuygan hid sezilishi mumkin. Sabab — fuser isitish elementi yoki termistor nosoz.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, 15-20 daqiqa sovutish uchun kutib turing\n2️⃣ Qayta yoqib, xato kodi qaytadan chiqishini kuzating\n3️⃣ Elektr tarmog'i barqarorligini tekshiring, stabilizator ishlatishni ko'rib chiqing\n4️⃣ Bu qattiq apparat nosozligi — fuser moduli almashtirilishi kerak, uy sharoitida tuzatib bo'lmaydi\n5️⃣ Kuchli kuygan hid bo'lsa, ishlatishni darhol to'xtating va ustaxonaga olib boring", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ОШИБКА ФЬЮЗЕРА (ТЕРМОБЛОКА)*\n\n🔍 *Подробное описание:*\nНа экране принтера появляется код ошибки, связанный с фьюзером, тонер на отпечатке плохо закреплён (стирается при протирании) или ощущается запах гари. Причина — неисправен нагревательный элемент или термистор фьюзера.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и дайте остыть 15-20 минут\n2️⃣ Включите снова и проверьте, повторится ли код ошибки\n3️⃣ Проверьте стабильность электросети, рассмотрите использование стабилизатора\n4️⃣ Это серьёзная аппаратная неисправность — требуется замена модуля фьюзера, дома не устраняется\n5️⃣ При сильном запахе гари немедленно прекратите использование и обратитесь к мастеру"}, {"label_uz": "🖨️ Canon-L: Rasm takrorlanadi (ghosting)", "label_ru": "🖨️ Canon-L: Повторяющееся изображение (ghosting)", "text_uz": "🖨️ *CANON (LAZER) — RASM TAKRORLANADI (GHOSTING)*\n\n🔍 *Keng tavsif:*\nSahifada bir xil tasvir soyasi pastroqda takrorlanib chop etiladi. Sabab — drum (baraban) eskirgani, tozalash raklasi nosoz yoki drum yorug'likka uzoq muddat ta'sirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drumni yorug'likdan himoya qiling\n2️⃣ Boshqa kartrij bilan sinab ko'ring — ghosting yo'qolsa, muammo drumda\n3️⃣ Drumni quruq, qorong'i joyda saqlang\n4️⃣ Drum resursi (odatda 12,000-23,000 sahifa) tugagan bo'lsa, almashtirish kerak\n5️⃣ Davom etsa, tozalash raklasi yoki charge roller nosoz bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ПОВТОРЯЮЩЕЕСЯ ИЗОБРАЖЕНИЕ (GHOSTING)*\n\n🔍 *Подробное описание:*\nНа странице повторяется тень одного и того же изображения ниже по листу. Причина — износ барабана, неисправность чистящего лезвия или длительное воздействие света на барабан.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, защитите барабан от света\n2️⃣ Проверьте с другим картриджем — если ghosting исчез, проблема в барабане\n3️⃣ Храните барабан в сухом тёмном месте\n4️⃣ Если ресурс барабана (обычно 12 000–23 000 страниц) исчерпан — замените\n5️⃣ Если не помогает — возможна неисправность чистящего лезвия или ролика заряда, нужна диагностика у мастера"}, {"label_uz": "🖨️ Canon-L: Juda sekin chop etadi", "label_ru": "🖨️ Canon-L: Очень медленная печать", "text_uz": "🖨️ *CANON (LAZER) — JUDA SEKIN CHOP ETADI*\n\n🔍 *Keng tavsif:*\nPrinter chop etadi, lekin sahifalar orasida odatdagidan ko'p vaqt o'tadi. Sabab — yuqori sifat rejimi, sovuq muhitdan keyin uzoq isinish, spooler yoki drayver muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Sifatni \"Normal\"/\"Draft\" rejimiga tushiring\n2️⃣ Printerni issiqroq xonaga o'tkazing\n3️⃣ Print Spooler xizmatini qayta ishga tushiring\n4️⃣ Drayverni yangilang\n5️⃣ Katta fayllarni siqib chop eting\n6️⃣ Davom etsa, formatlash platasi yoki fuser eskirgan bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ОЧЕНЬ МЕДЛЕННАЯ ПЕЧАТЬ*\n\n🔍 *Подробное описание:*\nПринтер печатает, но между страницами проходит больше времени, чем обычно. Причина — режим высокого качества, долгий прогрев после холода, проблема спулера или драйвера.\n\n✅ *Подробное решение:*\n1️⃣ Снизьте качество до \"Normal\"/\"Draft\"\n2️⃣ Переставьте принтер в более тёплое помещение\n3️⃣ Перезапустите службу Print Spooler\n4️⃣ Обновите драйвер\n5️⃣ Сжимайте большие файлы перед печатью\n6️⃣ Если не помогает — возможен износ платы форматирования или фьюзера, нужна диагностика у мастера"}, {"label_uz": "🖨️ Canon-L: Duplex modulida xato", "label_ru": "🖨️ Canon-L: Ошибка модуля duplex", "text_uz": "🖨️ *CANON (LAZER) — DUPLEX MODULIDA XATO*\n\n🔍 *Keng tavsif:*\nIkki tomonlama chop etishda qog'oz noto'g'ri aylanadi yoki duplex yo'lida qisilib qoladi. Sabab — modul to'liq o'rnatilmagan, mos kelmaydigan qog'oz yoki rolik/sensor kirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Duplex modulni chiqarib, to'liq va tekis qaytadan o'rnating\n2️⃣ Drayverda \"Print on Both Sides\" yoqilganini tekshiring\n3️⃣ Faqat mos qalinlikdagi (75-90 g/m²) qog'oz ishlating\n4️⃣ Modul rolik va sensorlarini changdan tozalang\n5️⃣ Davom etsa, modul mexanik jihatdan nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЛАЗЕРНЫЙ) — ОШИБКА МОДУЛЯ DUPLEX*\n\n🔍 *Подробное описание:*\nПри двусторонней печати бумага неправильно переворачивается или застревает в пути duplex. Причина — модуль установлен не до конца, неподходящая бумага или загрязнён ролик/датчик.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките модуль duplex и установите его заново полностью и ровно\n2️⃣ Проверьте включение \"Print on Both Sides\" в драйвере\n3️⃣ Используйте бумагу только подходящей плотности (75-90 г/м²)\n4️⃣ Очистите ролики и датчики модуля от пыли\n5️⃣ Если не помогает — модуль механически неисправен, нужна диагностика у мастера"}]}, {"name": "🖨️ Samsung (lazer)", "items": [{"label_uz": "🖨️ Samsung: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Samsung: Выходит пустой лист", "text_uz": "🖨️ *SAMSUNG (LAZER) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter qog'ozni chop etadi, lekin natija bo'sh chiqadi. Sabab — toner tugagan, kartrij muhrlovchi qismi olinmagan yoki yuklash g'ildiragi kontakt hosil qilmayapti.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, himoya lentasi/muhri to'liq olib tashlanganini tekshiring\n2️⃣ Kartrijni asta chapdan o'ngga bir necha marta silkiting — toner notekis taqsimlangan bo'lishi mumkin\n3️⃣ Toner darajasini printer paneli yoki Samsung Easy Printer Manager orqali tekshiring\n4️⃣ Kartrij kontaktlarini quruq mato bilan artib, mahkam qaytadan o'rnating\n5️⃣ Test sahifasini chop etib natijani ko'ring\n6️⃣ Yordam bermasa — drum yoki yuklash bloki nosoz, ustaxonada tekshirish kerak", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер печатает, но результат пустой. Причина — закончился тонер, не снята защитная часть картриджа или ролик переноса не создаёт контакт.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, проверьте, полностью ли снята защитная лента/пломба\n2️⃣ Аккуратно покачайте картридж из стороны в сторону несколько раз — тонер мог распределиться неравномерно\n3️⃣ Проверьте уровень тонера через панель принтера или Samsung Easy Printer Manager\n4️⃣ Протрите контакты картриджа сухой тканью и плотно установите обратно\n5️⃣ Распечатайте тестовую страницу и проверьте результат\n6️⃣ Если не помогает — неисправен барабан или узел переноса, нужна проверка у мастера"}, {"label_uz": "🖨️ Samsung: Chiziqlar, notekis chop", "label_ru": "🖨️ Samsung: Полосы, неровная печать", "text_uz": "🖨️ *SAMSUNG (LAZER) — CHIZIQLAR, NOTEKIS CHOP*\n\n🔍 *Keng tavsif:*\nChop etilgan varaqda chiziqlar, notekis qoraroq/ochiqroq joylar ko'rinadi. Sabab — drum yeyilgani/tirnalgani, tozalash pichog'i eskirgani yoki toner notekis taqsimlangani.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drum yuzasini yorug'likda tekshiring — tirnalgan yoki dog'li bo'lishi mumkin\n2️⃣ Kartrijni asta silkitib, tonerni qayta taqsimlang\n3️⃣ Chiziqlar orasidagi masofani o'lchab, drum yoki fyuzer sabab ekanligini aniqlang\n4️⃣ Kartrijni tashqi tomondan yumshoq mato bilan artib, drumga tegmasdan changini tozalang\n5️⃣ Sifatsiz qayta to'ldirilgan toner drum umrini qisqartiradi — sifatli kartrijga o'ting\n6️⃣ Muammo davom etsa, drum almashtirilishi kerak — ustaxonada bajariladi", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ПОЛОСЫ, НЕРОВНАЯ ПЕЧАТЬ*\n\n🔍 *Подробное описание:*\nНа отпечатке видны полосы, неровные более тёмные/светлые участки. Причина — износ/царапины на барабане, изношено чистящее лезвие или неравномерное распределение тонера.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и осмотрите барабан на свету — возможны царапины или пятна\n2️⃣ Аккуратно покачайте картридж, чтобы перераспределить тонер\n3️⃣ Измерьте расстояние между полосами, чтобы понять причину (барабан или печка)\n4️⃣ Протрите картридж снаружи мягкой тканью, не касаясь барабана\n5️⃣ Некачественный перезаправленный тонер сокращает срок службы барабана — перейдите на качественный картридж\n6️⃣ Если не помогает — требуется замена барабана, ремонт у мастера"}, {"label_uz": "🖨️ Samsung: \"Toner past\" xabari tez-tez chiqadi", "label_ru": "🖨️ Samsung: Часто \"Низкий тонер\"", "text_uz": "🖨️ *SAMSUNG (LAZER) — \"TONER PAST\" XABARI TEZ-TEZ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter kartrij hali toza va yangi bo'lsa ham \"toner low\" yoki \"almashtiring\" xabarini tez-tez ko'rsatadi. Sabab — kartrij chipidagi hisoblagich noto'g'ri ishlayapti yoki toner sensori kirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib qayta o'rnating — ba'zida bu hisoblagichni yangilaydi\n2️⃣ Xabarni e'tiborsiz qoldirib \"Continue\" bosing — ko'p hollarda printer yana bir muncha vaqt ishlayveradi\n3️⃣ Toner sensori (kartrij yonidagi kichik oynacha) ni quruq mato bilan artib, changdan tozalang\n4️⃣ Qayta to'ldirilgan kartrij bo'lsa, chip hisoblagichi noto'g'ri ko'rsatishi odatiy hol — original chipli kartrijga o'ting\n5️⃣ Chop etish sifati haqiqatan ham pasaygan bo'lsa (xira chop), unda toner haqiqatan ham tugayapti — kartrijni almashtiring", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ЧАСТО \"НИЗКИЙ ТОНЕР\"*\n\n🔍 *Подробное описание:*\nПринтер часто показывает \"toner low\" или \"замените картридж\", даже если картридж ещё полный и новый. Причина — неверно работает счётчик чипа картриджа или загрязнён датчик тонера.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките и заново установите картридж — иногда это обновляет счётчик\n2️⃣ Проигнорируйте сообщение и нажмите \"Continue\" — часто принтер продолжает работать\n3️⃣ Протрите датчик тонера (маленькое окошко рядом с картриджем) сухой тканью от пыли\n4️⃣ У перезаправленных картриджей счётчик чипа часто показывает неверно — перейдите на картридж с оригинальным чипом\n5️⃣ Если качество печати реально ухудшилось (бледная печать) — тонер действительно заканчивается, замените картридж"}, {"label_uz": "🖨️ Samsung: Qog'oz qisilib qoladi", "label_ru": "🖨️ Samsung: Замятие бумаги", "text_uz": "🖨️ *SAMSUNG (LAZER) — QOG'OZ QISILIB QOLADI*\n\n🔍 *Keng tavsif:*\nChop etish jarayonida qog'oz yo'lda tiqilib qoladi. Sabab — rolik yeyilgani, qog'oz sifatsizligi yoki noto'g'ri joylashtirilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, qopqoqlarni ochib qisilgan qog'ozni asta, yirtib qoldirmasdan torting\n2️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n3️⃣ Namlangan yoki bukilgan qog'ozdan foydalanmang, mos (80 gr/m²) qog'oz ishlating\n4️⃣ Lotokka ko'p qog'oz solmang, cheklagichlarni to'g'ri sozlang\n5️⃣ Printer ichida mayda qog'oz bo'lagi qolmaganini fonar bilan tekshiring\n6️⃣ Takrorlansa — rolik almashtirilishi kerak, ustaxonada tez bajariladigan ta'mir", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ЗАМЯТИЕ БУМАГИ*\n\n🔍 *Подробное описание:*\nВо время печати бумага застревает по пути. Причина — износ ролика, некачественная бумага или неправильная загрузка.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте крышки и аккуратно, не разрывая, извлеките застрявшую бумагу\n2️⃣ Протрите ролик слегка влажной тканью от пыли\n3️⃣ Не используйте влажную или мятую бумагу, используйте подходящую (около 80 г/м²)\n4️⃣ Не перегружайте лоток, правильно выставьте направляющие\n5️⃣ Проверьте фонариком, не остались ли мелкие кусочки бумаги внутри\n6️⃣ Если повторяется — нужна замена ролика, быстрый ремонт у мастера"}, {"label_uz": "🖨️ Samsung: Toner qog'ozga yopishmayapti", "label_ru": "🖨️ Samsung: Тонер не закрепляется на бумаге", "text_uz": "🖨️ *SAMSUNG (LAZER) — TONER QOG'OZGA YOPISHMAYAPTI*\n\n🔍 *Keng tavsif:*\nChop etilgan matn/rasm qog'ozdan osongina qirilib yoki artilib tushadi, ya'ni toner qog'ozga yopishib \"erimayapti\". Sabab — fyuzer (isitish bloki) yetarlicha qizimayapti yoki isitish elementi ishdan chiqqan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer sozlamalarida qog'oz turi to'g'ri tanlanganini tekshiring — \"Thick\"/\"Qalin\" qog'oz uchun boshqa, oddiy qog'oz uchun boshqa rejim kerak\n2️⃣ Printerni bir necha daqiqa uzluksiz ishlatib, fyuzer to'liq isishini kutib ko'ring (sovuq muhitda birinchi chop sifatsiz chiqishi mumkin)\n3️⃣ Qog'oz namligini tekshiring — nam qog'oz toner yopishishini yomonlashtiradi, quruq joyda saqlang\n4️⃣ Muammo doimiy bo'lsa — fyuzerning isitish elementi (heating element) yoki termostati nosoz, bu jiddiy ta'mir talab qiladi\n5️⃣ Bunday holatda printerni ustaxonaga olib borish tavsiya etiladi — fyuzer bloki almashtiriladi", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ТОНЕР НЕ ЗАКРЕПЛЯЕТСЯ НА БУМАГЕ*\n\n🔍 *Подробное описание:*\nНапечатанный текст/изображение легко стирается или осыпается с бумаги, то есть тонер не \"запекается\" на бумаге. Причина — печка (fuser) недостаточно нагревается или неисправен нагревательный элемент.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте, правильно ли выбран тип бумаги в настройках — для \"Thick\"/плотной бумаги нужен другой режим, чем для обычной\n2️⃣ Дайте принтеру поработать несколько минут непрерывно, чтобы печка полностью прогрелась (в холодном помещении первая печать может быть некачественной)\n3️⃣ Проверьте влажность бумаги — влажная бумага ухудшает закрепление тонера, храните бумагу в сухом месте\n4️⃣ Если проблема постоянная — неисправен нагревательный элемент или термостат печки, это серьёзный ремонт\n5️⃣ В этом случае рекомендуется отвезти принтер к мастеру — потребуется замена блока печки"}, {"label_uz": "🖨️ Samsung: Kompyuter/tarmoqda ko'rinmayapti", "label_ru": "🖨️ Samsung: Не виден на компьютере/в сети", "text_uz": "🖨️ *SAMSUNG (LAZER) — KOMPYUTER/TARMOQDA KO'RINMAYAPTI*\n\n🔍 *Keng tavsif:*\nKompyuter yoki telefon printerni tarmoqda yoki USB orqali topa olmaydi. Sabab — drayver eskirgan, tarmoq sozlamasi noto'g'ri yoki kabel/port muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Drayverni to'liq o'chirib, rasmiy (yoki mos) manbadan eng so'nggi versiyani qayta o'rnating\n2️⃣ USB ulanishda kabelni almashtirib, boshqa portga ulab ko'ring\n3️⃣ Tarmoq ulanishida printer va kompyuter/telefon bir xil Wi-Fi tarmog'ida ekanini tekshiring\n4️⃣ Windows'da \"Print Spooler\" xizmatini qayta ishga tushiring\n5️⃣ Router va printerni qayta ishga tushiring\n6️⃣ Yordam bermasa — printer tarmoq platasi yoki USB porti nosoz bo'lishi mumkin, ustaxonada diagnostika kerak", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — НЕ ВИДЕН НА КОМПЬЮТЕРЕ/В СЕТИ*\n\n🔍 *Подробное описание:*\nКомпьютер или телефон не находят принтер в сети или через USB. Причина — устаревший драйвер, неверные сетевые настройки или проблема с кабелем/портом.\n\n✅ *Подробное решение:*\n1️⃣ Полностью удалите драйвер и установите последнюю версию из официального (или подходящего) источника\n2️⃣ При подключении по USB попробуйте другой кабель и порт\n3️⃣ При сетевом подключении убедитесь, что принтер и устройство в одной Wi-Fi сети\n4️⃣ Перезапустите службу \"Диспетчер печати\" в Windows\n5️⃣ Перезагрузите роутер и принтер\n6️⃣ Если не помогает — возможна неисправность сетевой платы или USB-порта, нужна диагностика у мастера"}, {"label_uz": "🖨️ Samsung: Fuser xatosi / kuygan hid", "label_ru": "🖨️ Samsung: Ошибка фьюзера / запах гари", "text_uz": "🖨️ *SAMSUNG (LAZER) — FUSER XATOSI / KUYGAN HID*\n\n🔍 *Keng tavsif:*\nPrinter fuser bilan bog'liq xato kodini ko'rsatadi, toner qog'ozga to'liq birikmaydi yoki kuygan plastik hidi keladi. Sabab — fuser isitish elementi yoki termistor ishdan chiqqan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, 15-20 daqiqa sovutish uchun kutib turing\n2️⃣ Qayta yoqib, xato takrorlanishini kuzating\n3️⃣ Elektr tarmog'ining barqarorligini tekshiring\n4️⃣ Bu qattiq apparat nosozligi — fuser moduli almashtirilishi kerak\n5️⃣ Kuchli kuygan hidda darhol o'chiring va ustaxonaga olib boring", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ОШИБКА ФЬЮЗЕРА / ЗАПАХ ГАРИ*\n\n🔍 *Подробное описание:*\nПринтер показывает код ошибки, связанный с фьюзером, тонер плохо закрепляется на бумаге или ощущается запах горелого пластика. Причина — неисправен нагревательный элемент или термистор фьюзера.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и дайте остыть 15-20 минут\n2️⃣ Включите снова и проверьте
