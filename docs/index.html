атчика температуры внутреннего блока\n🔹 *E2* — ошибка датчика теплообменника (испарителя) / защита от обмерзания\n🔹 *E3* — ошибка датчика наружного блока (конденсатора) / защита по низкому давлению\n🔹 *E4* — защита от высокой температуры нагнетания компрессора\n🔹 *E5* — ошибка связи между блоками или защита от перегрузки по току\n🔹 *EC / F0* — нехватка хладагента (фреона)"}]}}, {"id": "xolod", "icon": "🧊", "name_uz": "Xolodilnik", "name_ru": "Холодильник", "type": "flat_with_codes", "items": [{"label_uz": "🧊 Sovutmaydi", "label_ru": "🧊 Не охлаждает", "text_uz": "🧊 *XOLODILNIK — SOVUTMAYDI*\n\n🔍 *Sabab:*\n• Kompressor ishlamayapti\n• Freon tugagan (quvur yorilib ketgan)\n• Eshik rezinkasi yomon yopilayapti\n• Termostat nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Orqa tomoniga quloq tutib eshiting — kompressor ishlayaptimi? (g'uvullaydi)\n2️⃣ Termostatni (ichki tumblerni) eng past holatiga qo'ying, 30 daqiqa kuting\n3️⃣ Eshik rezinkasini qog'oz bilan sinab ko'ring: qog'ozni qisib, tortsangiz qiynalishi kerak\n4️⃣ Quyosh yoki radiator yonida emasmikan?\n5️⃣ Orqa devori juda issiqmi? — freon muammosi bo'lishi mumkin", "text_ru": "🧊 *ХОЛОДИЛЬНИК — НЕ ОХЛАЖДАЕТ*\n\n🔍 *Причины:*\n• Не работает компрессор\n• Закончился фреон (трубка лопнула)\n• Плохо прилегает уплотнитель двери\n• Неисправен термостат\n\n✅ *Попробуйте сами:*\n1️⃣ Приложите ухо к задней стенке — гудит компрессор?\n2️⃣ Поставьте терморегулятор на минимум, ждите 30 минут\n3️⃣ Тест уплотнителя: зажмите бумагу дверью — должна держаться\n4️⃣ Не стоит ли рядом с солнцем или батареей?\n5️⃣ Задняя стенка очень горячая? — возможно проблема с фреоном"}, {"label_uz": "🧊 Doimiy ishlaydi, to'xtamaydi", "label_ru": "🧊 Постоянно работает, не отключается", "text_uz": "🧊 *XOLODILNIK — TO'XTAMAYDI*\n\n🔍 *Sabab:*\n• Eshik rezinkasi yomon yopilayapti\n• Ichida muz qatlami qalinlashib ketgan\n• Xolodilnik haddan to'la\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Eshik rezinkasini tekshiring: qog'oz usulida (yuqorida aytilgan)\n2️⃣ Orqa ichki devorida qalin muz bormi? — 24 soat o'chirib, barcha muzni eritng\n3️⃣ Xolodilnikni haddan to'ldirmang — havo aylanishi uchun bo'sh joy kerak\n4️⃣ Issiq ovqatni ichiga qo'ymang — avval sovuting", "text_ru": "🧊 *ХОЛОДИЛЬНИК — НЕ ОТКЛЮЧАЕТСЯ*\n\n🔍 *Причины:*\n• Плохой уплотнитель двери\n• Толстый слой льда внутри\n• Холодильник переполнен\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте уплотнитель (тест с бумагой, описан выше)\n2️⃣ Толстый слой льда на задней стенке? — выключите на 24 ч, растопите всё\n3️⃣ Не переполняйте холодильник — нужна циркуляция воздуха\n4️⃣ Не ставьте горячую еду — сначала остудите"}, {"label_uz": "🧊 Muzxona muzlab, xolodilnik sovutmaydi", "label_ru": "🧊 Морозилка льдом, холодильник не охлаждает", "text_uz": "🧊 *MUZXONA MUZLAB, XOLODILNIK SOVUTMAYDI*\n\n🔍 *Sabab:*\n• No frost tizimi ishlamayapti\n• Defrost isitgich yoki taymer nosoz\n• Fan pali muzlab qolgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Xolodilnikni 24 soat o'chiring — barcha muzni eritib, ichini quritng\n2️⃣ Qayta yoqib kuzating — agar 1-2 kun ichida yana muzlasa — defrost tizim nosoz\n3️⃣ Muzxona ichida fan (ventilyator) ishlayaptimi? Quloq solng\n\n⚠️ No frost tizimini o'zingiz ta'mirlash qiyin — usta kerak", "text_ru": "🧊 *МОРОЗИЛКА ВО ЛЬДУ, ХОЛОДИЛЬНИК НЕ ОХЛАЖДАЕТ*\n\n🔍 *Причины:*\n• Не работает система No Frost\n• Неисправен нагреватель разморозки или таймер\n• Лопасти вентилятора примёрзли\n\n✅ *Попробуйте сами:*\n1️⃣ Выключите холодильник на 24 часа — растопите весь лёд, просушите\n2️⃣ Включите и наблюдайте — если снова замёрзнет за 1-2 дня — система разморозки неисправна\n3️⃣ Работает ли вентилятор в морозилке? Прислушайтесь\n\n⚠️ Ремонт системы No Frost сложный — нужен мастер"}, {"label_uz": "🧊 Ichidan suv oqadi", "label_ru": "🧊 Вода внутри", "text_uz": "🧊 *XOLODILNIK — ICHIDAN SUV OQADI*\n\n🔍 *Sabab:*\n• Drenaj teshigi tiqilgan\n• Eshik rezinkasi yomon\n• Orqa devorida muz hosil bo'layapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Suv qaydan oqayapti?\n   • Ichki pastdan — drenaj teshigi tiqilgan\n   • Eshik atrofidan — rezinka yomon\n   • Orqa devordan — muz erib oqayapti\n2️⃣ Drenaj teshigini (pastki ichki) ingichka mix yoki pipetkа bilan tozalang\n3️⃣ Eshik rezinkasini tekshiring", "text_ru": "🧊 *ХОЛОДИЛЬНИК — ВОДА ВНУТРИ*\n\n🔍 *Причины:*\n• Засорено дренажное отверстие\n• Плохой уплотнитель двери\n• Тает лёд на задней стенке\n\n✅ *Попробуйте сами:*\n1️⃣ Откуда течёт вода?\n   • Снизу внутри — засор дренажа\n   • Вокруг двери — плохой уплотнитель\n   • С задней стенки — тает лёд\n2️⃣ Прочистите дренажное отверстие (внизу внутри) тонкой проволокой или пипеткой\n3️⃣ Проверьте уплотнитель"}, {"label_uz": "🧊 Ichi yoniq, kompressor ovozi yo'q", "label_ru": "🧊 Свет есть, компрессор молчит", "text_uz": "🧊 *ICHI YONIQ, KOMPRESSOR OVOZI YO'Q*\n\n🔍 *Sabab:*\n• Start relay yonib ketgan\n• Kompressor juda qizib himoya ishlagan\n• 220V kuchlanish muammosi\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Orqasidagi kompressorda kichik qutichani (start relay) toping va silkiting\n   • Taqillasa — relay yongan, arzonga almashtiriladi\n2️⃣ Kompressor juda issiqmi? — 30 daqiqa o'chiring, sovitib qayta ulang\n3️⃣ 220V kuchlanishni tekshiring", "text_ru": "🧊 *СВЕТ ЕСТЬ, КОМПРЕССОР МОЛЧИТ*\n\n🔍 *Причины:*\n• Сгорело пусковое реле\n• Компрессор перегрелся, сработала защита\n• Проблема с напряжением 220V\n\n✅ *Попробуйте сами:*\n1️⃣ Найдите маленькую коробочку (пусковое реле) на компрессоре сзади, потрясите\n   • Гремит — реле сгорело, замена недорогая\n2️⃣ Компрессор очень горячий? — выключите на 30 мин, остудите, включите\n3️⃣ Проверьте напряжение 220V"}, {"label_uz": "🧊 Motor ishlab, ichi sovutmaydi", "label_ru": "🧊 Мотор работает, не охлаждает", "text_uz": "🧊 *MOTOR ISHLAB, SOVUTMAYDI*\n\n🔍 *Sabab:*\n• Freon tugagan (quvur yorilgan yoki o'rnatish xatosi)\n• Kompressor bosim yaratmayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Orqa kondenserga (panjara) qo'l tutib ko'ring:\n   • Iliq/issiq — freon bor, boshqa muammo\n   • Sovuq — freon yo'q\n2️⃣ Kompressor ishlayotganda ingichka \"shrrr\" yoki \"hissss\" tovush — freon oqyapti\n\n⚠️ Freon qo'shish uchun usta kerak — maxsus asbob talab qilinadi", "text_ru": "🧊 *МОТОР РАБОТАЕТ, НЕ ОХЛАЖДАЕТ*\n\n🔍 *Причины:*\n• Нет фреона (трубка лопнула или ошибка установки)\n• Компрессор не создаёт давление\n\n✅ *Попробуйте сами:*\n1️⃣ Потрогайте задний конденсатор (решётку):\n   • Тёплый/горячий — фреон есть, другая проблема\n   • Холодный — нет фреона\n2️⃣ При работающем компрессоре слышен тихий \"шшш\" или \"хисс\" — утечка фреона\n\n⚠️ Для дозаправки фреона нужен мастер — требуется специальное оборудование"}, {"label_uz": "🧊 Muzlab ketib, erimaydi", "label_ru": "🧊 Морозилка не размораживается", "text_uz": "🧊 *MUZXONA MUZLAB, ERIMAYDI*\n\n🔍 *Sabab:*\n• No frost tizimining isitgichi nosoz\n• Defrost taymer ishlamayapti\n• Termistor (sensor) nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Xolodilnikni 24 soat o'chiring — barcha muzni eritng\n2️⃣ Mexanik taymerni (agar bor bo'lsa) soat yo'nalishida buriting — taqilladimi? Defrost boshlandi\n3️⃣ Defrost isitgichni multimetр bilan tekshiring: tok o'tishi kerak", "text_ru": "🧊 *МОРОЗИЛКА НЕ РАЗМОРАЖИВАЕТСЯ*\n\n🔍 *Причины:*\n• Неисправен нагреватель системы No Frost\n• Не работает таймер разморозки\n• Неисправен термистор (датчик)\n\n✅ *Попробуйте сами:*\n1️⃣ Выключите холодильник на 24 часа — растопите весь лёд\n2️⃣ Механический таймер (если есть) — поверните по часовой стрелке — щелчок? Разморозка началась\n3️⃣ Проверьте нагреватель разморозки мультиметром: должен проводить ток"}], "codes": {"title_uz": "Xatolik kodlari — brendni tanlang", "title_ru": "Коды ошибок — выберите бренд", "brands": [{"name": "🧊 Artel", "text_uz": "🧊🔢 *ARTEL — XOLODILNIK XATOLIK KODLARI*\n\nArtel xolodilniklari ko'pincha No Frost tizimidagi keng tarqalgan standart kod bazasidan foydalanadi:\n\n🔹 *E1* — muzlatgich (morozilka) qizdirgichi (ottayka TENi) nosoz yoki uzilgan\n🔹 *E2* — muzlatgich erish (defrost) datchigi nosoz\n🔹 *E3* — xolodilnik bo'limi harorat datchigi (havo datchigi) nosoz\n🔹 *E4* — muzlatgich bo'limi harorat datchigi nosoz\n🔹 *E6* — E2 va E4 xatoliklari bir vaqtda yuzaga kelganda ko'rsatiladi\n🔹 *F1–F2* — boshqaruv platasi yoki asosiy datchiklar zanjirida nosozlik\n🔹 *F5* — tarmoqdagi kuchlanish me'yordan yuqori (taxminan 240V dan oshgan)\n\n🛠 *Kengaytirilgan yechim:*\n1️⃣ Xolodilnikni tarmoqdan 10-15 daqiqaga o'chirib, qayta ulang — vaqtinchalik dastur xatosi bo'lsa, shu bilan tozalanadi\n2️⃣ Agar kod qaytadan chiqsa — ottayka TENi, erish datchigi yoki ularning simlari (kontaktlari)ni tekshiring, ular ko'pincha muzlab yorilib qoladi\n3️⃣ Datchik qarshiligini multimetr bilan o'lchang (odatda NTC datchik, 25°C da taxminan 5 kOhm atrofida bo'lishi kerak — aniq qiymat texnik pasportda)\n4️⃣ F5 chiqsa — kuchlanishni stabilizator orqali o'lchang, tarmoq muammosi bo'lishi mumkin\n\n⚙️ *Sozlamalar bo'yicha maslahat:*\n• Xolodilnik bo'limi uchun +3°C...+5°C, muzlatgich uchun −18°C atrofida sozlash tavsiya etiladi\n• Xatolik kodi chiqqandan keyin ba'zi Artel modellarida tugmalarni bosib (odatda ikkita tugmani 5 soniya bosib turish) diagnostika rejimiga kirish mumkin", "text_ru": "🧊🔢 *ARTEL — КОДЫ ОШИБОК ХОЛОДИЛЬНИКА*\n\nХолодильники Artel чаще всего используют распространённую стандартную систему кодов для No Frost:\n\n🔹 *E1* — неисправен/оборван нагреватель оттайки морозильной камеры\n🔹 *E2* — неисправен датчик оттайки морозильной камеры\n🔹 *E3* — неисправен датчик температуры холодильной камеры (воздуха)\n🔹 *E4* — неисправен датчик температуры морозильной камеры\n🔹 *E6* — отображается при одновременном появлении ошибок E2 и E4\n🔹 *F1–F2* — неисправность платы управления или цепи основных датчиков\n🔹 *F5* — напряжение в сети выше нормы (примерно свыше 240В)\n\n🛠 *Расширенное решение:*\n1️⃣ Отключите холодильник от сети на 10-15 минут и включите заново — временный программный сбой часто устраняется так\n2️⃣ Если код появляется снова — проверьте ТЭН оттайки, датчик оттайки и их провода/контакты, они часто перемерзают и трескаются\n3️⃣ Измерьте сопротивление датчика мультиметром (обычно NTC-датчик, при 25°C около 5 кОм — точное значение в паспорте изделия)\n4️⃣ При F5 проверьте напряжение сети через стабилизатор — возможна проблема электросети\n\n⚙️ *Совет по настройкам:*\n• Рекомендуется устанавливать +3°C...+5°C для холодильной камеры и около −18°C для морозильной\n• После ошибки на некоторых моделях Artel можно войти в диагностический режим (обычно удержанием двух кнопок 5 секунд)"}, {"name": "🧊 Shivaki", "text_uz": "🧊🔢 *SHIVAKI — XOLODILNIK XATOLIK KODLARI*\n\nShivaki xolodilniklari ham ko'pincha keng tarqalgan No Frost standart kod tizimidan foydalanadi:\n\n🔹 *E1* — xolodilnik bo'limi havo (harorat) datchigi nosoz\n🔹 *E2* — muzlatgich bo'limi erish (defrost) datchigi nosoz\n🔹 *E3* — muzlatgich bo'limi havo datchigi nosoz\n🔹 *E4* — ottayka (erish) TENi zanjirida uzilish\n🔹 *F1–F3* — boshqaruv platasi yoki datchik zanjiridagi umumiy nosozliklar\n🔹 Doimiy ishlab, sovutmasa — ko'pincha freon yetishmasligi yoki kompressor ishlamayotgani (kod chiqmasligi ham mumkin)\n\n🛠 *Kengaytirilgan yechim:*\n1️⃣ Xolodilnikni 24 soat o'chirib, to'liq muzdan tozalang (agar muzxona qattiq muzlab qolgan bo'lsa, bu ko'p hollarda datchik yoki TENning noto'g'ri ishlashi sabab bo'ladi)\n2️⃣ Datchik ulanishlarini (klemma/rozetka) tekshiring — oksidlanish yoki bo'shashgan kontakt xato kodini chiqarishi mumkin\n3️⃣ Multimetr bilan TEN qarshiligini tekshiring (uzilgan bo'lsa — ∞, ya'ni cheksiz qarshilik ko'rsatadi, demak TEN kuygan)\n4️⃣ Agar kod ketmasa va barcha datchiklar sog' bo'lsa — boshqaruv platasi almashtirilishi kerak bo'lishi mumkin\n\n⚙️ *Sozlamalar bo'yicha maslahat:*\n• Standart harorat: xolodilnik +2°C...+6°C, muzlatgich −16°C...−20°C oralig'ida\n• Yozgi issiq davrda xonaning o'zi issiq bo'lsa, xolodilnikni devordan kamida 10 sm masofada qo'yish tavsiya etiladi — bu datchiklar noto'g'ri o'qishining oldini oladi", "text_ru": "🧊🔢 *SHIVAKI — КОДЫ ОШИБОК ХОЛОДИЛЬНИКА*\n\nХолодильники Shivaki также чаще всего используют распространённую стандартную систему кодов для No Frost:\n\n🔹 *E1* — неисправен датчик воздуха (температуры) холодильной камеры\n🔹 *E2* — неисправен датчик оттайки морозильной камеры\n🔹 *E3* — неисправен датчик воздуха морозильной камеры\n🔹 *E4* — обрыв в цепи ТЭНа оттайки\n🔹 *F1–F3* — общие неисправности платы управления или цепи датчиков\n🔹 Работает постоянно, но не охлаждает — часто нехватка фреона или неисправность компрессора (может быть без кода ошибки)\n\n🛠 *Расширенное решение:*\n1️⃣ Отключите холодильник на 24 часа и полностью разморозьте (если морозилка сильно обледенела, чаще всего причина в неверной работе датчика или ТЭНа)\n2️⃣ Проверьте соединения датчиков (клеммы/разъёмы) — окисление или слабый контакт может вызывать код ошибки\n3️⃣ Проверьте сопротивление ТЭНа мультиметром (если обрыв — покажет ∞, значит ТЭН перегорел)\n4️⃣ Если код не пропадает, а все датчики исправны — возможно, требуется замена платы управления\n\n⚙️ *Совет по настройкам:*\n• Стандартная температура: холодильная камера +2°C...+6°C, морозильная −16°C...−20°C\n• В жаркий летний период рекомендуется ставить холодильник минимум в 10 см от стены — это предотвращает неверные показания датчиков"}, {"name": "🧊 LG", "text_uz": "🧊🔢 *LG — XOLODILNIK XATOLIK KODLARI*\n\n🔹 *Er FF (yoki FF)* — muzlatgich ventilyatori nosoz yoki muzlab qolgan (eng ko'p uchraydigan xato)\n🔹 *Er rF (yoki rF)* — xolodilnik bo'limi ventilyatori ishlamayapti\n🔹 *Er CF (yoki CF)* — kondensator/kompressor bo'limi ventilyatori nosoz\n🔹 *Er CO (yoki CO)* — displey platasi bilan asosiy platani bog'lovchi simda uzilish\n🔹 *Er dH (yoki dH)* — erish (defrost) tizimida nosozlik — TEN, datchik yoki taymer\n🔹 *Er dP (yoki dP)* — havo klapani (damper) motori nosoz\n🔹 *Er FS / Er rS* — mos ravishda muzlatgich/xolodilnik harorat datchigi nosoz\n🔹 *Er IF / Er 1F* — muz generatori (ice maker) bilan bog'liq xatolik\n\n🛠 *Kengaytirilgan yechim:*\n1️⃣ Xolodilnikni tarmoqdan 5 daqiqaga uzib, qayta ulang — ventilyator vaqtincha muzga qotib qolgan bo'lishi mumkin, shu bilan tozalanishi mumkin\n2️⃣ Er FF/CF/rF chiqsa — muzlatgich ortidagi panelni ochib, ventilyator atrofida muz yig'ilib qolmaganini tekshiring, muzni ehtiyotkorlik bilan eriting\n3️⃣ Ventilyator motorini qo'lda aylantirib ko'ring — qattiq aylansa yoki aylanmasa, motor almashtiriladi\n4️⃣ Er dH chiqsa — ottayka TENi va uning taymerini tekshiring, ko'p hollarda TEN kuyib qoladi\n5️⃣ Aniq kodni bilish uchun LG ThinQ ilovasi orqali xolodilnikni tekshirish mumkin (agar Wi-Fi modelida bo'lsangiz)\n\n⚙️ *Sozlamalar bo'yicha maslahat:*\n• Tavsiya etilgan harorat: xolodilnik 3°C-4°C, muzlatgich −18°C\n• Xatolikni tekshirish rejimi: ko'pincha \"Harorat\" tugmasini bir necha soniya bosib turish orqali diagnostika rejimiga kiriladi (aniq usul modelga qarab farq qiladi, qo'llanmada ko'rsatiladi)", "text_ru": "🧊🔢 *LG — КОДЫ ОШИБОК ХОЛОДИЛЬНИКА*\n\n🔹 *Er FF (или FF)* — неисправен или обледенел вентилятор морозильной камеры (самая частая ошибка)\n🔹 *Er rF (или rF)* — не работает вентилятор холодильной камеры\n🔹 *Er CF (или CF)* — неисправен вентилятор конденсатора/компрессорного отсека\n🔹 *Er CO (или CO)* — обрыв провода между платой дисплея и основной платой\n🔹 *Er dH (или dH)* — неисправность системы оттайки — ТЭН, датчик или таймер\n🔹 *Er dP (или dP)* — неисправен мотор воздушной заслонки (демпфера)\n🔹 *Er FS / Er rS* — неисправен датчик температуры морозильной/холодильной камеры соответственно\n🔹 *Er IF / Er 1F* — ошибка, связанная с льдогенератором (ice maker)\n\n🛠 *Расширенное решение:*\n1️⃣ Отключите холодильник от сети на 5 минут и включите снова — вентилятор мог временно примёрзнуть, это часто устраняет ошибку\n2️⃣ При Er FF/CF/rF откройте панель за морозильной камерой и проверьте вентилятор на наличие льда, аккуратно разморозьте\n3️⃣ Попробуйте провернуть мотор вентилятора рукой — если крутится туго или не крутится вовсе, требуется замена мотора\n4️⃣ При Er dH проверьте ТЭН оттайки и его таймер, чаще всего перегорает именно ТЭН\n5️⃣ Точный код можно узнать через приложение LG ThinQ (если модель с Wi-Fi)\n\n⚙️ *Совет по настройкам:*\n• Рекомендуемая температура: холодильная камера 3°C-4°C, морозильная −18°C\n• Режим диагностики: чаще всего входится удержанием кнопки \"Температура\" несколько секунд (точный способ зависит от модели, указан в инструкции)"}, {"name": "🧊 Samsung", "text_uz": "🧊🔢 *SAMSUNG — XOLODILNIK XATOLIK KODLARI*\n\n🔹 *1E / E1* — xolodilnik bo'limi harorat datchigi nosoz\n🔹 *5E / SE* — muz generatori (ice maker) bilan bog'liq nosozlik\n🔹 *21E* — muzlatgich bo'limi harorat datchigi nosoz\n🔹 *22E / 22C* — xolodilnik/muzlatgich bo'limi ventilyator motori nosoz (aylanmayapti)\n🔹 *39E* — muz generatori datchigi uzilgan yoki aloqasi yo'q\n🔹 *40E / 41E* — boshqaruv platasida jiddiy nosozlik\n🔹 *84C* — invertor kompressor bilan aloqa (kommunikatsiya) xatosi\n🔹 *88E* — muz generatori mexanizmi yoki suv liniyasi bilan bog'liq nosozlik\n\n🛠 *Kengaytirilgan yechim:*\n1️⃣ Xolodilnikni tarmoqdan 10 daqiqaga o'chiring, qayta ulang — kod qaytadan chiqmasa, bu vaqtinchalik sensor sakrashi bo'lgan\n2️⃣ Kod qaytarilsa — tegishli datchik va uning simini vizual tekshiring (uzilish, oksidlanish, qisilgan sim)\n3️⃣ 22E/22C chiqsa — ventilyator lopastini qo'lda aylantirib ko'ring, muz yoki yot jism to'sib turishi mumkin\n4️⃣ 84C yoki 40E/41E kabi platani ko'rsatuvchi kodlar chiqsa — bu odatda uy sharoitida tuzatib bo'lmaydi, boshqaruv platasi diagnostikasi va ehtimol almashtirish kerak bo'ladi\n5️⃣ Samsung SmartThings ilovasi orqali ba'zi modellarda masofadan diagnostika qilish mumkin\n\n⚙️ *Sozlamalar bo'yicha maslahat:*\n• Tavsiya etilgan harorat: xolodilnik bo'limi 3°C, muzlatgich −19°C atrofida\n• Xatolik kodini tozalash uchun ko'pincha tarmoqdan uzib-ulash yetarli, agar sabab bartaraf etilgan bo'lsa kod avtomatik o'chadi", "text_ru": "🧊🔢 *SAMSUNG — КОДЫ ОШИБОК ХОЛОДИЛЬНИКА*\n\n🔹 *1E / E1* — неисправен датчик температуры холодильной камеры\n🔹 *5E / SE* — неисправность, связанная с льдогенератором (ice maker)\n🔹 *21E* — неисправен датчик температуры морозильной камеры\n🔹 *22E / 22C* — неисправен мотор вентилятора холодильной/морозильной камеры (не вращается)\n🔹 *39E* — обрыв или отсутствие связи с датчиком льдогенератора\n🔹 *40E / 41E* — серьёзная неисправность платы управления\n🔹 *84C* — ошибка связи с инверторным компрессором\n🔹 *88E* — неисправность механизма льдогенератора или линии подачи воды\n\n🛠 *Расширенное решение:*\n1️⃣ Отключите холодильник от сети на 10 минут и включите снова — если код не повторится, это была временная ошибка датчика\n2️⃣ Если код повторяется — визуально проверьте соответствующий датчик и его провод (обрыв, окисление, пережатый провод)\n3️⃣ При 22E/22C попробуйте провернуть лопасть вентилятора рукой — возможно, её блокирует лёд или посторонний предмет\n4️⃣ Коды платы, такие как 84C или 40E/41E, обычно нельзя устранить в домашних условиях — требуется диагностика платы управления и, возможно, её замена\n5️⃣ На некоторых моделях доступна удалённая диагностика через приложение Samsung SmartThings\n\n⚙️ *Совет по настройкам:*\n• Рекомендуемая температура: холодильная камера около 3°C, морозильная около −19°C\n• Для сброса кода ошибки обычно достаточно отключить от сети — если причина устранена, код исчезнет автоматически"}]}}, {"id": "kir", "icon": "🫧", "name_uz": "Kir yuvish mashinasi", "name_ru": "Стиральная машина", "type": "flat", "items": [{"label_uz": "🫧 Suv tushmaydi", "label_ru": "🫧 Не набирает воду", "text_uz": "🫧 *KIR YUVISH MASHINASI — SUV TUSHMAYDI*\n\n🔍 *Sabab:*\n• Kran yopiq\n• Kiruvchi filtr (metall to'r) tiqilgan\n• Suv bosimi past\n• Suv qabul qilish klapani nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Kranni to'liq oching\n2️⃣ Shlangni mashinadan uzing — filtr (metall to'r) ni olib tozalang\n3️⃣ Uy suvi bosimini tekshiring — boshqa joyda ham sust kelayaptimi?\n4️⃣ Xato kod: E10, F20, 1E, NF — bular hammasi sув yo'q degani", "text_ru": "🫧 *СТИРАЛЬНАЯ МАШИНА — НЕ НАБИРАЕТ ВОДУ*\n\n🔍 *Причины:*\n• Кран закрыт\n• Засорён входной фильтр (металлическая сетка)\n• Низкое давление воды\n• Неисправен клапан подачи воды\n\n✅ *Попробуйте сами:*\n1️⃣ Полностью откройте кран\n2️⃣ Отсоедините шланг от машины — достаньте фильтр (сетку), промойте\n3️⃣ Проверьте давление воды — везде слабо идёт?\n4️⃣ Код ошибки: E10, F20, 1E, NF — всё это означает 'нет воды'"}, {"label_uz": "🫧 Suv ichida qolib ketadi", "label_ru": "🫧 Не сливает воду", "text_uz": "🫧 *KIR YUVISH MASHINASI — SUVI QOLIB KETADI*\n\n🔍 *Sabab:*\n• Nasos (pompa) nosoz\n• Chiqish filtri tiqilgan\n• Chiqarish shlangida bukilish bor\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Pastdagi kichik qopqoqni (filtr qopqog'ini) toping — ostiga lagan qo'ying\n2️⃣ Qopqoqni sekin oching — suv chiqadi, filtrni tozalang\n3️⃣ Chiqarish shlangini tekshiring — egilgan yoki tiqilgan joylar bormi?\n4️⃣ Xato kod: E20, F21, OE, E4 — bular hammasi suv qolmoqda degani", "text_ru": "🫧 *СТИРАЛЬНАЯ МАШИНА — НЕ СЛИВАЕТ ВОДУ*\n\n🔍 *Причины:*\n• Неисправен насос (помпа)\n• Засорён сливной фильтр\n• Перегиб сливного шланга\n\n✅ *Попробуйте сами:*\n1️⃣ Найдите маленькую крышку снизу (крышка фильтра) — подставьте таз\n2️⃣ Медленно открутите крышку — вытечёт вода, достаньте и очистите фильтр\n3️⃣ Проверьте сливной шланг — нет ли перегибов или засора?\n4️⃣ Код ошибки: E20, F21, OE, E4 — всё это означает 'не сливает воду'"}, {"label_uz": "🫧 Eshik ochilmaydi", "label_ru": "🫧 Дверца не открывается", "text_uz": "🫧 *KIR YUVISH MASHINASI — ESHIK OCHILMAYDI*\n\n🔍 *Sabab:*\n• Dastur hali tugamagan\n• Ichida suv qolib ketgan\n• Elektron qulf (door lock) nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Dastur to'liq tugaganini kuting — ba'zan 2-3 daqiqa vaqt kerak\n2️⃣ Ichida suv bormi? — *Spin* (siqib chiqarish) dasturini ishlatng\n3️⃣ Elektrni o'chib, 3 daqiqa kuting, qayta yoqing\n4️⃣ Favqulodda ochish: Mashinangizning pastki filtr qopqog'i yonida ip bormi? — tortib ko'ring", "text_ru": "🫧 *СТИРАЛЬНАЯ МАШИНА — ДВЕРЦА НЕ ОТКРЫВАЕТСЯ*\n\n🔍 *Причины:*\n• Программа ещё не завершена\n• Внутри осталась вода\n• Неисправен электронный замок (door lock)\n\n✅ *Попробуйте сами:*\n1️⃣ Дождитесь полного завершения программы — иногда нужно 2-3 минуты\n2️⃣ Есть вода внутри? — запустите программу *Отжим (Spin)*\n3️⃣ Отключите питание на 3 минуты, включите снова\n4️⃣ Аварийное открытие: у крышки фильтра снизу есть верёвочка? — потяните"}, {"label_uz": "🫧 Suv isitmaydi", "label_ru": "🫧 Не нагревает воду", "text_uz": "🫧 *KIR YUVISH MASHINASI — SUVI ISITMAYDI*\n\n🔍 *Sabab:*\n• TEN (isitgich) yonib ketgan\n• Termostat nosoz\n• Sensor muammosi\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ 60°C dastur tanlang — yuvilayotgan kiyim iliq bo'lishi kerak\n2️⃣ Agar iliq bo'lmasa — TEN nosoz ehtimoli yuqori\n3️⃣ Xato kod: E6, F06, TE, H — isitgich muammosi\n\n⚠️ TEN ni o'zingiz almashtira olasiz — arzong ta'mirlash\nMultimetрda tekshiring: 30-60 Om bo'lsa soz, 0 yoki ∞ bo'lsa nosoz", "text_ru": "🫧 *СТИРАЛЬНАЯ МАШИНА — НЕ НАГРЕВАЕТ ВОДУ*\n\n🔍 *Причины:*\n• Перегорел ТЭН (нагревательный элемент)\n• Неисправен термостат\n• Проблема с датчиком температуры\n\n✅ *Попробуйте сами:*\n1️⃣ Запустите программу 60°C — бельё должно быть тёплым\n2️⃣ Если не тёплое — скорее всего неисправен ТЭН\n3️⃣ Код ошибки: E6, F06, TE, H — проблема нагрева\n\n⚠️ ТЭН можно заменить самому — недорогой ремонт\nПроверьте мультиметром: 30-60 Ом — норма, 0 или ∞ — неисправен"}, {"label_uz": "🫧 Yonmaydi", "label_ru": "🫧 Не включается", "text_uz": "🫧 *KIR YUVISH MASHINASI — YONMAYDI*\n\n🔍 *Sabab:*\n• Rozetkada tok yo'q\n• Eshik mahkam yopilmagan\n• Uy sigorta qutisi ishlagan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Rozetkaga boshqa qurilmani ulang — tok bormi?\n2️⃣ Eshikni mahkam yoping — 'klik' eshitilishi kerak\n3️⃣ Uy sigorta qutisini tekshiring — avtomat tushib qolgan bo'lishi mumkin\n4️⃣ Vilkani uzib, 5 daqiqa kuting, qayta ulang\n5️⃣ Boshqa rozetkada sinab ko'ring", "text_ru": "🫧 *СТИРАЛЬНАЯ МАШИНА — НЕ ВКЛЮЧАЕТСЯ*\n\n🔍 *Причины:*\n• Нет тока в розетке\n• Дверца неплотно закрыта\n• Сработал автомат в щитке\n\n✅ *Попробуйте сами:*\n1️⃣ Подключите другой прибор к розетке — есть ток?\n2️⃣ Плотно закройте дверцу — должен быть щелчок 'клик'\n3️⃣ Проверьте автоматы в щитке — не выбило ли?\n4️⃣ Отключите вилку на 5 минут, вставьте снова\n5️⃣ Попробуйте другую розетку"}]}, {"id": "suv", "icon": "💧", "name_uz": "Suv isitgich", "name_ru": "Водонагреватель", "type": "flat", "items": [{"label_uz": "💧 Suv oqib qoldi", "label_ru": "💧 Течёт вода", "text_uz": "💧 *SUV ISITGICH (BOJLER) — SUV OQADI*\n\n🔍 *Sabab va joyi:*\n• Bosim ventili (klapan) — bu NORMAL, xavotir olmang\n• Fitinglar (ulash joylari) — yechimasi bor\n• Tank pastidan — tank teshilgan\n• TEN atrofidan — anod yoki TEN yeyilgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Bosim ventilidan (yon tomondagi klapan) tomishi — suv isiganda kengayadi, bu NORMAL\n2️⃣ Fitinglardan (quvur ulanish joylaridan) tomsa — fum lenta o'rab qayta ulang\n3️⃣ Tank pastidan yoki atrofidan oqsa — usta chaqiring, tank teshilgan\n4️⃣ TEN atrofidan oqsa — anod va TEN almashtirish kerak", "text_ru": "💧 *ВОДОНАГРЕВАТЕЛЬ (БОЙЛЕР) — ТЕЧЁТ ВОДА*\n\n🔍 *Причины и место:*\n• Предохранительный клапан — это НОРМАЛЬНО, не беспокойтесь\n• Фитинги (места соединений) — поддаётся ремонту\n• Снизу бака — бак прогнил\n• Вокруг ТЭНа — анод или ТЭН износился\n\n✅ *Попробуйте сами:*\n1️⃣ Капли из предохранительного клапана (сбоку) — при нагреве вода расширяется, это НОРМАЛЬНО\n2️⃣ Течёт из фитингов — намотайте ФУМ-ленту и подтяните\n3️⃣ Течёт снизу бака или вокруг него — вызовите мастера, бак прогнил\n4️⃣ Течёт вокруг ТЭНа — нужна замена анода и ТЭНа"}, {"label_uz": "💧 Issiq suv chiqmaydi", "label_ru": "💧 Нет горячей воды", "text_uz": "💧 *SUV ISITGICH — ISSIQ SUV CHIQMAYDI*\n\n🔍 *Sabab:*\n• TEN (isitgich) yonib ketgan\n• Termostat nosoz\n• Elektr muammosi\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Indikator chiroq yonayaptimi? — yonmasa elektr yo'q\n2️⃣ Haroratni 65°C ga qo'ying va 1-2 soat kuting\n3️⃣ Reset tugmasini bosing (ko'pincha termostat ustida, qizil tugma)\n4️⃣ TEN ni multimetрda tekshiring: 10-50 Om — soz, 0 yoki ∞ — nosoz\n5️⃣ Bojler qanchalik eski? 5 yildan oshgan bo'lsa TEN almashtirish vaqti", "text_ru": "💧 *ВОДОНАГРЕВАТЕЛЬ — НЕТ ГОРЯЧЕЙ ВОДЫ*\n\n🔍 *Причины:*\n• Перегорел ТЭН\n• Неисправен термостат\n• Проблема с электричеством\n\n✅ *Попробуйте сами:*\n1️⃣ Горит ли индикатор? — не горит: нет электричества\n2️⃣ Установите 65°C и ждите 1-2 часа\n3️⃣ Нажмите кнопку Reset (обычно красная кнопка на термостате)\n4️⃣ Проверьте ТЭН мультиметром: 10-50 Ом — норма, 0 или ∞ — неисправен\n5️⃣ Бойлеру больше 5 лет? Пора менять ТЭН"}]}, {"id": "komp", "icon": "🖥️", "name_uz": "Kompyuter / Noutbuk", "name_ru": "Компьютер / Ноутбук", "type": "flat", "items": [{"label_uz": "🖥️ Yonmaydi", "label_ru": "🖥️ Не включается", "text_uz": "🖥️ *KOMPYUTER / NOUTBUK — YONMAYDI*\n\n🔍 *Sabab:*\n• Adapter yoki batareya muammosi\n• RAM kontakti oksidlangan\n• CMOS batareya tugagan\n• Anakart nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Adapter kuchlanishini o'lching — 19V yoki 20V bo'lishi kerak\n2️⃣ Batareyani olib, faqat adapter bilan ulab sinang\n3️⃣ CMOS batareyasini (CR2032, tangasimon) almashtiring\n4️⃣ RAM ni olib, kontaktlarini karandash o'chir (rezinka) bilan tozalang\n5️⃣ RAM ni boshqa uyaga solib sinab ko'ring", "text_ru": "🖥️ *КОМПЬЮТЕР / НОУТБУК — НЕ ВКЛЮЧАЕТСЯ*\n\n🔍 *Причины:*\n• Проблема с адаптером или батареей\n• Окислились контакты ОЗУ\n• Разрядилась батарейка CMOS\n• Неисправна материнская плата\n\n✅ *Попробуйте сами:*\n1️⃣ Измерьте напряжение адаптера — должно быть 19V или 20V\n2️⃣ Уберите батарею, запустите только от адаптера\n3️⃣ Замените батарейку CMOS (CR2032, монетка)\n4️⃣ Достаньте ОЗУ, протрите контакты ластиком\n5️⃣ Вставьте ОЗУ в другой слот и попробуйте"}, {"label_uz": "🖥️ Qizib ketmoqda", "label_ru": "🖥️ Перегревается", "text_uz": "🖥️ *KOMPYUTER / NOUTBUK — QIZIB KETMOQDA*\n\n🔍 *Sabab:*\n• Sovutish tizimi chang bilan to'lib ketgan\n• Termointerface (pasta) qurib qolgan\n• Fan ishlamayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ HWMonitor dasturini yuklab, haroratni tekshiring:\n   • CPU: 90°C dan past — normal\n   • 90°C dan yuqori — xavfli!\n2️⃣ Fan ishlayaptimi? Quloq soling yoki ko'ring\n3️⃣ Kompressorli havo yoki fen bilan sovutish teshiklarini puflang\n4️⃣ Noutbukni yostiq, to'shak ustida ishlatmang\n5️⃣ Qo'shimcha sovutgich sotib oling", "text_ru": "🖥️ *КОМПЬЮТЕР / НОУТБУК — ПЕРЕГРЕВАЕТСЯ*\n\n🔍 *Причины:*\n• Система охлаждения забита пылью\n• Термоинтерфейс (паста) засох\n• Вентилятор не работает\n\n✅ *Попробуйте сами:*\n1️⃣ Скачайте HWMonitor и проверьте температуру:\n   • CPU до 90°C — нормально\n   • Выше 90°C — опасно!\n2️⃣ Работает ли вентилятор? Прислушайтесь или посмотрите\n3️⃣ Продуйте вентиляционные отверстия баллончиком или феном\n4️⃣ Не используйте на подушке или кровати\n5️⃣ Купите дополнительную подставку-охладитель"}, {"label_uz": "🖥️ Qotib qolmoqda", "label_ru": "🖥️ Зависает", "text_uz": "🖥️ *KOMPYUTER / NOUTBUK — QOTIB QOLMOQDA*\n\n🔍 *Sabab:*\n• Disk muammosi (HDD yoki SSD)\n• Virus yoki zararli dastur\n• RAM muammosi\n• Windows tizim xatosi\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ *CrystalDiskInfo* yuklab, disk holatini tekshiring — 'Good' bo'lishi kerak\n2️⃣ *Malwarebytes* bilan virus skanerlang\n3️⃣ Windows: Start → Qidiruv → 'Windows Memory Diagnostic' → RAM sinovi\n4️⃣ Kompyuter to'satdan o'chib qolayaptimi? Quvvat bloki muammosi\n5️⃣ Ko'k ekran (BSOD) chiqayaptimi? — xato kodini yozing", "text_ru": "🖥️ *КОМПЬЮТЕР / НОУТБУК — ЗАВИСАЕТ*\n\n🔍 *Причины:*\n• Проблема с диском (HDD или SSD)\n• Вирус или вредоносная программа\n• Проблема с ОЗУ\n• Системная ошибка Windows\n\n✅ *Попробуйте сами:*\n1️⃣ Скачайте *CrystalDiskInfo*, проверьте диск — должно быть 'Good'\n2️⃣ Просканируйте *Malwarebytes* на вирусы\n3️⃣ Windows: Пуск → Поиск → 'Проверка памяти Windows' → тест ОЗУ\n4️⃣ Компьютер внезапно выключается? Проблема блока питания\n5️⃣ Синий экран (BSOD)? — запишите код ошибки"}]}, {"id": "dux", "icon": "♨️", "name_uz": "Duxovka", "name_ru": "Духовка", "type": "flat", "items": [{"label_uz": "♨️ Yonmaydi", "label_ru": "♨️ Не включается", "text_uz": "♨️ *DUXOVKA — YONMAYDI*\n\n🔍 *Sabab:*\n• Rozetkada tok yo'q\n• Sigorta ishlagan\n• Taymer noto'g'ri qo'yilgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Rozetkaga boshqa qurilma ulang — tok bormi?\n2️⃣ Uy sigorta qutisini tekshiring\n3️⃣ Taymerni tekshiring — nolga qo'ying yoki o'chirng\n4️⃣ Duxovka orqasidagi sigorta (ba'zilarida) bormi — tekshiring", "text_ru": "♨️ *ДУХОВКА — НЕ ВКЛЮЧАЕТСЯ*\n\n🔍 *Причины:*\n• Нет тока в розетке\n• Сработал предохранитель\n• Неверно выставлен таймер\n\n✅ *Попробуйте сами:*\n1️⃣ Подключите другой прибор к розетке — есть ток?\n2️⃣ Проверьте автоматы в щитке\n3️⃣ Проверьте таймер — поставьте на ноль или выключите\n4️⃣ Есть ли предохранитель сзади духовки — проверьте"}, {"label_uz": "♨️ Umuman qizitmaydi", "label_ru": "♨️ Совсем не нагревает", "text_uz": "♨️ *DUXOVKA — ISITMAYDI*\n\n🔍 *Sabab:*\n• TEN (isitgich element) nosoz\n• Himoya termostat ishlab, o'chirgan\n• Temperatura sensor nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Yoqib ko'ring — TEN qizil rangga kirishi kerak (1-2 daqiqada)\n2️⃣ Termostat reset tugmasini toping (odatda orqa tomonda, qizil tugmacha) — bosing\n3️⃣ TEN multimetрda tekshiring: 10-80 Om — soz, 0 yoki ∞ — nosoz\n4️⃣ Duxovka juda qizib ketganidan himoya ishlagan bo'lishi mumkin — 30 daqiqa sovitng", "text_ru": "♨️ *ДУХОВКА — НЕ НАГРЕВАЕТ*\n\n🔍 *Причины:*\n• Неисправен ТЭН\n• Сработал защитный термостат\n• Неисправен датчик температуры\n\n✅ *Попробуйте сами:*\n1️⃣ Включите и смотрите — ТЭН должен краснеть за 1-2 минуты\n2️⃣ Найдите кнопку Reset термостата (обычно сзади, красная кнопочка) — нажмите\n3️⃣ Проверьте ТЭН мультиметром: 10-80 Ом — норма, 0 или ∞ — неисправен\n4️⃣ Возможно, сработала защита от перегрева — остудите 30 минут"}, {"label_uz": "♨️ Tepasi qizitmaydi", "label_ru": "♨️ Верхний нагрев не работает", "text_uz": "♨️ *DUXOVKA — YUQORI ISITISH ISHLAMAYDI*\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Rejimni GRILL yoki 'yuqori+quyi' ga qo'ying\n2️⃣ Yuqori TEN qizarib turishi kerak — qiz ми:*\n1️⃣ Очистите дно под тарелкой — возможны остатки еды\n2️⃣ Правильно ли установлено кольцо вращения?\n3️⃣ Пластиковый держатель на 3 ножках — сломан?\n4️⃣ Звук мотора: гул/скрежет — мотор неисправен\n5️⃣ Мотор гудит, но тарелка не крутится — сломана ось"}]}, {"id": "piles", "icon": "🌀", "name_uz": "Changso'rg'ich", "name_ru": "Пылесос", "type": "flat", "items": [{"label_uz": "🌀 Ishlaydi lekin tortmaydi", "label_ru": "🌀 Работает, но не всасывает", "text_uz": "🌀 *CHANGSO'RG'ICH — TORTMAYDI (KUCHSIZ)*\n\n🔍 *Sabab:*\n• Sumka yoki konteyner to'lib ketgan\n• Filtr tiqilgan\n• Shlang tiqilgan\n• Cho'tka iplarga to'lgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Sumkani almashtiring yoki konteynerni bo'shating\n2️⃣ HEPA filtrni olib tozalang (silkiting yoki yuving)\n3️⃣ Shlangni tekshiring — tiqinmi? Og'zini berkiting, kuch oshishi kerak\n4️⃣ Cho'tkani tozalang — ip, soch, jun o'ralib qolgan bo'lishi mumkin\n5️⃣ Barcha ulanish joylarini tekshiring — bo'shliq yo'qmi?", "text_ru": "🌀 *ПЫЛЕСОС — НЕ ВСАСЫВАЕТ (СЛАБАЯ ТЯГА)*\n\n🔍 *Причины:*\n• Мешок или контейнер заполнен\n• Засорён фильтр\n• Засорён шланг\n• Щётка забита нитями\n\n✅ *Попробуйте сами:*\n1️⃣ Замените мешок или опустошите контейнер\n2️⃣ Снимите HEPA фильтр и очистите (встряхните или промойте)\n3️⃣ Проверьте шланг — засор? Заткните отверстие — мощность должна вырасти\n4️⃣ Очистите щётку — нити, волосы, шерсть могли намотаться\n5️⃣ Проверьте все соединения — нет ли зазоров?"}, {"label_uz": "🌀 Yonmaydi", "label_ru": "🌀 Не включается", "text_uz": "🌀 *CHANGSO'RG'ICH — YONMAYDI*\n\n🔍 *Sabab:*\n• Issiqliq himoyasi ishlagan\n• Kabel yoki vilka nosoz\n• Yoqish tugmasi nosoz\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Issiqliq himoyasi — changso'rg'ichni 20-30 daqiqa sovitib, qayta ulang\n2️⃣ Barcha filtrlarni tozalab qayta urinib ko'ring\n3️⃣ Kabelni butun bo'yi ko'zdan kechiring — singanmi?\n4️⃣ Boshqa rozetkada sinab ko'ring\n5️⃣ Yoqish tugmasini bir necha marta bosib ko'ring", "text_ru": "🌀 *ПЫЛЕСОС — НЕ ВКЛЮЧАЕТСЯ*\n\n🔍 *Причины:*\n• Сработала тепловая защита\n• Неисправен кабель или вилка\n• Неисправна кнопка включения\n\n✅ *Попробуйте сами:*\n1️⃣ Тепловая защита — дайте остыть 20-30 минут, включите снова\n2️⃣ Почистите все фильтры и попробуйте снова\n3️⃣ Осмотрите кабель на всём протяжении — есть ли повреждения?\n4️⃣ Попробуйте другую розетку\n5️⃣ Нажмите кнопку включения несколько раз"}]}, {"id": "dazmol", "icon": "👕", "name_uz": "Dazmol", "name_ru": "Утюг", "type": "flat", "items": [{"label_uz": "👕 Yonmaydi", "label_ru": "👕 Не включается", "text_uz": "👕 *DAZMOL — YONMAYDI*\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Rozetkaga boshqa qurilma ulang — tok bormi?\n2️⃣ Termostatni eng past holatiga qo'ying\n3️⃣ Kabelni butun bo'yi ko'zdan kechiring — singanmi, ezilganmi?\n4️⃣ Boshqa rozetkada sinab ko'ring\n5️⃣ Ichki sigortani multimetрda tekshiring", "text_ru": "👕 *УТЮГ — НЕ ВКЛЮЧАЕТСЯ*\n\n✅ *Попробуйте сами:*\n1️⃣ Подключите другой прибор к розетке — есть ток?\n2️⃣ Поставьте терморегулятор на минимум\n3️⃣ Осмотрите кабель — есть ли перегибы или повреждения?\n4️⃣ Попробуйте другую розетку\n5️⃣ Проверьте внутренний предохранитель мультиметром"}, {"label_uz": "👕 Qizitmaydi", "label_ru": "👕 Не нагревает", "text_uz": "👕 *DAZMOL — QIZITMAYDI*\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Haroratni maksimumga qo'ying, 1 daqiqa kuting\n2️⃣ Chiroq yonayaptimi, lekin dazmol qizmayaptimi? — TEN nosoz\n3️⃣ Dazmol juda qizib ketib himoya ishlagan bo'lishi mumkin — 10 daqiqa sovitng\n4️⃣ Termostat nosoz bo'lishi ham mumkin", "text_ru": "👕 *УТЮГ — НЕ НАГРЕВАЕТ*\n\n✅ *Попробуйте сами:*\n1️⃣ Поставьте на максимум, ждите 1 минуту\n2️⃣ Лампочка горит, но утюг не греет? — ТЭН неисправен\n3️⃣ Возможно сработала защита от перегрева — остудите 10 минут\n4️⃣ Возможно неисправен термостат"}, {"label_uz": "👕 Tag qismini tozalash", "label_ru": "👕 Чистка подошвы", "text_uz": "👕 *DAZMOL TAG QISMINI TOZALASH*\n\n🔸 *Oddiy kir:*\n→ Issiq holatda sham (parafin) bilan ishqalang → toza gazlama bilan arting\n\n🔸 *Kuygan iz:*\n→ Sirka + tuz aralashmasi bilan artng\n→ Maxsus tozalagich spreyi\n\n🔸 *Qattiq kir (smola, plastik):*\n→ Limon kislotasi (1 choy qoshiq + 200ml suv)\n→ Sovuq holatda atsetonsiz lak ketkazgich\n\n💡 Keyinchalik: tegla qismini quruq saqlang, yoqar holatda dazmol ustiga qo'ymang", "text_ru": "👕 *УТЮГ — ЧИСТКА ПОДОШВЫ*\n\n🔸 *Обычная грязь:*\n→ В горячем состоянии натрите свечой (парафин) → протрите чистой тканью\n\n🔸 *Пригоревшие следы:*\n→ Смесь уксуса и соли\n→ Специальный чистящий спрей\n\n🔸 *Твёрдые загрязнения (смола, пластик):*\n→ Лимонная кислота (1 ч.л. + 200мл воды)\n→ В холодном состоянии жидкость для снятия лака без ацетона\n\n💡 В будущем: держите подошву сухой, не кладите горячий утюг вниз"}, {"label_uz": "👕 Ichini tozalash", "label_ru": "👕 Чистка паровых отверстий", "text_uz": "👕 *DAZMOL BUG' TESHIKLARINI TOZALASH*\n\n🔍 *Sabab:* Qattiq suv tuzlari teshiklarni yopib qolgan\n\n✅ *Qadamlar:*\n1️⃣ Limon kislotasi (2 choy qoshiq + 500ml suv) aralashtirib to'ldiring\n2️⃣ Dazmolni maksimal harorat + bug' rejimiga qo'ying\n3️⃣ Bug'ni to'liq chiqarib bo'shating\n4️⃣ 2-3 marta toza suv bilan takrorlang\n5️⃣ Bug' teshigi bilan yuzing — teshiklar ochildi\n\n💡 *Kelajakda:* faqat distilliyangan suv ishlating — tuz yo'q!", "text_ru": "👕 *УТЮГ — ЧИСТКА ПАРОВЫХ ОТВЕРСТИЙ*\n\n🔍 *Причина:* Соли жёсткой воды забили отверстия\n\n✅ *Шаги:*\n1️⃣ Смешайте лимонную кислоту (2 ч.л. + 500мл воды), залейте\n2️⃣ Поставьте на максимальную температуру + режим пара\n3️⃣ Полностью выпустите пар\n4️⃣ Повторите 2-3 раза с чистой водой\n5️⃣ Проведите подошвой по ткани — отверстия открылись\n\n💡 *В будущем:* используйте только дистиллированную воду — без солей!"}]}, {"id": "vent", "icon": "💨", "name_uz": "Ventilyator", "name_ru": "Вентилятор", "type": "single", "text_uz": "💨 *VENTILYATOR — NOSOZLIKLAR*\n\n🔸 *Sekin aylanadi yoki to'xtab-to'xtab ishlaydi:*\n→ Motor o'qiga 2-3 tomchi mashinali yog' toming\n→ Kondensator nosoz bo'lishi mumkin (arzonga almashtiriladi)\n\n🔸 *Qattiq shovqin:*\n→ Qanot vintsini (boltini) tekshiring — bo'shab qolgan\n→ Qanot egilganmi? To'g'rilang\n→ Motor ichida moy qolmagan bo'lishi mumkin\n\n🔸 *Yonmaydi:*\n→ Boshqa rozetkada sinang\n→ Kabelni tekshiring — singanmi?\n→ Tugmani bir necha marta bosib ko'ring\n\n🔸 *Pult bilan ishlamaydi:*\n→ Pult batareyasini yanging\n→ IR sensor oldida to'siq bormi?", "text_ru": "💨 *ВЕНТИЛЯТОР — НЕИСПРАВНОСТИ*\n\n🔸 *Медленно крутится или работает с остановками:*\n→ Капните 2-3 капли машинного масла в ось мотора\n→ Возможно неисправен конденсатор (недорогая замена)\n\n🔸 *Громкий шум:*\n→ Проверьте болт крыльчатки — ослаб?\n→ Крыльчатка погнута? Выпрямите\n→ В моторе могло закончиться масло\n\n🔸 *Не включается:*\n→ Попробуйте другую розетку\n→ Проверьте кабель — есть ли повреждения?\n→ Нажмите кнопку несколько раз\n\n🔸 *Не реагирует на пульт:*\n→ Замените батарейки пульта\n→ Нет ли преграды перед ИК-датчиком?"}, {"id": "stab", "icon": "⚡", "name_uz": "Stabilizator", "name_ru": "Стабилизатор", "type": "single", "text_uz": "⚡ *STABILIZATOR — NOSOZLIKLAR*\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ *Kirish kuchlanishi:* multimetрda 180-250V bo'lishi kerak\n2️⃣ *Chiqish kuchlanishi:* 220V ± 5V bo'lishi kerak\n3️⃣ *Yuklamani tekshiring:* umumiy quvvat stabilizator quvvatining 80% dan oshmasin\n4️⃣ *Ichki sigorta:* stabilizatorni oching — sigorta kuymagan bo'lsin\n5️⃣ *Sovutish:* teshiklar chang bilan to'lmagan bo'lsin\n6️⃣ *Bekor ishlayapti?:* releni tozalash kerak bo'lishi mumkin", "text_ru": "⚡ *СТАБИЛИЗАТОР — НЕИСПРАВНОСТИ*\n\n✅ *Попробуйте сами:*\n1️⃣ *Входное напряжение:* мультиметром 180-250V\n2️⃣ *Выходное напряжение:* должно быть 220V ± 5V\n3️⃣ *Проверьте нагрузку:* общая мощность не должна превышать 80% мощности стабилизатора\n4️⃣ *Внутренний предохранитель:* откройте корпус — предохранитель цел?\n5️⃣ *Охлаждение:* вентиляционные отверстия не должны быть забиты пылью\n6️⃣ *Работает вхолостую?:* возможно нужна чистка реле"}, {"id": "ups", "icon": "🔌", "name_uz": "UPS / Akkumulyator", "name_ru": "ИБП / Аккумулятор", "type": "single", "text_uz": "🔌 *UPS / AKKUMULYATOR — NOSOZLIKLAR*\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ *Akkumulyator yoshi:* 3 yildan oshgan bo'lsa — almashtirish vaqti\n2️⃣ *Multimetр bilan tekshiring:*\n   • 12-13V — to'la zaryadlangan\n   • 11-12V — zaryad kamaymoqda\n   • 11V dan past — almashtirish kerak\n3️⃣ *Akkumulyatorsiz sinang:* UPS dan akkumulyatorn olib, tok bilan yoqing — ishlasа UPS soz\n4️⃣ *Doimo chiqqan holda ishlayapti?:* akkumulyator shishib ketgan yoki nosoz\n5️⃣ *Signal berib, o'chib qolayapti?:* akkumulyator zaryadni ushlab turolmayapti", "text_ru": "🔌 *ИБП / АККУМУЛЯТОР — НЕИСПРАВНОСТИ*\n\n✅ *Попробуйте сами:*\n1️⃣ *Возраст аккумулятора:* больше 3 лет — пора менять\n2️⃣ *Проверьте мультиметром:*\n   • 12-13V — полностью заряжен\n   • 11-12V — заряд снижается\n   • Ниже 11V — нужна замена\n3️⃣ *Тест без аккумулятора:* извлеките АКБ, включите от сети — ИБП работает? Значит ИБП исправен\n4️⃣ *Постоянно работает на выходе?:* аккумулятор вздулся или неисправен\n5️⃣ *Пищит и выключается?:* аккумулятор не держит заряд"}, {"id": "printer", "icon": "🖨️", "name_uz": "Printer", "name_ru": "Принтер", "type": "printer", "subtypes": [{"id": "rangli", "name_uz": "Rangli (inkjet) printer", "name_ru": "Струйный (inkjet) принтер", "brands": [{"name": "🖨️ Canon (rangli)", "items": [{"label_uz": "🖨️ Canon: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Canon: Выходит пустой лист", "text_uz": "🖨️ *CANON (RANGLI) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter qog'ozni tortadi, lekin varaqda hech narsa bosilmaydi yoki juda kuchsiz iz qoladi. Bu, odatda, siyoh purkagichlari (nozzle) tiqilib qolgani, kartrijda havo pufakchasi hosil bo'lgani yoki kartrij chipi kompyuter/printerga signal yubormayotgani sababli yuzaga keladi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer paneli yoki kompyuterdan: Sozlamalar → Texnik xizmat (Maintenance) → Bosh tozalash (Head Cleaning) ni ishga tushiring\n2️⃣ Natija yaxshilanmasa, Chuqur tozalash (Deep Cleaning) ni bajaring — 2-3 marta orasida 10 daqiqa tanaffus bilan qayting\n3️⃣ Nozzle Check (purkagich tekshiruvi) sahifasini chop eting — qaysi rang chiqmayotganini aniqlang\n4️⃣ Kartrijlarni chiqarib, kontaktlarini quruq, momiqsiz mato bilan artib qaytadan o'rnating\n5️⃣ Kartrijda siyoh darajasini tekshiring — arzon/qayta to'ldirilgan kartrij bo'lsa, chip xato ko'rsatishi mumkin, original yoki sifatli kartrij bilan almashtiring\n6️⃣ Muammo davom etsa — bosh (printhead) tiqilib qolgan, ustaga olib boring, u ultratovush yoki maxsus suyuqlik bilan chuqur tozalaydi", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер захватывает бумагу, но ничего не печатает или печать почти незаметна. Обычно причина — засорение дюз печатающей головки, воздух в картридже или чип картриджа не передаёт сигнал.\n\n✅ *Подробное решение:*\n1️⃣ В панели принтера или на компьютере: Настройки → Обслуживание → Очистка головки (Head Cleaning)\n2️⃣ Если не помогло — запустите Глубокую очистку (Deep Cleaning), повторите 2-3 раза с паузой 10 минут\n3️⃣ Распечатайте тест дюз (Nozzle Check) — определите, какой цвет не выходит\n4️⃣ Извлеките картриджи и протрите контакты сухой безворсовой тканью, установите обратно\n5️⃣ Проверьте уровень чернил — дешёвый/перезаправленный картридж может давать ошибку чипа, замените на оригинальный или качественный\n6️⃣ Если не помогло — забита сама головка, обратитесь к мастеру для ультразвуковой или химической глубокой чистки"}, {"label_uz": "🖨️ Canon: Ranglar xira, chiziqlar bor", "label_ru": "🖨️ Canon: Цвета блёклые, есть полосы", "text_uz": "🖨️ *CANON (RANGLI) — RANGLAR XIRA, CHIZIQLAR BOR*\n\n🔍 *Keng tavsif:*\nChop etilgan rasm yoki matnda gorizontal chiziqlar, oqargan joylar yoki rang aralashuvi ko'rinadi. Sabab — nozzle qisman tiqilgani, print bosh joylashuvi (alignment) buzilgani yoki bitta rang kartriji tugagani.\n\n✅ *Batafsil yechim:*\n1️⃣ Nozzle Check sahifasini chop eting — qaysi chiziq uzilganini ko'ring\n2️⃣ Head Cleaning, so'ng Print Head Alignment (bosh moslashtirish) funksiyasini ketma-ket bajaring\n3️⃣ Har bir rangning (Cyan, Magenta, Yellow, Black) darajasini alohida tekshiring\n4️⃣ Qog'oz turi sozlamasini tekshiring — noto'g'ri qog'oz profili rangni buzadi\n5️⃣ Original bo'lmagan siyoh ishlatilgan bo'lsa, nozzle tezroq tiqiladi — sifatli siyoh/kartrijga o'ting\n6️⃣ Alignment va tozalashdan keyin ham chiziq qolsa — bosh eskirgan, almashtirish yoki ustaxonada professional tozalash kerak", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — БЛЁКЛЫЕ ЦВЕТА, ПОЛОСЫ*\n\n🔍 *Подробное описание:*\nНа отпечатке видны горизонтальные полосы, выцветшие участки или смешение цветов. Причина — частичное засорение дюз, сбой выравнивания головки или закончился один из цветов.\n\n✅ *Подробное решение:*\n1️⃣ Распечатайте тест дюз — определите, где обрыв линии\n2️⃣ Выполните Head Cleaning, затем Print Head Alignment по очереди\n3️⃣ Проверьте уровень каждого цвета (Cyan, Magenta, Yellow, Black) отдельно\n4️⃣ Проверьте настройку типа бумаги — неверный профиль искажает цвет\n5️⃣ Неоригинальные чернила забивают дюзы быстрее — перейдите на качественные чернила/картриджи\n6️⃣ Если полосы остаются после очистки и выравнивания — головка изношена, нужна замена или профессиональная чистка у мастера"}, {"label_uz": "🖨️ Canon: 5B00 xatosi (siyoh singdirgich to'lgan)", "label_ru": "🖨️ Canon: Ошибка 5B00 (переполнен поглотитель чернил)", "text_uz": "🖨️ *CANON (RANGLI) — 5B00 XATOSI*\n\n🔍 *Keng tavsif:*\n\"5B00\" yoki \"P07\" xatosi Canon printerlarida siyoh singdirgich (waste ink absorber/pad) to'lib qolganini bildiradi. Printer chop etishni to'xtatadi va chiroqlar bir maromda yonib-o'chadi. Bu dastur bilan ishlaydigan xato — uy sharoitida to'liq bartaraf etib bo'lmaydi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, 1 daqiqa kutib qayta yoqing — vaqtinchalik ishlashi mumkin, lekin sabab yo'qolmaydi\n2️⃣ Bu doimiy yechim EMAS — singdirgich fiziqik jihatdan almashtirilishi yoki ustaxonada tozalanishi kerak\n3️⃣ Ustaga olib borilganda: singdirgichni almashtirish + maxsus servis dasturi (Service Tool) orqali xato hisoblagichini (waste ink counter) reset qilish talab qilinadi\n4️⃣ O'zingiz servis dasturisiz reset qilishga urinmang — noto'g'ri bajarilsa printer boshqa xatoliklar berishi mumkin\n5️⃣ Kelajakda oldini olish uchun: printerni uzoq vaqt uzluksiz ishlatmang, davriy tozalashni kamroq qiling (faqat kerak bo'lganda)", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — ОШИБКА 5B00*\n\n🔍 *Подробное описание:*\nОшибка \"5B00\" или \"P07\" у Canon означает, что поглотитель отработанных чернил (waste ink absorber/pad) переполнен. Принтер прекращает печать, индикаторы мигают синхронно. Это программная блокировка — дома полностью не устраняется.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, подождите 1 минуту и включите — может временно заработать, но причина не устранена\n2️⃣ Это НЕ постоянное решение — прокладку нужно физически заменить или очистить у мастера\n3️⃣ У мастера: замена поглотителя + сброс счётчика отработанных чернил через сервисную программу (Service Tool)\n4️⃣ Не пытайтесь сбросить счётчик самостоятельно без сервисной программы — при ошибке принтер может выдать новые сбои\n5️⃣ Для профилактики: не давайте принтеру работать непрерывно долго, не запускайте чистку головки без необходимости"}, {"label_uz": "🖨️ Canon: Qog'oz tortmayapti / qisilib qoladi", "label_ru": "🖨️ Canon: Не захватывает бумагу / замятие", "text_uz": "🖨️ *CANON (RANGLI) — QOG'OZ TORTMAYAPTI / QISILIB QOLADI*\n\n🔍 *Keng tavsif:*\nPrinter qog'ozni umuman ichiga olmaydi, bir nechta varaqni birga tortadi yoki qog'oz yo'lda qisilib qoladi. Sabab — tortuvchi rolik (pickup roller) yeyilgani, changlangani yoki qog'oz noto'g'ri joylashtirilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, ichida qolgan qog'oz bo'lagini ehtiyotkorlik bilan asta torting (yirtib qoldirmang)\n2️⃣ Pickup rolikni sal namlangan (ho'l emas) mato bilan artib, changdan tozalang\n3️⃣ Qog'oz lotkasiga bir xil turdagi, egilib qolmagan qog'ozni tekis solib, yon cheklagichlarni moslang\n4️⃣ Bir vaqtda ko'p varaq solmang — 10-15 varaqdan oshirmang, varaqlarni \"yelpib\" ajrating\n5️⃣ Muammo takrorlansa, rolik yeyilgan — almashtirish kerak, bu ustaxonada 15-20 daqiqada bajariladigan oddiy ta'mir", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — НЕ ЗАХВАТЫВАЕТ БУМАГУ / ЗАМЯТИЕ*\n\n🔍 *Подробное описание:*\nПринтер вообще не берёт бумагу, захватывает сразу несколько листов или бумага застревает по пути. Причина — износ или загрязнение ролика захвата (pickup roller), либо бумага неправильно уложена.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и аккуратно, не разрывая, извлеките застрявший лист\n2️⃣ Протрите ролик захвата слегка влажной (не мокрой) тканью от пыли\n3️⃣ Уложите ровную, одинаковую бумагу в лоток, выставьте боковые направляющие\n4️⃣ Не кладите больше 10-15 листов за раз, предварительно \"веерно\" разделите их\n5️⃣ Если проблема повторяется — ролик изношен и требует замены, это простой ремонт на 15-20 минут у мастера"}, {"label_uz": "🖨️ Canon: Wi-Fi orqali topmayapti", "label_ru": "🖨️ Canon: Не находит через Wi-Fi", "text_uz": "🖨️ *CANON (RANGLI) — WI-FI ORQALI TOPMAYAPTI*\n\n🔍 *Keng tavsif:*\nKompyuter yoki telefon ilovasi (Canon PRINT) printerni tarmoqda ko'rmaydi yoki ulanish uzilib qoladi. Sabab — printer boshqa Wi-Fi tarmog'iga ulangan, router sozlamalari (2.4GHz/5GHz) yoki drayver muammosi bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer paneli/ekranidan Wi-Fi sozlamalarini oching va router nomini (SSID) hamda parolni qaytadan kiriting\n2️⃣ Ko'p Canon modellari faqat 2.4GHz tarmoqqa ulanadi — routeringizda 5GHz alohida nom bilan bo'lsa, 2.4GHz tarmoqqa ulaning\n3️⃣ Printer va kompyuter/telefon bir xil Wi-Fi tarmog'ida ekanini tekshiring\n4️⃣ Canon PRINT ilovasi yoki kompyuter drayverini eng so'nggi versiyaga yangilang\n5️⃣ Routerni qayta yoqing (reboot), keyin printerni ham qayta yoqing\n6️⃣ Yordam bermasa, USB kabel orqali vaqtincha ulab ishlatib turing va ustadan tarmoq sozlashni so'rang", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — НЕ НАХОДИТ ЧЕРЕЗ WI-FI*\n\n🔍 *Подробное описание:*\nКомпьютер или приложение (Canon PRINT) не видит принтер в сети или соединение постоянно обрывается. Причина — принтер подключён к другой сети, настройки роутера (2.4GHz/5GHz) или проблема с драйвером.\n\n✅ *Подробное решение:*\n1️⃣ На панели принтера откройте настройки Wi-Fi и заново введите имя сети (SSID) и пароль\n2️⃣ Многие модели Canon работают только в сети 2.4GHz — если у роутера отдельное имя для 5GHz, подключайтесь именно к 2.4GHz\n3️⃣ Убедитесь, что принтер и компьютер/телефон в одной Wi-Fi сети\n4️⃣ Обновите приложение Canon PRINT или драйвер до последней версии\n5️⃣ Перезагрузите роутер, затем перезагрузите принтер\n6️⃣ Если не помогает — временно подключитесь через USB и обратитесь к мастеру для настройки сети"}, {"label_uz": "🖨️ Canon: Kartrij tanilmayapti / \"no ink\"", "label_ru": "🖨️ Canon: Картридж не определяется / \"no ink\"", "text_uz": "🖨️ *CANON (RANGLI) — KARTRIJ TANILMAYAPTI / \"NO INK\"*\n\n🔍 *Keng tavsif:*\nPrinter kartrij o'rnatilganda ham \"kartrij yo'q\" yoki \"siyoh tugadi\" deb xato beradi, garchi kartrij to'la bo'lsa ham. Sabab — kartrij kontakti kirlangan, chip ishdan chiqqan yoki qayta to'ldirilgan kartrij chipi tanilmayapti.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, oltin rangli kontakt qismini quruq, momiqsiz mato yoki spirt shimdirilgan paxta bilan asta artib, quritib qaytadan o'rnating\n2️⃣ Kartrijni printerda \"klik\" ovozi chiqquncha bosib o'rnating — to'liq o'tirmagan bo'lishi mumkin\n3️⃣ Boshqa kartrij bo'lsa, o'sha bilan sinab ko'ring — agar u ishlasa, muammo aynan kartrijda\n4️⃣ Printerni to'liq o'chirib, elektr shnurini rozetkadan chiqarib, 1 daqiqadan so'ng qayta ulang (chip xatosini reset qiladi)\n5️⃣ Qayta to'ldirilgan kartrij chipi \"o'lgan\" bo'lishi mumkin — original yoki yangi chipli kartrijga almashtirish tavsiya etiladi\n6️⃣ Davom etsa, kartrij ushlagichi (cartridge holder) kontaktlari nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — КАРТРИДЖ НЕ ОПРЕДЕЛЯЕТСЯ / \"NO INK\"*\n\n🔍 *Подробное описание:*\nПринтер выдаёт ошибку \"картридж отсутствует\" или \"чернила закончились\", даже если картридж полный. Причина — загрязнены контакты картриджа, неисправен чип или чип перезаправленного картриджа не распознаётся.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, аккуратно протрите золотистые контакты сухой безворсовой тканью или ватой со спиртом, дайте высохнуть и установите обратно\n2️⃣ Устанавливайте картридж до щелчка — возможно, он не до конца встал\n3️⃣ Если есть другой картридж, проверьте с ним — если работает, проблема именно в картридже\n4️⃣ Полностью выключите принтер, выньте шнур из розетки на 1 минуту и включите снова (сброс ошибки чипа)\n5️⃣ Чип перезаправленного картриджа может быть \"мёртвым\" — рекомендуется заменить на оригинальный или картридж с новым чипом\n6️⃣ Если не помогает — неисправны контакты держателя картриджа, нужна диагностика у мастера"}, {"label_uz": "🖨️ Canon: Barcha chiroqlar birga miltillaydi / umuman ishga tushmaydi", "label_ru": "🖨️ Canon: Все индикаторы мигают вместе / не запускается", "text_uz": "🖨️ *CANON (RANGLI) — BARCHA CHIROQLAR BIRGA MILTILLAYDI / UMUMAN ISHGA TUSHMAYDI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilganda barcha indikatorlar bir vaqtda yonib-o'chadi yoki printer umuman ishga tushmaydi (ekran/chiroq yonmaydi). Bu odatda jiddiy \"fatal error\" — boshqaruv platasi (mainboard), quvvat blogi (power supply) yoki karetka mexanizmi bilan bog'liq bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni tarmoqdan to'liq uzib, 5 daqiqa kutib qayta ulang\n2️⃣ Elektr tarmog'i barqarorligini tekshiring — stabilizator yoki boshqa rozetkada sinab ko'ring\n3️⃣ Karetka yo'lida qog'oz bo'lagi yoki begona jism yo'qligini tekshiring, bo'lsa ehtiyotkorlik bilan tozalang\n4️⃣ Kartrijlarni chiqarib, qaytadan to'g'ri o'rnating\n5️⃣ Agar chiroqlar hali ham milt-milt qilsa va ekranda hech narsa chiqmasa — bu quvvat blogi yoki mainboard nosozligi, uy sharoitida tuzatib bo'lmaydi\n6️⃣ Ustaxonaga olib boring — platani diagnostika qilish va kerakli qismni almashtirish talab qilinadi", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — ВСЕ ИНДИКАТОРЫ МИГАЮТ ВМЕСТЕ / НЕ ЗАПУСКАЕТСЯ*\n\n🔍 *Подробное описание:*\nПри включении все индикаторы мигают одновременно, либо принтер вообще не включается (экран/лампа не загорается). Обычно это серьёзная \"fatal error\" — связано с платой управления, блоком питания или механизмом каретки.\n\n✅ *Подробное решение:*\n1️⃣ Полностью отключите принтер от сети, подождите 5 минут и включите снова\n2️⃣ Проверьте стабильность электросети — попробуйте стабилизатор или другую розетку\n3️⃣ Проверьте путь каретки на наличие бумаги или посторонних предметов, при необходимости аккуратно уберите\n4️⃣ Извлеките картриджи и установите их заново\n5️⃣ Если индикаторы продолжают мигать, а на экране ничего нет — это неисправность блока питания или платы управления, дома не устраняется\n6️⃣ Обратитесь к мастеру — потребуется диагностика платы и замена нужной детали"}, {"label_uz": "🖨️ Canon: Bosh (karetka) g'ichirlaydi / harakatlanmaydi", "label_ru": "🖨️ Canon: Каретка скрипит / не двигается", "text_uz": "🖨️ *CANON (RANGLI) — BOSH (KARETKA) G'ICHIRLAYDI / HARAKATLANMAYDI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilganda karetka (print bosh joylashgan qism) o'z joyidan siljimaydi, g'ichirlab ovoz chiqaradi yoki yarim yo'lda to'xtab qoladi. Sabab — karetka yo'lida begona jism, moylanish yetishmasligi yoki encoder lenta (shaffof plyonka) kirlangan bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, karetka yo'lini (chap-o'ngga harakat qiladigan yo'lak) qog'oz bo'lagi yoki chang uchun tekshiring\n2️⃣ Karetka ortidagi ingichka shaffof plastik lentani (encoder strip) yumshoq, quruq mato bilan ehtiyotkorlik bilan artib tozalang — bu qism harakatni boshqaradi va tez-tez kirlanadi\n3️⃣ Karetka reyka (chiziqli tayanch)ni juda oz miqdorda maxsus moy bilan yog'lang, ortiqcha moy quymang\n4️⃣ Printerni qayta yoqib, karetka avtomatik \"parking\" holatiga qaytishini kuzating\n5️⃣ Harakat davom etmasa, karetka motori yoki uning kabel ulanishi nosoz bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — КАРЕТКА СКРИПИТ / НЕ ДВИГАЕТСЯ*\n\n🔍 *Подробное описание:*\nПри включении каретка (узел с печатающей головкой) не сдвигается с места, скрипит или останавливается на полпути. Причина — посторонний предмет на пути каретки, недостаток смазки или загрязнение энкодерной ленты (прозрачной плёнки).\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и проверьте путь каретки на наличие бумаги или пыли\n2️⃣ Аккуратно протрите тонкую прозрачную энкодерную ленту за кареткой сухой мягкой тканью — эта деталь управляет движением и часто загрязняется\n3️⃣ Слегка смажьте направляющую рейку каретки специальным маслом, не переборщите\n4️⃣ Включите принтер и понаблюдайте, вернётся ли каретка в парковочное положение\n5️⃣ Если движения нет — неисправен мотор каретки или его кабель, требуется диагностика у мастера"}, {"label_uz": "🖨️ Canon: Chop etish juda sekin", "label_ru": "🖨️ Canon: Печать очень медленная", "text_uz": "🖨️ *CANON (RANGLI) — CHOP ETISH JUDA SEKIN*\n\n🔍 *Keng tavsif:*\nPrinter ishlaydi, lekin bir sahifani chop etish uchun odatdagidan ancha ko'p vaqt ketadi. Sabab — sifat sozlamasi juda yuqori qo'yilgani, drayver/spooler muammosi yoki katta hajmli/rasmli fayllar bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Print sozlamalarida sifatni \"Standard\" yoki \"Draft\" rejimiga tushiring (yuqori sifat sekinroq ishlaydi)\n2️⃣ Windows'da Print Spooler xizmatini qayta ishga tushiring (Services → Print Spooler → Restart)\n3️⃣ Drayverni eng so'nggi versiyaga yangilang, eski/mos kelmaydigan drayverlar sekinlashtiradi\n4️⃣ Wi-Fi orqali ulangan bo'lsa, USB kabelga o'tkazib sinab ko'ring — tarmoq tezligi sekinlikka sabab bo'lishi mumkin\n5️⃣ Katta rasmli fayllarni chop etishdan oldin siqing (compress) yoki rezolyutsiyasini kamaytiring\n6️⃣ Muammo davom etsa, kompyuterda fon dasturlari (antivirus, boshqa print vazifalari) tekshiring — ular resursni band qilishi mumkin", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — ПЕЧАТЬ ОЧЕНЬ МЕДЛЕННАЯ*\n\n🔍 *Подробное описание:*\nПринтер работает, но печать одной страницы занимает намного больше времени, чем обычно. Причина — выставлено слишком высокое качество печати, проблема драйвера/спулера или большие по объёму/графике файлы.\n\n✅ *Подробное решение:*\n1️⃣ В настройках печати снизьте качество до \"Standard\" или \"Draft\" (высокое качество печатает медленнее)\n2️⃣ Перезапустите службу Print Spooler в Windows (Службы → Диспетчер печати → Перезапуск)\n3️⃣ Обновите драйвер до последней версии — устаревшие драйверы замедляют печать\n4️⃣ Если подключено через Wi-Fi, попробуйте USB-кабель — скорость сети может быть причиной\n5️⃣ Сжимайте большие изображения перед печатью или снижайте их разрешение\n6️⃣ Если не помогает — проверьте фоновые программы на компьютере (антивирус, другие задания печати), они могут занимать ресурсы"}, {"label_uz": "🖨️ Canon: Skaner/nusxa olish ishlamayapti (MFU)", "label_ru": "🖨️ Canon: Сканер/копир не работает (МФУ)", "text_uz": "🖨️ *CANON (RANGLI) — SKANER/NUSXA OLISH ISHLAMAYAPTI (MFU)*\n\n🔍 *Keng tavsif:*\nKo'p funksiyali (MFU) Canon printerda chop etish ishlaydi, lekin skanerlash yoki nusxa olish funksiyasi ishlamaydi — xato beradi yoki dastur printerni \"ko'rmaydi\". Sabab — skaner drayveri o'rnatilmagan, USB/tarmoq ulanishi yoki skaner oynasi ostidagi mexanizm muammosi bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Canon IJ Scan Utility yoki mos dasturni kompyuterga o'rnating/yangilang\n2️⃣ Skaner oynasi (shisha)ni yumshoq, quruq mato bilan artib, chang yoki dog' yo'qligini tekshiring\n3️⃣ Printerni qayta ishga tushiring, kompyuterda USB portni almashtirib ko'ring\n4️⃣ Windows'dagi \"Devices and Printers\" bo'limida printer skaneri to'g'ri ko'rsatilganini tekshiring\n5️⃣ Tarmoq orqali ulangan bo'lsa, printer va kompyuter bir xil Wi-Fi tarmog'ida ekanini tasdiqlang\n6️⃣ Davom etsa, skaner mexanizmi (motor yoki kabel) nosoz bo'lishi mumkin — ustaxonada tekshirtiring", "text_ru": "🖨️ *CANON (ЦВЕТНОЙ) — СКАНЕР/КОПИР НЕ РАБОТАЕТ (МФУ)*\n\n🔍 *Подробное описание:*\nНа многофункциональном принтере Canon печать работает, но сканирование или копирование не функционирует — выдаёт ошибку или программа \"не видит\" принтер. Причина — не установлен драйвер сканера, проблема с USB/сетевым подключением или механизмом под стеклом сканера.\n\n✅ *Подробное решение:*\n1️⃣ Установите или обновите Canon IJ Scan Utility или соответствующую программу\n2️⃣ Протрите стекло сканера мягкой сухой тканью, проверьте отсутствие пыли или пятен\n3️⃣ Перезапустите принтер, попробуйте другой USB-порт на компьютере\n4️⃣ В разделе \"Устройства и принтеры\" Windows проверьте, отображается ли сканер принтера\n5️⃣ При сетевом подключении убедитесь, что принтер и компьютер в одной Wi-Fi сети\n6️⃣ Если не помогает — возможна неисправность механизма сканера (мотор или кабель), нужна диагностика у мастера"}]}, {"name": "🖨️ HP (rangli)", "items": [{"label_uz": "🖨️ HP: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ HP: Выходит пустой лист", "text_uz": "🖨️ *HP (RANGLI) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nHP printer qog'ozni chop etadi, lekin varaq bo'sh chiqadi. Ko'pincha sabab — kartrijdan himoya lentasi olinmagani, nozzle tiqilib qolgani yoki siyoh darajasi past bo'lishi.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, uning pastki qismidagi rangli plyonka/lenta olib tashlanganini tekshiring (yangi kartrijlarda ko'pincha shu unutiladi)\n2️⃣ HP Printer Assistant yoki printer paneli orqali \"Print Head Cleaning\" funksiyasini ishga tushiring\n3️⃣ Diagnostika sahifasini (Print Quality Diagnostic Page) chop etib, qaysi rang chiqmayotganini ko'ring\n4️⃣ Kartrij kontaktlarini quruq mato bilan artib qaytadan o'rnating\n5️⃣ Siyoh darajasi juda past bo'lsa — kartrijni almashtiring, HP kartrijlari past darajada sifatni pasaytiradi\n6️⃣ Bir necha marta tozalashdan keyin ham natija bo'lmasa — bosh butunlay tiqilgan, ustaga olib boring", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер HP печатает, но лист выходит пустым. Чаще всего причина — не снята защитная плёнка с картриджа, засорены дюзы или низкий уровень чернил.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и проверьте, снята ли цветная защитная лента снизу (частая забывчивость с новыми картриджами)\n2️⃣ Через HP Printer Assistant или панель принтера запустите \"Print Head Cleaning\"\n3️⃣ Распечатайте диагностическую страницу качества печати — узнайте, какой цвет не выходит\n4️⃣ Протрите контакты картриджа сухой тканью и установите обратно\n5️⃣ При низком уровне чернил замените картридж — на HP качество падает при малом остатке\n6️⃣ Если несколько чисток не помогли — головка полностью забита, обратитесь к мастеру"}, {"label_uz": "🖨️ HP: Ranglar xira, chiziq bor", "label_ru": "🖨️ HP: Цвета блёклые, есть полосы", "text_uz": "🖨️ *HP (RANGLI) — RANGLAR XIRA, CHIZIQ BOR*\n\n🔍 *Keng tavsif:*\nChop etilgan hujjatda gorizontal oq chiziqlar yoki xira ranglar ko'rinadi. Sabab — nozzle qisman tiqilgani, print sifat sozlamasi past qo'yilgani yoki qog'oz turi noto'g'ri tanlangani.\n\n✅ *Batafsil yechim:*\n1️⃣ HP Printer Assistant orqali \"Align Printhead\" (bosh moslashtirish) ni bajaring\n2️⃣ Print sozlamalarida sifatni \"Normal\" yoki \"Best\" ga o'zgartiring\n3️⃣ Head Cleaning'ni 2 marta ketma-ket, orasida 15 daqiqa tanaffus bilan bajaring\n4️⃣ Qaysi rang zaif ekanini nozzle test orqali aniqlab, o'sha kartrijni tekshiring/almashtiring\n5️⃣ Original bo'lmagan siyoh/kartrij ishlatilsa, tez-tez nozzle tiqiladi — sifatli mahsulotga o'ting\n6️⃣ Muammo qolsa, print bosh moduli (agar kartrijga integratsiyalanmagan bo'lsa) almashtirilishi kerak — ustaxonaga murojaat qiling", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — БЛЁКЛЫЕ ЦВЕТА, ЕСТЬ ПОЛОСЫ*\n\n🔍 *Подробное описание:*\nНа отпечатке видны горизонтальные белые полосы или блёклые цвета. Причина — частичное засорение дюз, низкое качество печати в настройках или неверный тип бумаги.\n\n✅ *Подробное решение:*\n1️⃣ Через HP Printer Assistant выполните \"Align Printhead\" (выравнивание головки)\n2️⃣ В настройках печати установите качество \"Обычное\" или \"Наилучшее\"\n3️⃣ Выполните Head Cleaning дважды подряд с паузой 15 минут\n4️⃣ Определите слабый цвет через тест дюз, проверьте/замените этот картридж\n5️⃣ Неоригинальные чернила/картриджи чаще забивают дюзы — перейдите на качественные\n6️⃣ Если не помогло — возможно, требуется замена печатающего модуля (если не встроен в картридж), обратитесь к мастеру"}, {"label_uz": "🖨️ HP: \"Kartrij muammosi\" xabari", "label_ru": "🖨️ HP: Сообщение \"Проблема с картриджем\"", "text_uz": "🖨️ *HP (RANGLI) — \"KARTRIJ MUAMMOSI\" XABARI*\n\n🔍 *Keng tavsif:*\nEkranda yoki kompyuterda \"Cartridge Problem\", \"Incompatible Cartridge\" yoki \"One or more cartridges are missing\" xabari chiqadi. Sabab — noorigin kartrij, kontakt kirlangan yoki kartrij muddati (region-lock) mos kelmasligi.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib qayta o'rnating — \"klik\" ovozini eshiting\n2️⃣ Kontaktlarni spirtli salfetka bilan artib, quritib joylang\n3️⃣ Printer va kompyuterni to'liq qayta ishga tushiring (reboot)\n4️⃣ Agar kartrij boshqa mamlakatdan olib kelingan bo'lsa, HP hududiy cheklovi (region lock) sabab bo'lishi mumkin — mahalliy kartrij zarur\n5️⃣ Firmware/dastur yangilanishi kartrij tan olmaslikka olib kelgan bo'lishi mumkin — bu haqda ustaga murojaat qiling, ba'zan eski firmware'ga qaytarish kerak bo'ladi\n6️⃣ Xabar davom etsa, kartrij ushlagichi kontaktlari yoki plata nosoz — diagnostika uchun ustaxonaga olib boring", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — СООБЩЕНИЕ \"ПРОБЛЕМА С КАРТРИДЖЕМ\"*\n\n🔍 *Подробное описание:*\nНа экране или компьютере появляется \"Cartridge Problem\", \"Incompatible Cartridge\" или \"Отсутствует один или несколько картриджей\". Причина — неоригинальный картридж, загрязнены контакты или региональная блокировка.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките и заново установите картридж до щелчка\n2️⃣ Протрите контакты спиртовой салфеткой, дайте высохнуть, установите\n3️⃣ Полностью перезагрузите принтер и компьютер\n4️⃣ Если картридж привезён из другой страны — возможна региональная блокировка HP, нужен местный картридж\n5️⃣ Обновление прошивки могло перестать распознавать картридж — обратитесь к мастеру, иногда требуется откат прошивки\n6️⃣ Если сообщение не исчезает — неисправны контакты держателя или плата, нужна диагностика у мастера"}, {"label_uz": "🖨️ HP: Qog'oz qisilib qoladi (jam)", "label_ru": "🖨️ HP: Замятие бумаги", "text_uz": "🖨️ *HP (RANGLI) — QOG'OZ QISILIB QOLADI (JAM)*\n\n🔍 *Keng tavsif:*\nQog'oz chop etish jarayonida yo'lda tiqilib qoladi va \"Paper Jam\" xabari chiqadi. Sabab — rolik yeyilgani, qog'oz namligi yoki noto'g'ri joylashtirilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chiring, orqa/old qopqoqni ochib, qisilgan qog'ozni asta, yirtib qoldirmasdan torting\n2️⃣ Rolikni sal namlangan mato bilan tozalab, changdan xalos qiling\n3️⃣ Namlangan yoki bukilgan qog'ozdan foydalanmang — quruq, tekis qog'oz ishlating\n4️⃣ Lotokka ko'p qog'oz solmang, yon cheklagichlarni to'g'ri sozlang\n5️⃣ Printer ichida mayda qog'oz bo'lakchalari qolmaganini fonar bilan tekshiring\n6️⃣ Takrorlansa, tortuvchi rolik almashtirilishi kerak — bu tez va arzon ta'mir", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — ЗАМЯТИЕ БУМАГИ*\n\n🔍 *Подробное описание:*\nБумага застревает во время печати, появляется сообщение \"Paper Jam\". Причина — износ ролика, влажность бумаги или неправильная загрузка.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте заднюю/переднюю крышку и аккуратно, не разрывая, извлеките застрявшую бумагу\n2️⃣ Протрите ролик слегка влажной тканью от пыли\n3️⃣ Не используйте влажную или мятую бумагу — только сухую, ровную\n4️⃣ Не перегружайте лоток, правильно выставьте боковые направляющие\n5️⃣ Проверьте фонариком, не остались ли мелкие кусочки бумаги внутри\n6️⃣ Если повторяется — нужна замена ролика захвата, это быстрый и недорогой ремонт"}, {"label_uz": "🖨️ HP: Wi-Fi/tarmoqqa ulanmaydi", "label_ru": "🖨️ HP: Не подключается к Wi-Fi/сети", "text_uz": "🖨️ *HP (RANGLI) — WI-FI/TARMOQQA ULANMAYDI*\n\n🔍 *Keng tavsif:*\nHP Smart ilovasi yoki kompyuter printerni tarmoqda topa olmaydi. Sabab — printer noto'g'ri Wi-Fi tarmog'iga ulangan, IP manzil o'zgargan yoki router sozlamasi to'sqinlik qilmoqda.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer panelidan Wireless Setup Wizard orqali Wi-Fi tarmog'ini qaytadan sozlang\n2️⃣ 5GHz emas, 2.4GHz tarmoqqa ulaning (ko'p HP printerlar faqat shu chastotani qo'llab-quvvatlaydi)\n3️⃣ HP Smart ilovasini o'chirib-yoqing, printerni qayta qidirtiring\n4️⃣ Router va printerni qayta ishga tushiring (reboot)\n5️⃣ Kompyuter/telefon va printer bir xil tarmoqda ekanini tasdiqlang\n6️⃣ Yordam bermasa, USB orqali ulang va tarmoq sozlashni ustadan so'rang", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — НЕ ПОДКЛЮЧАЕТСЯ К WI-FI/СЕТИ*\n\n🔍 *Подробное описание:*\nПриложение HP Smart или компьютер не находят принтер в сети. Причина — принтер подключён не к той сети Wi-Fi, изменился IP-адрес или настройки роутера мешают соединению.\n\n✅ *Подробное решение:*\n1️⃣ На панели принтера через Wireless Setup Wizard заново настройте Wi-Fi\n2️⃣ Подключайтесь к сети 2.4GHz, а не 5GHz (многие HP принтеры поддерживают только эту частоту)\n3️⃣ Перезапустите приложение HP Smart и повторите поиск принтера\n4️⃣ Перезагрузите роутер и принтер\n5️⃣ Убедитесь, что компьютер/телефон и принтер в одной сети\n6️⃣ Если не помогает — подключитесь через USB и обратитесь к мастеру для настройки сети"}, {"label_uz": "🖨️ HP: Chiroq sariq/qizil milt-milt qiladi", "label_ru": "🖨️ HP: Мигает жёлтый/красный индикатор", "text_uz": "🖨️ *HP (RANGLI) — CHIROQ SARIQ/QIZIL MILT-MILT QILADI*\n\n🔍 *Keng tavsif:*\nPrinter panelida sariq (ogohlantirish) yoki qizil chiroq davriy ravishda yonib-o'chadi, printer ishlamaydi. Bu umumiy xato signali bo'lib, sabab kartrij, qog'oz yoki qopqoq holatiga bog'liq bo'lishi mumkin.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer ekranidagi xato matnini yoki milt-milt sonini (blink count) o'qing — HP saytida shu kod bo'yicha qidirish mumkin\n2️⃣ Barcha qopqoqlar (kartrij, orqa) to'liq yopilganini tekshiring\n3️⃣ Kartrijlar to'g'ri o'rnatilganini va himoya lentasi olib tashlanganini tekshiring\n4️⃣ Qog'oz lotogida qog'oz borligiga va tiqilib qolmaganiga ishonch hosil qiling\n5️⃣ Printerni to'liq o'chirib, elektr shnurini 2 daqiqaga chiqarib, qayta ulang (hard reset)\n6️⃣ Yordam bermasa — bu ichki mexanizm yoki plata xatosi, ustaxonada diagnostika kerak", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — МИГАЕТ ЖЁЛТЫЙ/КРАСНЫЙ ИНДИКАТОР*\n\n🔍 *Подробное описание:*\nНа панели принтера периодически мигает жёлтый (предупреждение) или красный индикатор, принтер не работает. Это общий сигнал ошибки, причина может быть в картридже, бумаге или крышке.\n\n✅ *Подробное решение:*\n1️⃣ Прочитайте текст ошибки на экране или посчитайте количество миганий — код можно найти на сайте HP\n2️⃣ Проверьте, что все крышки (картриджного отсека, задняя) полностью закрыты\n3️⃣ Убедитесь, что картриджи установлены правильно и снята защитная лента\n4️⃣ Проверьте наличие бумаги в лотке и отсутствие замятия\n5️⃣ Полностью выключите принтер, выньте шнур на 2 минуты и включите снова (hard reset)\n6️⃣ Если не помогает — это ошибка механизма или платы, нужна диагностика у мастера"}, {"label_uz": "🖨️ HP: \"Cartridge is not from HP\" / mos emas xatosi", "label_ru": "🖨️ HP: \"Cartridge is not from HP\" / ошибка несовместимости", "text_uz": "🖨️ *HP (RANGLI) — \"CARTRIDGE IS NOT FROM HP\" / MOS EMAS XATOSI*\n\n🔍 *Keng tavsif:*\nPrinter ekranida \"The cartridge is not genuine HP\" yoki \"Used/Refilled cartridge detected\" degan xabar chiqadi. HP printerlar original bo'lmagan yoki qayta to'ldirilgan kartrijlarni chip orqali aniqlab, ogohlantiradi yoki bloklaydi.\n\n✅ *Batafsil yechim:*\n1️⃣ Xabar shunchaki ogohlantirish bo'lsa, \"Continue\"/\"OK\" tugmasini bosib davom eting — printer baribir ishlashi mumkin\n2️⃣ Agar chop etish butunlay bloklangan bo'lsa, HP printer sozlamalaridan \"Cartridge Protection\" funksiyasini o'chirib ko'ring (barcha modellarda mavjud emas)\n3️⃣ Kartrij kontaktlarini toza, quruq mato bilan artib qaytadan o'rnating\n4️⃣ HP dinamik xavfsizlik (Dynamic Security) tizimi ba'zi modellarda faqat original HP kartrijlarga ruxsat beradi — bunda faqat original kartrij yechim\n5️⃣ Printer/drayverni eng so'nggi firmware versiyasiga yangilang, ba'zida bu xabarni to'g'rilaydi", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — \"CARTRIDGE IS NOT FROM HP\" / ОШИБКА НЕСОВМЕСТИМОСТИ*\n\n🔍 *Подробное описание:*\nНа экране принтера появляется сообщение \"The cartridge is not genuine HP\" или \"Used/Refilled cartridge detected\". Принтеры HP определяют неоригинальные или перезаправленные картриджи через чип и предупреждают или блокируют печать.\n\n✅ *Подробное решение:*\n1️⃣ Если это просто предупреждение, нажмите \"Continue\"/\"OK\" — принтер может продолжить работу\n2️⃣ Если печать полностью заблокирована, попробуйте отключить функцию \"Cartridge Protection\" в настройках (есть не на всех моделях)\n3️⃣ Протрите контакты картриджа чистой сухой тканью и установите заново\n4️⃣ Система HP Dynamic Security на некоторых моделях разрешает только оригинальные картриджи HP — в этом случае решение только оригинал\n5️⃣ Обновите прошивку принтера/драйвер до последней версии — иногда это устраняет сообщение"}, {"label_uz": "🖨️ HP: Print navbatida qotib qoladi (spooler)", "label_ru": "🖨️ HP: Печать зависает в очереди (спулер)", "text_uz": "🖨️ *HP (RANGLI) — PRINT NAVBATIDA QOTIB QOLADI (SPOOLER)*\n\n🔍 *Keng tavsif:*\nChop etish buyrug'i yuborilganda hujjat navbatda \"Pending\" yoki \"Error\" holatida qotib qoladi, printer hech narsa chop etmaydi. Sabab — Windows Print Spooler xizmati osilib qolgani yoki eskirgan/buzilgan navbat fayli.\n\n✅ *Batafsil yechim:*\n1️⃣ Windows'da Services (Xizmatlar) oching, \"Print Spooler\" xizmatini toping va \"Stop\" qiling\n2️⃣ `C:\\Windows\\System32\\spool\\PRINTERS` papkasidagi barcha fayllarni o'chiring\n3️⃣ Print Spooler xizmatini qaytadan \"Start\" qiling\n4️⃣ Printerni \"Devices and Printers\" bo'limida o'chirib, qayta qo'shing\n5️⃣ Drayverni to'liq o'chirib, HP saytidan eng so'nggi versiyasini o'rnating\n6️⃣ Muammo takrorlansa, boshqa kompyuter/telefon orqali chop etib ko'ring — agar u yerda ishласа, muammo kompyuter tizimida", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — ПЕЧАТЬ ЗАВИСАЕТ В ОЧЕРЕДИ (СПУЛЕР)*\n\n🔍 *Подробное описание:*\nПри отправке документа на печать он зависает в очереди в статусе \"Pending\" или \"Error\", принтер ничего не печатает. Причина — служба Print Spooler зависла или повреждён/устарел файл очереди.\n\n✅ *Подробное решение:*\n1️⃣ Откройте Службы Windows, найдите \"Диспетчер печати\" (Print Spooler) и остановите её\n2️⃣ Удалите все файлы в папке `C:\\Windows\\System32\\spool\\PRINTERS`\n3️⃣ Запустите службу Print Spooler заново\n4️⃣ Удалите принтер в разделе \"Устройства и принтеры\" и добавьте заново\n5️⃣ Полностью удалите драйвер и установите последнюю версию с сайта HP\n6️⃣ Если проблема повторяется, попробуйте напечатать с другого компьютера/телефона — если там работает, проблема в системе компьютера"}, {"label_uz": "🖨️ HP: Ikki tomonlama (duplex) chop etishda xato", "label_ru": "🖨️ HP: Ошибка двусторонней печати (duplex)", "text_uz": "🖨️ *HP (RANGLI) — IKKI TOMONLAMA (DUPLEX) CHOP ETISHDA XATO*\n\n🔍 *Keng tavsif:*\nIkki tomonlama chop etish (duplex) tanlanganda printer qog'ozni noto'g'ri aylantiradi, ikkinchi tomon bo'sh chiqadi yoki qog'oz duplex modulida qisilib qoladi. Sabab — duplex modul to'liq o'rnatilmagan, qog'oz turi mos emas yoki drayver sozlamasi noto'g'ri.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer orqasidagi duplex modul (agar ajratiladigan bo'lsa) to'liq va tekis o'rnatilganini tekshiring\n2️⃣ Drayver sozlamalarida \"Print on Both Sides\" (Duplex) yoqilganini tasdiqlang\n3️⃣ Faqat duplex uchun mos qog'oz qalinligini (odatda 60-90 g/m²) ishlating — juda yupqa yoki qalin qog'oz qisilib qoladi\n4️⃣ Duplex modulni chiqarib, ichidagi rolikларни changdan tozalang\n5️⃣ Muammo davom etsa, duplex modul mexanik jihatdan nosoz — ustaxonada tekshirtiring yoki modulni almashtiring", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — ОШИБКА ДВУСТОРОННЕЙ ПЕЧАТИ (DUPLEX)*\n\n🔍 *Подробное описание:*\nПри выборе двусторонней печати (duplex) принтер неправильно переворачивает бумагу, вторая сторона выходит пустой, либо бумага застревает в модуле duplex. Причина — модуль duplex установлен не до конца, неподходящий тип бумаги или неверная настройка драйвера.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте, что модуль duplex (если он съёмный) установлен полностью и ровно\n2️⃣ В настройках драйвера подтвердите, что включена опция \"Print on Both Sides\" (Duplex)\n3️⃣ Используйте бумагу подходящей плотности (обычно 60-90 г/м²) — слишком тонкая или плотная застревает\n4️⃣ Извлеките модуль duplex и очистите его ролики от пыли\n5️⃣ Если проблема остаётся — модуль duplex механически неисправен, требуется диагностика или замена у мастера"}, {"label_uz": "🖨️ HP: Skaner/nusxa olish ishlamayapti", "label_ru": "🖨️ HP: Сканер/копир не работает", "text_uz": "🖨️ *HP (RANGLI) — SKANER/NUSXA OLISH ISHLAMAYAPTI*\n\n🔍 *Keng tavsif:*\nHP ko'p funksiyali printerda chop etish normal ishlaydi, lekin skanerlash yoki nusxa olish funksiyasi xato beradi yoki umuman ishga tushmaydi. Sabab — HP Scan dasturi o'rnatilmagan/eskirgan, USB/tarmoq ulanish muammosi yoki skaner shishasi ostidagi mexanizm nosozligi.\n\n✅ *Batafsil yechim:*\n1️⃣ HP Smart yoki HP Scan dasturini kompyuter/telefonga o'rnating yoki yangilang\n2️⃣ Skaner shishasini yumshoq, quruq mato bilan artib, dog'/chang yo'qligini tekshiring\n3️⃣ Printerni qayta ishga tushiring va USB kabelni boshqa portga ulab ko'ring\n4️⃣ Tarmoq orqali ulangan bo'lsa, printer va qurilma bir xil Wi-Fi tarmog'ida ekanini tasdiqlang\n5️⃣ Windows/Mac'da skaner drayverini alohida qayta o'rnating\n6️⃣ Davom etsa, skaner moduli (motor yoki shisha ostidagi sensor) nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *HP (ЦВЕТНОЙ) — СКАНЕР/КОПИР НЕ РАБОТАЕТ*\n\n🔍 *Подробное описание:*\nНа МФУ HP печать работает нормально, но сканирование или копирование выдаёт ошибку или вообще не запускается. Причина — не установлена/устарела программа HP Scan, проблема USB/сетевого подключения или неисправность механизма под стеклом сканера.\n\n✅ *Подробное решение:*\n1️⃣ Установите или обновите HP Smart или HP Scan на компьютере/телефоне\n2️⃣ Протрите стекло сканера мягкой сухой тканью, проверьте отсутствие пятен/пыли\n3️⃣ Перезапустите принтер и подключите USB-кабель к другому порту\n4️⃣ При сетевом подключении убедитесь, что принтер и устройство в одной Wi-Fi сети\n5️⃣ Переустановите отдельно драйвер сканера в Windows/Mac\n6️⃣ Если не помогает — неисправен модуль сканера (мотор или датчик под стеклом), нужна диагностика у мастера"}]}, {"name": "🖨️ Epson (rangli)", "items": [{"label_uz": "🖨️ Epson: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Epson: Выходит пустой лист", "text_uz": "🖨️ *EPSON (RANGLI) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nEpson printerlarda (ko'pincha CISS/tank tizimli modellarda) bo'sh varaq chiqishi — nozzle tiqilgani yoki tank/idishlarda siyoh yo'lida havo hosil bo'lganini bildiradi.\n\n✅ *Batafsil yechim:*\n1️⃣ Epson Status Monitor yoki printer paneli orqali \"Head Cleaning\" ni ishga tushiring\n2️⃣ Nozzle Check sahifasini chop etib, qaysi rang chiqmayotganini aniqlang\n3️⃣ Agar CISS/tank tizimida siyoh oz bo'lsa, quyib to'ldiring va naylarda havo qolmaganiga ishonch hosil qiling\n4️⃣ Naylarni ehtiyotkorlik bilan yengil siqib, havo pufakchalarini siyoh tomon surib chiqaring\n5️⃣ Deep/Power Cleaning funksiyasini bajaring (bu ko'proq siyoh sarflaydi, lekin kuchliroq tozalaydi)\n6️⃣ Yordam bermasa — bosh butunlay tiqilgan, ustaxonada maxsus suyuqlik bilan tozalash yoki bosh almashtirish kerak", "text_ru": "🖨️ *EPSON (ЦВЕТНОЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nУ принтеров Epson (часто с СНПЧ/баками) пустой лист означает засорение дюз или попадание воздуха в путь подачи чернил из баков.\n\n✅ *Подробное решение:*\n1️⃣ Че
