<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cynet Diagnostika</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CYNET DIAGNOSTIKA — dizayn tokenlari
   Mavzu: ustaxona/diagnostika paneli. Ikki aksent: amber (issiqlik/
   ogohlantirish) va cyan (raqamli o'lchov/diagnostika ekrani).
   Signature element: "sxema iz" (circuit-trace) — yechim qadamlari
   elektron sxema izlari kabi ketma-ket chiziladi.
============================================================ */
:root{
  --bg:            #0E1116;
  --bg-panel:      #171B21;
  --bg-panel-2:    #1D232B;
  --bg-panel-hover:#232A33;
  --border:        #262D37;
  --border-soft:   #1E252D;

  --amber:         #FF9142;
  --amber-dim:     #7A4B26;
  --amber-glow:    rgba(255,145,66,.35);

  --cyan:          #4FD8C9;
  --cyan-dim:      #245C55;
  --cyan-glow:     rgba(79,216,201,.30);

  --red:           #FF6259;
  --red-dim:       #5A2B28;
  --green:         #6FCF97;

  --text-1:        #F1F3F6;
  --text-2:        #9AA3B2;
  --text-3:        #616B7A;

  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 20px;

  --font-display: 'Space Grotesk', sans-serif;
  --font-body:    'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(79,216,201,0.06), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(255,145,66,0.05), transparent 55%),
    var(--bg);
  color:var(--text-1);
  font-family:var(--font-body);
  overflow-x:hidden;
  min-height:100%;
}
/* faint circuit-grid backdrop */
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
}

button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
::selection{ background:var(--amber-glow); }

#app{ position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; }

/* ---------------- TOP BAR ---------------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding: calc(14px + var(--safe-top)) 16px 12px;
  background: linear-gradient(180deg, rgba(14,17,22,0.97), rgba(14,17,22,0.85) 70%, transparent);
  backdrop-filter: blur(10px);
  display:flex; align-items:center; gap:10px;
}
.topbar .back-btn{
  width:34px; height:34px; border-radius:10px;
  background:var(--bg-panel); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-2); font-size:16px; flex-shrink:0;
  transition:.15s;
  visibility:hidden; opacity:0; transform:translateX(-4px);
}
.topbar .back-btn.show{ visibility:visible; opacity:1; transform:none; }
.topbar .back-btn:active{ background:var(--bg-panel-hover); }

.brand{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.brand .dot{
  width:8px; height:8px; border-radius:50%; background:var(--green);
  box-shadow:0 0 0 3px rgba(111,207,151,.15);
  animation: pulse-dot 2.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse-dot{ 0%,100%{opacity:1} 50%{opacity:.4} }
.brand-text{ display:flex; flex-direction:column; min-width:0; }
.brand-text b{
  font-family:var(--font-display); font-size:14.5px; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-text span{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-3); letter-spacing:.12em; text-transform:uppercase; }

.lang-toggle{
  display:flex; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:2px; flex-shrink:0;
}
.lang-toggle button{
  font-family:var(--font-mono); font-size:11px; font-weight:600; padding:6px 9px; border-radius:8px; color:var(--text-3); letter-spacing:.05em;
  transition:.15s;
}
.lang-toggle button.active{ background:var(--bg-panel-2); color:var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan-dim); }

/* ---------------- BREADCRUMB RAIL ---------------- */
.crumbrail{
  padding: 0 16px 10px; display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-3);
  letter-spacing:.03em; overflow-x:auto; scrollbar-width:none; white-space:nowrap;
}
.crumbrail::-webkit-scrollbar{ display:none; }
.crumbrail .seg{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
.crumbrail .seg b{ color:var(--text-2); font-weight:600; }
.crumbrail .sep{ color:var(--border); }

/* ---------------- MAIN VIEW CONTAINER ---------------- */
main{ flex:1; padding: 4px 16px calc(28px + var(--safe-bottom)); }

.view{ animation: view-in .28s cubic-bezier(.2,.7,.3,1); }
@keyframes view-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

/* ---------------- HOME HERO ---------------- */
.hero{ padding: 6px 2px 20px; }
.hero h1{
  font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1.15;
  letter-spacing:-.01em;
}
.hero h1 em{ font-style:normal; color:var(--amber); }
.hero p{ margin-top:8px; color:var(--text-2); font-size:13.5px; line-height:1.5; max-width:34ch; }

.scope-line{
  margin-top:16px; height:34px; border-radius:8px; overflow:hidden;
  background:var(--bg-panel); border:1px solid var(--border);
  position:relative;
}
.scope-line svg{ display:block; width:100%; height:100%; }
.scope-line .trace{
  fill:none; stroke:var(--cyan); stroke-width:1.6; opacity:.85;
  stroke-dasharray: 600; stroke-dashoffset:600;
  animation: draw-trace 2.6s ease-out forwards infinite;
}
@keyframes draw-trace{ to{ stroke-dashoffset:0; } }

/* ---------------- CATEGORY GRID ---------------- */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cat-card{
  position:relative; text-align:left;
  background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-m);
  padding:14px 12px 12px; overflow:hidden;
  transition:.18s ease;
}
.cat-card:active{ transform:scale(.97); background:var(--bg-panel-hover); }
.cat-card .corner{
  position:absolute; top:9px; right:10px; width:6px; height:6px; border-radius:50%;
  background:var(--border); transition:.2s;
}
.cat-card:active .corner{ background:var(--cyan); box-shadow:0 0 8px var(--cyan-glow); }
.cat-card .icn{ font-size:24px; display:block; margin-bottom:10px; }
.cat-card .nm{ font-family:var(--font-display); font-weight:600; font-size:13.5px; line-height:1.25; }
.cat-card .ct{
  margin-top:6px; font-family:var(--font-mono); font-size:9.5px; color:var(--text-3); letter-spacing:.04em;
}

/* ---------------- MAIN MENU GRID (home) ---------------- */
.menu-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:2px;
}
.menu-card{
  position:relative; text-align:left; display:flex; flex-direction:column; gap:10px;
  min-height:132px; background:var(--bg-panel); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:15px 13px 13px; overflow:hidden;
  transition:.18s ease;
}
.menu-card::before{
  content:""; position:absolute; inset:0; opacity:0; transition:.2s;
  background:linear-gradient(160deg, rgba(79,216,201,.07), transparent 55%);
  pointer-events:none;
}
.menu-card:active{ transform:scale(.97); background:var(--bg-panel-hover); }
.menu-card:active::before{ opacity:1; }
.menu-card.accent{
  border-color:var(--amber-dim);
  background:linear-gradient(160deg, rgba(255,145,66,.07), transparent 55%), var(--bg-panel);
}
.menu-card.accent::before{ background:linear-gradient(160deg, rgba(255,145,66,.1), transparent 55%); }
.menu-card .corner{
  position:absolute; top:10px; right:11px; width:6px; height:6px; border-radius:50%;
  background:var(--border); transition:.2s;
}
.menu-card:active .corner{ background:var(--cyan); box-shadow:0 0 8px var(--cyan-glow); }
.menu-card.accent .corner{ background:var(--amber-dim); }
.menu-card.accent:active .corner{ background:var(--amber); box-shadow:0 0 8px var(--amber-glow); }
.menu-card .mc-icn{
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:19px;
  background:var(--bg-panel-2); border:1px solid var(--border-soft);
}
.menu-card.accent .mc-icn{
  background:linear-gradient(135deg, rgba(255,145,66,.18), rgba(255,145,66,.05));
  border-color:var(--amber-dim);
}
.menu-card .mc-body{ display:flex; flex-direction:column; gap:5px; flex:1; }
.menu-card .mc-title{
  font-family:var(--font-display); font-weight:600; font-size:14px; line-height:1.28;
  color:var(--text-1);
}
.menu-card .mc-sub{
  font-family:var(--font-body); font-size:11.5px; line-height:1.4; color:var(--text-2);
}
.menu-card .mc-chev{
  align-self:flex-end; color:var(--text-3); font-size:14px; transition:.15s;
}
.menu-card.accent .mc-chev{ color:var(--amber); }
.menu-card:not(.accent) .mc-chev{ color:var(--cyan); }

/* ---------------- LIST (issues / brands) ---------------- */
.list{ display:flex; flex-direction:column; gap:8px; }
.list-title{
  font-family:var(--font-display); font-weight:600; font-size:18px; margin: 4px 0 14px;
  display:flex; align-items:center; gap:9px;
}
.list-title .tag{
  font-family:var(--font-mono); font-size:9.5px; color:var(--cyan); border:1px solid var(--cyan-dim);
  padding:3px 7px; border-radius:6px; letter-spacing:.06em;
}
.row{
  display:flex; align-items:center; gap:12px;
  background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-s);
  padding:13px 12px; text-align:left; transition:.15s;
}
.row:active{ background:var(--bg-panel-hover); border-color:var(--cyan-dim); }
.row .idx{
  font-family:var(--font-mono); font-size:10px; color:var(--text-3); width:20px; flex-shrink:0;
}
.row .lbl{ flex:1; font-size:13.5px; line-height:1.4; color:var(--text-1); }
.row .chev{ color:var(--text-3); font-size:13px; flex-shrink:0; }
.row.brand-row .lbl{ font-family:var(--font-mono); font-weight:600; letter-spacing:.02em; font-size:12.5px; }

/* ---------------- DETAIL VIEW ---------------- */
.detail-head{ padding: 6px 0 18px; }
.detail-head .eyebrow{
  font-family:var(--font-mono); font-size:10px; color:var(--amber); letter-spacing:.1em; text-transform:uppercase;
  display:flex; align-items:center; gap:7px; margin-bottom:10px;
}
.detail-head .eyebrow .ping{
  width:6px; height:6px; border-radius:50%; background:var(--amber);
  box-shadow:0 0 0 3px var(--amber-glow); animation: pulse-dot 1.6s ease-in-out infinite;
}
.detail-head h2{ font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.28; }

.panel{
  border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 14px 15px; margin-bottom:14px;
  background:var(--bg-panel);
}
.panel.dashed{
  border-style:dashed; border-color:var(--border);
  background:linear-gradient(180deg, rgba(79,216,201,.045), transparent 40%), var(--bg-panel);
}
.panel .ph{
  display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px;
  color:var(--cyan); letter-spacing:.08em; text-transform:uppercase; margin-bottom:9px;
}
.panel .ph.warn{ color:var(--amber); }
.panel p{ font-size:13.5px; line-height:1.65; color:var(--text-2); }
.panel p strong{ color:var(--text-1); font-weight:600; }

/* --- circuit-trace stepper (signature element) --- */
.trace-steps{ position:relative; padding-left:30px; }
.trace-steps::before{
  content:""; position:absolute; left:11px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(180deg, var(--cyan-dim), var(--border) 90%);
}
.tstep{
  position:relative; padding-bottom:18px; opacity:0; transform:translateX(-6px);
  animation: step-in .45s ease forwards;
}
.tstep:last-child{ padding-bottom:0; }
.tstep .node{
  position:absolute; left:-30px; top:0; width:24px; height:24px; border-radius:7px;
  background:var(--bg-panel-2); border:1px solid var(--cyan-dim);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--cyan);
  box-shadow:0 0 0 4px var(--bg-panel);
}
.tstep p{ font-size:13.5px; line-height:1.6; color:var(--text-1); padding-top:2px; }
@keyframes step-in{ to{ opacity:1; transform:none; } }

/* bullet / code list (kond & xolod error codes, generic bullets) */
.code-list{ display:flex; flex-direction:column; gap:10px; }
.code-item{
  display:flex; gap:10px; align-items:flex-start;
  padding:10px 11px; border-radius:9px; background:var(--bg-panel-2); border:1px solid var(--border-soft);
}
.code-item .chip{
  font-family:var(--font-mono); font-size:10px; color:var(--bg); background:var(--cyan);
  padding:3px 6px; border-radius:5px; flex-shrink:0; margin-top:1px; font-weight:700;
}
.code-item p{ font-size:13px; line-height:1.55; color:var(--text-2); }
.code-item p strong{ color:var(--text-1); }

/* subsection (🔸 title + → bullets), used by vent/stab/ups */
.subsection{ margin-bottom:16px; }
.subsection:last-child{ margin-bottom:0; }
.subsection h4{
  font-family:var(--font-body); font-weight:700; font-size:13.5px; color:var(--amber); margin-bottom:8px;
  display:flex; align-items:center; gap:7px;
}
.subsection h4::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--amber); flex-shrink:0; }
.arrow-item{
  display:flex; gap:8px; font-size:13px; color:var(--text-2); line-height:1.55; padding:5px 0 5px 2px;
}
.arrow-item .ar{ color:var(--cyan); flex-shrink:0; }

/* generic paragraph fallback */
.ptext{ font-size:13.5px; line-height:1.65; color:var(--text-2); }

/* footer note under detail */
.note{
  margin-top:2px; font-size:11.5px; color:var(--text-3); line-height:1.6; font-style:italic;
}

/* ---------------- BOTTOM ACTION BAR ---------------- */
.action-bar{
  position:sticky; bottom:0; z-index:15; padding: 10px 16px calc(12px + var(--safe-bottom));
  background:linear-gradient(0deg, rgba(14,17,22,.98), rgba(14,17,22,.85) 70%, transparent);
  backdrop-filter:blur(10px);
  display:flex; gap:9px;
}
.action-bar button{
  flex:1; padding:13px; border-radius:11px; font-family:var(--font-display); font-weight:600; font-size:13px;
  display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s;
}
.btn-ghost{ background:var(--bg-panel); border:1px solid var(--border); color:var(--text-2); }
.btn-ghost:active{ background:var(--bg-panel-hover); }
.btn-primary{ background:linear-gradient(135deg, var(--amber), #E67635); color:#191008; }
.btn-primary:active{ transform:scale(.98); }

/* ---------------- SEARCH ---------------- */
.search-wrap{ position:relative; margin-bottom:16px; }
.search-wrap input{
  width:100%; background:var(--bg-panel); border:1px solid var(--border); border-radius:11px;
  padding:12px 14px 12px 38px; color:var(--text-1); font-size:13.5px; font-family:var(--font-body);
}
.search-wrap input::placeholder{ color:var(--text-3); }
.search-wrap .sic{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:14px; }

.empty{
  text-align:center; padding:40px 20px; color:var(--text-3); font-size:13px;
}

/* ---------------- LOCATION BUTTON ---------------- */
.loc-btn{
  width:100%; margin-bottom:14px; padding:13px; border-radius:12px;
  background:var(--bg-panel); border:1px dashed var(--border);
  color:var(--cyan); font-family:var(--font-body); font-weight:600; font-size:13px;
  text-align:center; transition:.15s;
}
.loc-btn:active{ background:var(--bg-panel-hover); }
.loc-btn.got{ border-style:solid; border-color:var(--cyan-dim); color:var(--text-1); background:linear-gradient(180deg, rgba(79,216,201,.08), transparent); }

/* ---------------- STATUS BADGE ---------------- */
.status-badge{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px; color:var(--cyan);
  border:1px solid var(--cyan-dim); background:rgba(79,216,201,.07);
  padding:6px 11px; border-radius:9px; letter-spacing:.03em;
}

/* ---------------- MASTER CARDS (Ustaxona topish) ---------------- */
.master-list{ display:flex; flex-direction:column; gap:10px; }
.master-card{
  position:relative; background:var(--bg-panel); border:1px solid var(--border);
  border-radius:var(--radius-m); padding:14px;
  transition:.18s ease;
}
.master-card.premium{
  border-color:var(--amber-dim);
  background:linear-gradient(160deg, rgba(255,145,66,.07), transparent 55%), var(--bg-panel);
  box-shadow:0 0 0 1px rgba(255,145,66,.08);
}
.mc-premium-tag{
  position:absolute; top:-9px; right:12px;
  font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.06em;
  color:#191008; background:linear-gradient(135deg, var(--amber), #E67635);
  padding:4px 8px; border-radius:999px;
}
.mc-top{ display:flex; align-items:center; gap:12px; }
.mc-avatar{
  width:56px; height:56px; border-radius:50%; flex-shrink:0; overflow:hidden;
  border:1px solid var(--border-soft);
}
.mc-avatar-img{ width:100%; height:100%; object-fit:cover; display:block; }
.mc-avatar-fallback{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--cyan-dim), var(--amber-dim));
  color:var(--text-1); font-family:var(--font-display); font-weight:700; font-size:17px;
}
.mc-id{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.mc-name{
  font-family:var(--font-display); font-weight:600; font-size:15px; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mc-stats{ display:flex; flex-wrap:wrap; gap:10px; }
.mc-stat{ font-family:var(--font-mono); font-size:11px; color:var(--text-2); display:flex; align-items:center; gap:3px; }
.mc-rating{ color:var(--amber); font-weight:600; }
.mc-rc{ color:var(--text-3); font-weight:400; }
.mc-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
.mc-chip{
  font-family:var(--font-mono); font-size:10px; color:var(--text-2);
  background:var(--bg-panel-2); border:1px solid var(--border-soft);
  padding:4px 9px; border-radius:999px; letter-spacing:.02em;
}
.mc-actions{ display:flex; gap:8px; margin-top:13px; }
.mc-actions a{
  flex:1; text-align:center; padding:11px 8px; border-radius:11px;
  font-family:var(--font-display); font-weight:600; font-size:12.5px;
  display:flex; align-items:center; justify-content:center; gap:6px; transition:.15s;
  text-decoration:none;
}
.mc-actions a.tel{ background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text-1); }
.mc-actions a.tel:active{ background:var(--bg-panel-hover); }
.mc-actions a.tg{ background:linear-gradient(135deg, var(--cyan), #2FA79A); color:#06201C; }
.mc-actions a.tg:active{ transform:scale(.98); }

/* ---------------- ORDER FORM FIELDS ---------------- */
.form-card{ display:flex; flex-direction:column; }
.field{ margin-bottom:16px; }
.field label{
  display:block; font-family:var(--font-mono); font-size:11px; color:var(--cyan);
  letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px;
}
.field input,
.field textarea{
  width:100%; background:var(--bg-panel); border:1.5px solid var(--border); border-radius:13px;
  padding:15px 15px; color:var(--text-1); font-size:15px; font-family:var(--font-body);
  transition:.15s ease;
}
.field input::placeholder,
.field textarea::placeholder{ color:var(--text-3); font-size:13.5px; }
.field input:focus,
.field textarea:focus{
  outline:none; border-color:var(--cyan-dim); background:var(--bg-panel-2);
  box-shadow:0 0 0 3px var(--cyan-glow);
}
.field textarea{ min-height:96px; resize:vertical; line-height:1.5; }

/* ---------------- MENING PROFILIM ---------------- */
.summary-row{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--border-soft);
}

kirgan\n• T-CON platasi nosoz — tasvirni satrlarga bo'lib uzatuvchi plata\n• Shleyk (flex kabel) yoki uning kontakti bo'shab qolgan\n• Grafik protsessor yoki asosiy plata ishdan chiqqan\n• Haddan tashqari past yoki yuqori harorat, namlik ta'siri\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Chiziqlar har doim bir xil joyda turadimi yoki harakat/o'zgarib turadimi?\n   • Bir xil joyda qotib qolgan — matritsa zararlangan bo'lishi ehtimoli katta\n   • O'zgarib, siljib turadi — T-CON yoki shleyk muammosi\n2️⃣ HDMI orqali kompyuter yoki telefon ulang — chiziqlar shu manbada ham bormi?\n   • Bor — matritsa yoki T-CON muammosi\n   • Yo'q — asosiy plata yoki signal manbai muammosi\n3️⃣ TV ning orqa yoki yon tomonlarini juda yengil bosib ko'ring — bosganda chiziqlar o'zgarsa, bu shleyk yoki kontakt bo'shashganidan darak\n4️⃣ Chiziqlar rangi qanday — gorizontalmi, vertikalmi, rangdorми? Bu ustaga tashxis qo'yishda yordam beradi, shuning uchun fotosurat olib qo'ying\n5️⃣ TV ni o'chirib-yoqib ko'ring — vaqtincha yo'qolib, keyin qaytadan chiqishi mumkin, bu ham T-CON muammosini ko'rsatadi\n\n⚠️ Matritsa zararlansa — almashtirish narxi ko'pincha qimmat bo'ladi, ba'zi hollarda yangi TV sotib olish arzonroq bo'lishi mumkin.", "text_ru": "📺 *ТЕЛЕВИЗОР — ПОЛОСЫ НА ЭКРАНЕ*\n\n🔍 *Возможные причины:*\n• Механически повреждена или изношена матрица (панель экрана)\n• Неисправна плата T-CON, отвечающая за построчную передачу изображения\n• Ослаб шлейф (flex-кабель) или его контакт\n• Вышел из строя графический процессор или основная плата\n• Воздействие слишком высокой/низкой температуры или влажности\n\n✅ *Попробуйте сами:*\n1️⃣ Полосы всегда на одном месте или двигаются/меняются?\n   • На одном месте — вероятно повреждена матрица\n   • Меняются, смещаются — проблема в T-CON или шлейфе\n2️⃣ Подключите компьютер или телефон через HDMI — полосы есть и на этом источнике?\n   • Есть — проблема в матрице или T-CON\n   • Нет — проблема в основной плате или источнике сигнала\n3️⃣ Очень слегка надавите на заднюю или боковую часть ТВ — если полосы меняются от нажатия, это шлейф или ослабший контакт\n4️⃣ Какого цвета и направления полосы — горизонтальные, вертикальные, цветные? Сфотографируйте — это поможет мастеру при диагностике\n5️⃣ Выключите и включите ТВ — если полосы временно исчезают и появляются снова, это тоже указывает на проблему T-CON\n\n⚠️ Замена матрицы обычно стоит дорого — в некоторых случаях выгоднее купить новый телевизор."}, {"label_uz": "📺 Wifiga ulanmaydi", "label_ru": "📺 WiFi не подключается", "text_uz": "📺 *TELEVIZOR — WIFIGA ULANMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Routerda vaqtinchalik nosozlik\n• TV ning WiFi moduli nosoz yoki eskirgan\n• Noto'g'ri parol kiritilgan yoki tarmoq nomi (SSID) o'zgargan\n• Router bilan TV orasidagi masofa uzoq yoki devor/qavat to'sqinlik qilyapti\n• TV dasturiy ta'minoti (firmware) eskirgan\n• Routerda qurilmalar soni chegarasiga yetgan (ko'p qurilma ulangan)\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Routerni qayta yoqing: o'chiring, 30 soniya kuting, qayta yoqing\n2️⃣ Telefon yoki noutbuk shu WiFi ga ulanadimi tekshiring — ulansa, muammo TV da; ulanmasa, muammo routerda\n3️⃣ TV dagi WiFi sozlamalarida shu tarmoqni \"Unutish\" (Forget network) qilib, qaytadan parol kiritib ulang\n4️⃣ DNS manzilini qo'lda o'zgartiring: 8.8.8.8 (Google DNS)\n5️⃣ Telefonda hotspot (WiFi ulashish) yoqib, TV ni o'sha tarmoqqa ulab ko'ring — ulansa, TV ning WiFi moduli soz, muammo asosiy routerda\n6️⃣ Router bilan TV orasidagi masofani kamaytiring yoki TV ni router yaqiniga vaqtincha ko'chiring\n7️⃣ TV ni zavod sozlamalariga qaytaring (Factory Reset) — bu barcha sozlamalarni tozalaydi, ehtiyot bo'ling\n8️⃣ Imkon bo'lsa, WiFi o'rniga tarmoq kabeli (LAN) orqali ulab ko'ring — internet borligi aniqlansa, muammo faqat WiFi modulida", "text_ru": "📺 *ТЕЛЕВИЗОР — WiFi НЕ ПОДКЛЮЧАЕТСЯ*\n\n🔍 *Возможные причины:*\n• Временный сбой в роутере\n• Неисправен или устарел WiFi модуль ТВ\n• Введён неверный пароль или изменилось имя сети (SSID)\n• Большое расстояние между роутером и ТВ, мешают стены/этажи\n• Устарела прошивка (firmware) ТВ\n• На роутере достигнут лимит подключённых устройств\n\n✅ *Попробуйте сами:*\n1️⃣ Перезапустите роутер: выключите, подождите 30 секунд, включите снова\n2️⃣ Проверьте, подключается ли к этому WiFi телефон или ноутбук — подключается: проблема в ТВ; не подключается: проблема в роутере\n3️⃣ В настройках WiFi на ТВ выберите сеть и нажмите \"Забыть сеть\" (Forget network), затем подключитесь заново, введя пароль\n4️⃣ Вручную смените DNS на 8.8.8.8 (Google DNS)\n5️⃣ Включите на телефоне точку доступа (hotspot) и подключите к ней ТВ — подключился: WiFi модуль исправен, проблема в основном роутере\n6️⃣ Сократите расстояние между роутером и ТВ или временно перенесите ТВ ближе к роутеру\n7️⃣ Сбросьте ТВ до заводских настроек (Factory Reset) — это удалит все настройки, будьте внимательны\n8️⃣ Если возможно, подключите ТВ кабелем (LAN) вместо WiFi — если интернет появится, проблема именно в WiFi модуле"}, {"label_uz": "📺 YouTube kirmaydi", "label_ru": "📺 YouTube не работает", "text_uz": "📺 *TELEVIZOR — YOUTUBE KIRMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• YouTube ilovasi eskirgan versiyada\n• TV dagi kesh (cache) va vaqtinchalik fayllar to'lib ketgan\n• Google hisobida muammo yoki sessiya muddati tugagan\n• TV dagi sana va vaqt noto'g'ri sozlangan\n• Internet tezligi past yoki uzilib-ulanib turibdi\n• YouTube xizmatining o'zida vaqtinchalik nosozlik (server tomonda)\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ YouTube ilovasini yangilang: Sozlamalar → Ilovalar → YouTube → Yangilash\n2️⃣ Ilova keshini tozalang: Sozlamalar → Ilovalar → YouTube → Keshni tozalash (Clear cache)\n3️⃣ TV vaqtini avtomatik rejimga o'rnating: Sozlamalar → Vaqt → Avtomatik\n4️⃣ Google hisobdan chiqib, qaytadan kiring\n5️⃣ Routerni qayta yoqing va internet tezligini boshqa qurilmada tekshiring\n6️⃣ Telefon hotspot orqali ulab, YouTube shu tarzda ishlaydimi tekshiring\n7️⃣ Ilovani butunlay o'chirib (Uninstall), qaytadan o'rnating (agar TV imkon bersa)\n8️⃣ Boshqa ilova (masalan brauzer)dan youtube.com ochib ko'ring — u yerda ham ishlamasa, muammo internetda", "text_ru": "📺 *ТЕЛЕВИЗОР — YOUTUBE НЕ РАБОТАЕТ*\n\n🔍 *Возможные причины:*\n• Устаревшая версия приложения YouTube\n• Переполнен кэш и временные файлы на ТВ\n• Проблема с аккаунтом Google или истёк срок сессии\n• Неверно настроены дата и время на ТВ\n• Низкая или нестабильная скорость интернета\n• Временный сбой на стороне серверов YouTube\n\n✅ *Попробуйте сами:*\n1️⃣ Обновите приложение: Настройки → Приложения → YouTube → Обновить\n2️⃣ Очистите кэш приложения: Настройки → Приложения → YouTube → Очистить кэш\n3️⃣ Установите время автоматически: Настройки → Время → Авто\n4️⃣ Выйдите из аккаунта Google и войдите снова\n5️⃣ Перезапустите роутер и проверьте скорость интернета на другом устройстве\n6️⃣ Подключитесь через hotspot телефона и проверьте, работает ли так YouTube\n7️⃣ Полностью удалите приложение и установите заново (если ТВ это позволяет)\n8️⃣ Откройте youtube.com через другое приложение (например браузер) — если и там не работает, проблема в интернете"}, {"label_uz": "📺 Kanal terish", "label_ru": "📺 Настройка каналов", "text_uz": "📺 *TELEVIZOR — KANAL TERISH*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Antenna yoki tarelka kabeli bo'shashgan yoki zararlangan\n• Kanal qidiruvi hali o'tkazilmagan yoki eski sozlama qolgan\n• Signal manbai (efir/kabel/sputnik) noto'g'ri tanlangan\n• Antenna yoki tarelka yo'nalishi noto'g'ri\n• Resiver yoki dekoder nosoz\n\n📡 *Antenna (efir) orqali sozlash:*\n1️⃣ Antenna kabelini TV ga mahkam tiqing, kontakt yaxshi ekanini tekshiring\n2️⃣ Menyu → Kanal (Channel) → Avtomatik qidirish (Auto Search) ni bosing\n3️⃣ DVB-T2 standartini tanlang (O'zbekistonda asosan shu standart ishlaydi)\n4️⃣ Antenna yo'nalishini to'g'rilang — imkon qadar tashqariga, ochiq tomonga qarating\n5️⃣ Balandroq joyga (deraza yoniga, tomga) o'rnatib ko'ring — signal sifatiga ta'sir qiladi\n\n🛰 *Sputnik (tarelka) orqali sozlash:*\n1️⃣ Tarelka yo'nalishi to'g'rimi tekshiring — odatda janubi-g'arbga qarashi kerak (aniq burchak sputnik operatoriga bog'liq)\n2️⃣ Resiverni qayta yoqing: o'chiring, 1 daqiqa kuting, yoqing\n3️⃣ Barcha kabel ulanishlarini, ayniqsa tashqaridagi ulanishlarni tekshiring — namlik kirgan bo'lishi mumkin\n4️⃣ Resiver menyusida signal darajasi (signal level/quality) ko'rsatkichini tekshiring — past bo'lsa tarelkani sekin burab, ko'rsatkich eng yuqori bo'lgan nuqtani toping\n\n📶 *Kabel TV orqali:*\n1️⃣ Provayder kabelini tekshiring, TV yoki pristavkaga mahkam ulanganini ko'ring\n2️⃣ Pristavka (agar bor bo'lsa) qayta ishga tushirilsinmi tekshiring\n3️⃣ Provayderga qo'ng'iroq qilib, o'sha hududda uzilish yo'qligini so'rang", "text_ru": "📺 *ТЕЛЕВИЗОР — НАСТРОЙКА КАНАЛОВ*\n\n🔍 *Возможные причины:*\n• Ослаб или повреждён кабель антенны/тарелки\n• Поиск каналов ещё не выполнялся или сохранились старые настройки\n• Неверно выбран источник сигнала (эфир/кабель/спутник)\n• Неправильное направление антенны или тарелки\n• Неисправен ресивер или декодер\n\n📡 *Настройка через антенну (эфир):*\n1️⃣ Плотно вставьте кабель антенны в ТВ, проверьте качество контакта\n2️⃣ Меню → Каналы (Channel) → Автопоиск (Auto Search)\n3️⃣ Выберите стандарт DVB-T2 (в Узбекистане используется преимущественно он)\n4️⃣ Направьте антенну правильно — по возможности на улицу, в открытую сторону\n5️⃣ Попробуйте установить антенну выше (у окна, на крыше) — это влияет на качество сигнала\n\n🛰 *Настройка через спутник (тарелку):*\n1️⃣ Проверьте направление тарелки — обычно должна смотреть на юго-запад (точный угол зависит от спутникового оператора)\n2️⃣ Перезагрузите ресивер: выключите, подождите 1 минуту, включите\n3️⃣ Проверьте все соединения кабелей, особенно наружные — возможно попадание влаги\n4️⃣ В меню ресивера проверьте уровень и качество сигнала (signal level/quality) — если низкий, медленно поворачивайте тарелку, найдите точку с максимальным показателем\n\n📶 *Через кабельное ТВ:*\n1️⃣ Проверьте кабель провайдера, его надёжное подключение к ТВ или приставке\n2️⃣ Перезагрузите приставку (если она есть)\n3️⃣ Позвоните провайдеру и уточните, нет ли перебоев в вашем районе"}, {"label_uz": "📺 Pult ishlamaydi", "label_ru": "📺 Пульт не работает", "text_uz": "📺 *TELEVIZOR — PULT ISHLAMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Pult batareyalari tugagan yoki noto'g'ri o'rnatilgan\n• Pultning infraqizil (IR) chirog'i nosoz\n• TV ning IR qabul qiluvchisi (sensor) chang bosgan yoki nosoz\n• Pult TV bilan bog'lanish (pairing) rejimidan chiqib qolgan (Bluetooth pultlarda)\n• Pult tugmalari eskirib, ichkarida kontakt yopishmayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Batareyalarni yangisiga almashtiring, + va − qutblari to'g'ri turganini tekshiring\n2️⃣ Telefon kamerasi orqali pultning old (IR chiroq) qismiga qarab, pultdagi tugmani bosing — kamerada binafsha rang chiroq yonib-o'chsa, pult ishlayapti\n3️⃣ Pult bilan TV orasida to'sqinlik yo'qligini tekshiring, masofani 1-2 metrgacha yaqinlashtiring\n4️⃣ TV ning IR sensor qismini (odatda pastki old burchakda) yumshoq, quruq mato bilan artib tozalang\n5️⃣ Bluetooth pult bo'lsa — TV sozlamalaridan pultni o'chirib, qaytadan ulang (pairing)\n6️⃣ Pult tugmalarini biттa-bittalab bosib ko'ring — faqat ba'zi tugmalar ishlamasa, bu mexanik eskirish belgisi\n7️⃣ Boshqa pult (yoki telefon ilovasi orqali TV boshqarish) bilan sinab ko'ring — ishlasa, muammo eski pultda", "text_ru": "📺 *ТЕЛЕВИЗОР — НЕ РАБОТАЕТ ПУЛЬТ*\n\n🔍 *Возможные причины:*\n• Сели батарейки в пульте или неправильно установлены\n• Неисправен инфракрасный (ИК) светодиод пульта\n• ИК-приёмник (сенсор) на ТВ запылился или неисправен\n• Bluetooth-пульт вышел из режима сопряжения (pairing)\n• Кнопки пульта изношены, внутри не срабатывает контакт\n\n✅ *Попробуйте сами:*\n1️⃣ Замените батарейки на новые, проверьте правильность полярности + и −\n2️⃣ Направьте пульт передней частью (ИК-диод) на камеру телефона и нажмите любую кнопку — если на экране камеры видно мигание фиолетового света, пульт исправен\n3️⃣ Уберите препятствия между пультом и ТВ, приблизьтесь на 1-2 метра\n4️⃣ Протрите ИК-сенсор на ТВ (обычно в нижнем переднем углу) мягкой сухой тканью\n5️⃣ Для Bluetooth-пульта — отключите его в настройках ТВ и подключите заново (pairing)\n6️⃣ Проверьте кнопки по одной — если не работают только некоторые, это признак механического износа\n7️⃣ Попробуйте другой пульт или приложение для управления ТВ с телефона — если работает, проблема именно в старом пульте"}, {"label_uz": "📺 O'zi o'chib-yonadi", "label_ru": "📺 Сам выключается/включается", "text_uz": "📺 *TELEVIZOR — O'ZI O'CHIB-YONADI, QAYTA ISHGA TUSHADI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Elektr ta'minoti beqaror — kuchlanish sakrab turibdi\n• Quvvat blokidagi kondensatorlar eskirgan, yetarli quvvat bermayapti\n• TV qizib ketyapti — ventilyatsiya teshiklari chang bilan bekilgan\n• Dasturiy ta'minot (software) xatoligi yoki muzlab qolish\n• Avtomatik yangilanish (update) jarayonida TV o'zicha qayta ishga tushishi mumkin\n• Timer yoki uyqu rejimi (Sleep Timer) tasodifan yoqilgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Sozlamalardan Sleep Timer (uyqu taймeri) o'chirilganini tekshiring\n2️⃣ TV ortidagi va yon tomonidagi ventilyatsiya teshiklarini changdan tozalang, TV atrofida havo aylanishi uchun joy qoldiring\n3️⃣ TV ni to'g'ridan-to'g'ri rozetkaga ulang, tarmoq filtri yoki stabilizator ishlatib ko'ring\n4️⃣ Necha daqiqadan keyin o'chib-yonishini kuzating — vaqt bir xil bo'lsa (masalan har 20 daqiqada), bu qizib ketish yoki dasturiy xatolikka o'xshaydi\n5️⃣ TV ni zavod sozlamalariga qaytaring (Factory Reset)\n6️⃣ Agar mavjud bo'lsa, dasturiy ta'minotni yangilang: Sozlamalar → Tizim haqida → Yangilash\n7️⃣ Boshqa qurilmalarni o'sha rozetkadan uzib, faqat TV ni ulab kuzating — bu kuchlanish muammosini rad etish yoki tasdiqlash uchun yordam beradi\n\n⚠️ Doimiy o'chib-yonish quvvat blokiga zarar berishi mumkin — muammo davom etsa, ustaga ko'rsatishni kechiktirmang.", "text_ru": "📺 *ТЕЛЕВИЗОР — САМ ВЫКЛЮЧАЕТСЯ/ВКЛЮЧАЕТСЯ, ПЕРЕЗАГРУЖАЕТСЯ*\n\n🔍 *Возможные причины:*\n• Нестабильное напряжение в электросети — скачки\n• Изношены конденсаторы блока питания, не хватает мощности\n• ТВ перегревается — вентиляционные отверстия забиты пылью\n• Программный сбой (software) или зависание\n• Во время автоматического обновления ТВ может перезагружаться сам\n• Случайно включён таймер сна (Sleep Timer)\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте в настройках, не включён ли таймер сна (Sleep Timer)\n2️⃣ Очистите от пыли вентиляционные отверстия сзади и по бокам ТВ, оставьте пространство для циркуляции воздуха\n3️⃣ Подключите ТВ напрямую в розетку, попробуйте использовать сетевой фильтр или стабилизатор\n4️⃣ Проследите, через сколько минут ТВ выключается/включается — если интервал одинаковый (например каждые 20 минут), похоже на перегрев или программный сбой\n5️⃣ Сбросьте ТВ до заводских настроек (Factory Reset)\n6️⃣ Если доступно, обновите программное обеспечение: Настройки → О системе → Обновление\n7️⃣ Отключите другие приборы от той же розетки, оставьте включённым только ТВ и понаблюдайте — это поможет исключить или подтвердить проблему с напряжением\n\n⚠️ Постоянные перезагрузки могут повредить блок питания — если проблема не проходит, не откладывайте обращение к мастеру."}, {"label_uz": "📺 Rang buzilgan", "label_ru": "📺 Искажение цвета", "text_uz": "📺 *TELEVIZOR — RANG BUZILGAN YOKI NOTO'G'RI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Rang sozlamalari (Color/Tint/Hue) noto'g'ri o'rnatilgan\n• Kabel (HDMI, AV, antenna) yaxshi ulanmagan yoki zararlangan\n• Matritsaning rang filtri qismi zararlangan\n• Video protsessor yoki plata nosoz\n• Signal manbaida (pristavka, konsol) muammo bor\n• Kuchli magnit maydon ta'siri (eski kinescope TV larda uchraydi)\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Sozlamalarda rang (Picture/Color) bo'limini zavod holatiga qaytaring (Reset to default)\n2️⃣ Barcha kabellarni (HDMI, AV, antenna) mahkam qayta ulang, boshqa kabel bilan sinab ko'ring\n3️⃣ Boshqa manba (masalan USB flesh orqali video) qo'yib ko'ring — rang o'sha yerda ham buzilganmi tekshiring\n4️⃣ Faqat bitta kanal yoki manbadami yoki barcha joyda ranglar buzilganmi aniqlang\n   • Faqat bitta manbada — o'sha qurilma yoki kabel muammosi\n   • Hamma joyda — TV ning o'zida muammo\n5️⃣ Rang tonlari (masalan yashil yoki qizil) doim bir xil buzilganmi yoki o'zgarib turadimi kuzating — bu ustaga tashxis qo'yishda foydali bo'ladi\n6️⃣ TV ni 10 daqiqaga o'chirib, qayta yoqing\n\n💡 Rang buzilishi ekranning ma'lum qismida (masalan bir burchakda) bo'lsa, bu ko'pincha matritsa yoki T-CON platasi muammosidan darak beradi.", "text_ru": "📺 *ТЕЛЕВИЗОР — ИСКАЖЕНИЕ ЦВЕТА*\n\n🔍 *Возможные причины:*\n• Неверно настроены параметры цвета (Color/Tint/Hue)\n• Плохо подключён или повреждён кабель (HDMI, AV, антенна)\n• Повреждена цветовая часть матрицы\n• Неисправен видеопроцессор или плата\n• Проблема в источнике сигнала (приставка, консоль)\n• Воздействие сильного магнитного поля (встречается у старых кинескопных ТВ)\n\n✅ *Попробуйте сами:*\n1️⃣ В настройках изображения сбросьте цвет (Picture/Color) до заводских значений (Reset to default)\n2️⃣ Заново плотно подключите все кабели (HDMI, AV, антенна), попробуйте другой кабель\n3️⃣ Подключите другой источник (например видео с USB-флешки) — искажение цвета есть и там?\n4️⃣ Определите, искажение только на одном канале/источнике или везде\n   • Только в одном источнике — проблема в устройстве или кабеле\n   • Везде — проблема в самом ТВ\n5️⃣ Проследите, искажён ли всегда один и тот же оттенок (например зелёный или красный) или он меняется — это поможет мастеру в диагностике\n6️⃣ Выключите ТВ на 10 минут и включите снова\n\n💡 Если искажение цвета видно только в определённой части экрана (например в одном углу), это часто говорит о проблеме с матрицей или платой T-CON."}, {"label_uz": "📺 Sekin ishlaydi / qotadi", "label_ru": "📺 Медленно работает / зависает", "text_uz": "📺 *SMART TV SEKIN ISHLAYDI, QOTIB QOLADI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Xotira (RAM) va kesh to'lib ketgan — ko'p ilova ochiq turibdi\n• Dasturiy ta'minot (firmware) eskirgan\n• Internet tezligi past yoki uzilib-ulanib turibdi\n• Ichki xotira (storage) deyarli to'lgan\n• Eski model protsessori zamonaviy ilovalarni ko'tara olmayapti\n• Fonda ko'p ilova ishlab turibdi (background processes)\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ TV ni to'liq o'chirib, rozetkadan 1 daqiqaga uzib, qayta ulang (bu RAM ni tozalaydi)\n2️⃣ Ishlatilmayotgan ilovalarni yoping: ochiq ilovalar ro'yxatidan chiqib, ortiqchalarini yoping\n3️⃣ Ilova va tizim keshini tozalang: Sozlamalar → Ilovalar → har birini tanlab \"Keshni tozalash\"\n4️⃣ Kerak bo'lmagan ilovalarni o'chiring (Uninstall), ichki xotirani bo'shating\n5️⃣ Dasturiy ta'minotni yangilang: Sozlamalar → Tizim haqida → Yangilash\n6️⃣ Internet tezligini tekshiring — sekin internet Smart TV ilovalarini sekinlashtiradi\n7️⃣ TV ni zavod sozlamalariga qaytaring (Factory Reset) — bu eng samarali usul, lekin barcha sozlamalar o'chadi\n8️⃣ Agar tashqi USB xotira yoki flesh ulangan bo'lsa, uni vaqtincha ajratib ko'ring — ba'zan shu sabab bo'ladi", "text_ru": "📺 *SMART TV МЕДЛЕННО РАБОТАЕТ, ЗАВИСАЕТ*\n\n🔍 *Возможные причины:*\n• Заполнена оперативная память (RAM) и кэш — открыто много приложений\n• Устарела прошивка (firmware)\n• Низкая или нестабильная скорость интернета\n• Почти заполнена внутренняя память (storage)\n• Старая модель процессора не справляется с современными приложениями\n• В фоне работает много процессов (background processes)\n\n✅ *Попробуйте сами:*\n1️⃣ Полностью выключите ТВ, отключите от розетки на 1 минуту и включите снова (это очищает RAM)\n2️⃣ Закройте неиспользуемые приложения: выйдите из списка открытых приложений и закройте лишние\n3️⃣ Очистите кэш приложений и системы: Настройки → Приложения → выберите каждое → \"Очистить кэш\"\n4️⃣ Удалите ненужные приложения (Uninstall), освободите внутреннюю память\n5️⃣ Обновите прошивку: Настройки → О системе → Обновление\n6️⃣ Проверьте скорость интернета — медленный интернет тормозит приложения Smart TV\n7️⃣ Сбросьте ТВ до заводских настроек (Factory Reset) — самый эффективный способ, но все настройки будут удалены\n8️⃣ Если подключён внешний USB-накопитель или флешка, временно отключите его — иногда причина в этом"}, {"label_uz": "📺 Ekranda qora dog'lar", "label_ru": "📺 Тёмные пятна на экране", "text_uz": "📺 *EKRANDA QORA DOG'LAR YOKI O'LIK PIKSELLAR*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Bitta yoki bir nechta piksel ishdan chiqqan (dead pixel)\n• Matritsaga mexanik zarba yoki bosim tushgan (masalan urilgan, tirnalgan)\n• Namlik yoki suyuqlik ekran ichiga kirib qolgan\n• Ekranda uzoq vaqt bir xil tasvir turib qolgan (screen burn-in/ghosting)\n• Ishlab chiqarish nuqsoni (yangi TV larda kamdan-kam uchraydi)\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Dog'/piksel doim bir xil joyda turadimi — TV ni o'chirib, keyin qayta yoqib ham tekshiring\n2️⃣ Turli rangdagi (oq, qora, qizil, yashil, ko'k) fon rasmlarini navbat bilan qo'yib ko'ring — piksel qaysi rangda yaqqol ko'rinishini aniqlang\n3️⃣ Dog' bir nechta piksel bo'lsa, YouTube'dan \"dead pixel fix\" videolarini ijro etib ko'rish mumkin — ba'zida yordam beradi (piksel \"muzlab\" qolgan bo'lsa)\n4️⃣ Dog' o'rnini yengil, quruq mikrofibra mato bilan aylana harakat qilib ishqalang (juda ehtiyotkorlik bilan, kuch bilan bosmang)\n5️⃣ Agar suyuqlik tushgan bo'lsa — TV ni darhol o'chirib, quruq joyda vertikal holatda 24-48 soat qoldiring, keyin yoqing\n6️⃣ Dog' kattalashib yoki ko'payib boryaptimi kuzating — bu holatda tezroq ustaga ko'rsating\n\n⚠️ Agar dog' matritsa ichida (piksel darajasida) bo'lsa, uyda tuzatib bo'lmaydi — faqat matritsani almashtirish yoki, agar kafolat bo'lsa, servisga murojaat qilish mumkin.", "text_ru": "📺 *ТЁМНЫЕ ПЯТНА ИЛИ БИТЫЕ ПИКСЕЛИ НА ЭКРАНЕ*\n\n🔍 *Возможные причины:*\n• Вышел из строя один или несколько пикселей (dead pixel)\n• Механический удар или давление на матрицу (удар, царапина)\n• Попадание влаги или жидкости внутрь экрана\n• Долгое время на экране было одно и то же изображение (выгорание/шлейф — screen burn-in)\n• Заводской брак (у новых ТВ встречается редко)\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте, всегда ли пятно/пиксель на одном месте — выключите и снова включите ТВ\n2️⃣ По очереди выведите на экран разные однотонные фоны (белый, чёрный, красный, зелёный, синий) — определите, на каком цвете пиксель заметнее\n3️⃣ Если это один или несколько пикселей, можно попробовать видео \"dead pixel fix\" на YouTube — иногда помогает, если пиксель просто \"завис\"\n4️⃣ Аккуратно, круговыми движениями протрите место сухой микрофиброй (очень бережно, без нажима)\n5️⃣ Если попала жидкость — немедленно выключите ТВ и оставьте в вертикальном положении в сухом месте на 24-48 часов, затем включите\n6️⃣ Следите, увеличивается ли пятно или появляются новые — в этом случае как можно скорее покажите мастеру\n\n⚠️ Если пятно находится внутри самой матрицы (на уровне пикселей), в домашних условиях это не исправить — только замена матрицы или обращение в сервис по гарантии."}, {"label_uz": "📺 HDMI signal yo'q", "label_ru": "📺 Нет сигнала HDMI", "text_uz": "📺 *HDMI PORTGA ULAGANDA SIGNAL YO'Q*\n\n🔍 *Sabab bo'lishi mumkin:*\n• HDMI kabel zararlangan yoki mos emas\n• TV dagi HDMI port o'zi nosoz (bir nechta port bo'lsa, ba'zisi ishlamasligi mumkin)\n• Ulangan qurilma (konsol, pristavka, noutbuk) chiqish sozlamasi noto'g'ri\n• TV da noto'g'ri kirish manbai (input/source) tanlangan\n• HDMI CEC yoki quvvat rejimi sozlamalari to'sqinlik qilyapti\n• Kabel uzunligi haddan tashqari uzun, signal zaiflashgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Pultda SOURCE/INPUT tugmasini bosib, to'g'ri HDMI portni tanlaganingizni tekshiring (HDMI1, HDMI2 va h.k.)\n2️⃣ Kabelni ikkala tomondan chiqarib, qayta mahkam ulang\n3️⃣ Shu kabelni boshqa HDMI portga ulab ko'ring — ishlasa, birinchi port nosoz\n4️⃣ Boshqa HDMI kabel bilan sinab ko'ring — ayniqsa eski yoki arzon kabellar tez-tez muammo beradi\n5️⃣ Ulangan qurilmani (konsol, pristavka) boshqa TV yoki monitorga ulab ko'ring — signal chiqsa, muammo TV da\n6️⃣ Ulangan qurilma va TV ni ikkalasini ham o'chirib, avval qurilmani, keyin TV ni yoqing\n7️⃣ TV sozlamalarida HDMI signal formatini tekshiring (masalan Enhanced/UHD Color yoqilgan bo'lsa, ba'zi eski qurilmalar bilan mos kelmasligi mumkin)\n8️⃣ HDMI CEC (Anynet+, Bravia Sync va h.k.) funksiyasini vaqtincha o'chirib ko'ring", "text_ru": "📺 *НЕТ СИГНАЛА ПРИ ПОДКЛЮЧЕНИИ К HDMI*\n\n🔍 *Возможные причины:*\n• Повреждён или несовместим HDMI-кабель\n• Неисправен сам HDMI-порт на ТВ (при нескольких портах может не работать один из них)\n• Неверные настройки вывода на подключённом устройстве (консоль, приставка, ноутбук)\n• На ТВ выбран неверный источник сигнала (input/source)\n• Мешают настройки HDMI CEC или режима питания\n• Слишком длинный кабель, сигнал ослаблен\n\n✅ *Попробуйте сами:*\n1️⃣ Нажмите SOURCE/INPUT на пульте и убедитесь, что выбран правильный HDMI-порт (HDMI1, HDMI2 и т.д.)\n2️⃣ Отсоедините кабель с обеих сторон и подключите заново, плотно\n3️⃣ Подключите этот же кабель к другому HDMI-порту — если заработает, первый порт неисправен\n4️⃣ Попробуйте другой HDMI-кабель — особенно старые или дешёвые кабели часто дают сбой\n5️⃣ Подключите устройство (консоль, приставку) к другому ТВ или монитору — если сигнал есть, проблема в вашем ТВ\n6️⃣ Выключите оба устройства, сначала включите подключённое устройство, затем ТВ\n7️⃣ Проверьте формат HDMI-сигнала в настройках ТВ (например Enhanced/UHD Color может быть несовместим со старыми устройствами)\n8️⃣ Временно отключите функцию HDMI CEC (Anynet+, Bravia Sync и т.п.)"}, {"label_uz": "📺 Ovoz-tasvir mos kelmaydi", "label_ru": "📺 Звук не совпадает с видео", "text_uz": "📺 *OVOZ VA TASVIR MOS KELMAYDI (KECHIKISH)*\n\n🔍 *Sabab bo'lishi mumkin:*\n• TV ning ovoz qayta ishlash (audio processing) sozlamasi kechikish yaratyapti\n• Tashqi karnay (soundbar, Bluetooth) orqali ovoz kechikib kelyapti\n• Signal manbaida (pristavka, konsol) muammo bor\n• Internet orqali translyatsiya (streaming) sifati past yoki uzilib-ulanib turibdi\n• HDMI ARC/eARC sozlamasi noto'g'ri ishlayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Sozlamalarda \"Audio Delay\" yoki \"Lip Sync\" (Ovoz kechikishi) bo'limini toping va qiymatini 0 ga qaytaring, so'ng kerak bo'lsa asta-sekin sozlang\n2️⃣ Agar tashqi karnay yoki soundbar ulangan bo'lsa, uning o'zida ham audio delay sozlamasi bormi tekshiring\n3️⃣ TV ichki dinamiklariga o'tkazib ko'ring (tashqi karnayni uzib) — muammo yo'qolsa, tashqi qurilma sozlamasida ekan\n4️⃣ Boshqa kanal yoki dastur (ilova)da ham kechikish bormi tekshiring — faqat bittasida bo'lsa, o'sha dastur/kanal muammosi\n5️⃣ Internet orqali translyatsiya (masalan IPTV, YouTube) bo'lsa, internet tezligini tekshiring — sekin internet ovoz-tasvir mosligini buzishi mumkin\n6️⃣ HDMI ARC/eARC kabelini almashtirib ko'ring yoki oddiy optik/aux kabel bilan sinab ko'ring\n7️⃣ TV va tashqi qurilmalarni qayta ishga tushiring — ba'zan bu sinxronizatsiyani tiklaydi", "text_ru": "📺 *ЗВУК НЕ СОВПАДАЕТ С ВИДЕО (ЗАДЕРЖКА)*\n\n🔍 *Возможные причины:*\n• Настройка обработки звука (audio processing) на ТВ создаёт задержку\n• Звук с внешней колонки (soundbar, Bluetooth) приходит с опозданием\n• Проблема в источнике сигнала (приставка, консоль)\n• Низкое качество или нестабильность интернет-трансляции (streaming)\n• Неверно работает настройка HDMI ARC/eARC\n\n✅ *Попробуйте сами:*\n1️⃣ Найдите в настройках раздел \"Audio Delay\" или \"Lip Sync\" (задержка звука) и верните значение на 0, затем при необходимости настройте постепенно\n2️⃣ Если подключена внешняя колонка или soundbar, проверьте, есть ли у неё своя настройка задержки звука\n3️⃣ Переключитесь на встроенные динамики ТВ (отключив внешнюю колонку) — если проблема исчезла, дело в настройках внешнего устройства\n4️⃣ Проверьте, есть ли задержка на другом канале или в другом приложении — если только в одном, проблема именно в нём\n5️⃣ При интернет-трансляции (например IPTV, YouTube) проверьте скорость интернета — медленный интернет может нарушать синхронизацию звука и видео\n6️⃣ Попробуйте заменить кабель HDMI ARC/eARC или подключить звук через обычный оптический/aux кабель\n7️⃣ Перезагрузите ТВ и внешние устройства — иногда это восстанавливает синхронизацию"}]}, {"id": "kond", "icon": "❄️", "name_uz": "Konditsioner", "name_ru": "Кондиционер", "type": "flat_with_codes", "items": [{"label_uz": "❄️ Ichidan suv oqadi", "label_ru": "❄️ Течёт вода изнутри", "text_uz": "❄️ *KONDITSIONER — ICHIDAN SUV OQADI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Filtr kir bo'lib ketgan — havo yetarlicha o'tolmayapti\n• Drenaj quvuri (suv chiqish naychasi) tiqilib qolgan\n• Harorat juda past qo'yilgan — bu muz hosil qilib, keyin erib oqadi\n• Ichki blok qiyaligi noto'g'ri o'rnatilgan (suv drenajga emas, ichkariga oqadi)\n• Drenaj nasosi (agar bo'lsa) ishlamayapti\n• Freon kamaygan — bosim tushib, muz hosil bo'lishi mumkin\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Ichki blok qopqog'ini oching — filtrni ehtiyotkorlik bilan chiqarib, iliq suv bilan yuving va quriting\n2️⃣ Tashqaridan drenaj (plastik naycha) qayerga chiqishini toping, tiqin yo'qligini tekshiring — kerak bo'lsa yumshoq sim yoki quruq havo bilan tozalang\n3️⃣ Haroratni 22-24°C ga qo'ying — juda past qo'yilsa muz hosil bo'lib, keyin erib suv oqishi mumkin\n4️⃣ Ichki blokning qiyaligini tekshiring — bir tomoni biroz pastroq bo'lishi kerak, suv drenajga qarab oqishi uchun\n5️⃣ Konditsionerni bir necha soat o'chirib, suv oqishi to'xtaydimi kuzating — to'xtasa, muz erishi bilan bog'liq\n6️⃣ Filtrni har 2 haftada tozalash tavsiya etiladi — bu ko'p muammolarning oldini oladi", "text_ru": "❄️ *КОНДИЦИОНЕР — ТЕЧЁТ ВОДА ИЗНУТРИ*\n\n🔍 *Возможные причины:*\n• Загрязнён фильтр — воздух не проходит в достаточном объёме\n• Засорена дренажная трубка (для отвода воды)\n• Слишком низкая температура — образуется лёд, который потом тает\n• Неверный уклон внутреннего блока при установке (вода течёт внутрь, а не в дренаж)\n• Не работает дренажный насос (если есть)\n• Снизился уровень фреона — падение давления может вызывать обледенение\n\n✅ *Попробуйте сами:*\n1️⃣ Откройте крышку внутреннего блока — аккуратно снимите фильтр, промойте тёплой водой и просушите\n2️⃣ Снаружи найдите дренажную трубку, проверьте на засор — при необходимости прочистите мягкой проволокой или сжатым воздухом\n3️⃣ Установите температуру 22-24°C — слишком низкая вызывает обмерзание и последующую течь\n4️⃣ Проверьте уклон внутреннего блока — одна сторона должна быть чуть ниже для стока воды в дренаж\n5️⃣ Выключите кондиционер на несколько часов и понаблюдайте, прекратится ли течь — если да, дело было в таянии льда\n6️⃣ Рекомендуется чистить фильтр каждые 2 недели — это предотвращает многие проблемы"}, {"label_uz": "❄️ Issiq havo haydaydi", "label_ru": "❄️ Гонит тёплый воздух", "text_uz": "❄️ *KONDITSIONER — ISSIQ HAVO HAYDAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Noto'g'ri rejim tanlangan (masalan HEAT yoki FAN COOL o'rniga)\n• Freon gazi tugagan yoki sizib chiqmoqda\n• Tashqi blok filtri yoki radiatori kir, issiqlikni chiqara olmayapti\n• Kompressor ishlamayapti yoki zaiflashgan\n• Tashqi blok atrofida havo aylanishi yetarli emas (devorga yaqin o'rnatilgan)\n• 4 yo'lli klapan (reverse valve) nosoz — issiq/sovuq rejimlarni almashtiruvchi qism\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Pultdan ❄️ belgili *COOL* yoki *AUTO* rejimini tanlaganingizni tekshiring\n2️⃣ Haroratni xona haroratidan 4-5°C past qo'ying\n3️⃣ Fan tezligini *AUTO* yoki *HIGH* ga qo'ying\n4️⃣ 10-15 daqiqa kuting — sovutish sekin boshlanishi mumkin\n5️⃣ Tashqi blokni ehtiyotkorlik bilan qo'l bilan tekshiring — issiqroq bo'lishi kerak; sovuq bo'lsa freon yo'q yoki kompressor ishlamayapti\n6️⃣ Tashqi blok radiatorini (panjarasini) changdan, barglardan tozalang, atrofida kamida 30-50 sm bo'sh joy qoldiring\n7️⃣ Pultda tasodifan HEAT rejimi tanlanmaganini tag'in bir bor tekshiring\n\n⚠️ Freon o'zi tugamaydi — tugasa, tizimda qayerdadir sizish (utechka) bor demakdir. Bu holatda albatta usta kerak.", "text_ru": "❄️ *КОНДИЦИОНЕР — ГОНИТ ТЁПЛЫЙ ВОЗДУХ*\n\n🔍 *Возможные причины:*\n• Выбран неверный режим (например HEAT вместо COOL)\n• Закончился или улетучивается фреон\n• Загрязнён фильтр или радиатор наружного блока, тепло не отводится\n• Не работает или ослаб компрессор\n• Недостаточная циркуляция воздуха вокруг наружного блока (установлен близко к стене)\n• Неисправен 4-ходовой клапан (reverse valve) — переключает режимы охлаждения/обогрева\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте, выбран ли на пульте режим ❄️ *COOL* или *AUTO*\n2️⃣ Установите температуру на 4-5°C ниже комнатной\n3️⃣ Установите скорость вентилятора на *AUTO* или *HIGH*\n4️⃣ Подождите 10-15 минут — охлаждение может начаться медленно\n5️⃣ Аккуратно потрогайте наружный блок рукой — он должен быть тёплым; холодный означает отсутствие фреона или неработающий компрессор\n6️⃣ Очистите радиатор (решётку) наружного блока от пыли и листьев, оставьте вокруг минимум 30-50 см свободного пространства\n7️⃣ Ещё раз проверьте, не выбран ли случайно режим HEAT на пульте\n\n⚠️ Фреон сам не заканчивается — если его нет, значит где-то есть утечка в системе. В этом случае обязательно нужен мастер."}, {"label_uz": "❄️ Tashqi agregat ishlamaydi", "label_ru": "❄️ Внешний блок не работает", "text_uz": "❄️ *KONDITSIONER — TASHQI BLOK ISHLAMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Himoya tizimi ishga tushgan (overload/overcurrent protection)\n• Elektr qutisidagi sigorta yoki avtomat tushib ketgan\n• Tashqi blokka boruvchi kabel uzilgan yoki kontaktlari oksidlangan\n• Kompressor kondensatori (pusk konденсатор) shishib yoki yorilib ketgan\n• Kompressorning o'zi kuygan yoki qisqichlangan\n• Ichki va tashqi blok orasidagi signal kabeli uzilgan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Ichki blok ishlayaptimi tekshiring — agar ishlayotgan bo'lsa, 3-5 daqiqa kuting, chunki tashqi blok bir oz kechroq yonadi (himoya taймeri)\n2️⃣ Elektr qutisidagi sigorta (avtomat) tushib qolmaganini tekshiring\n3️⃣ Multimetr bo'lsa, rozetkada 220V borligini tekshiring — past kuchlanish kompressorni ishga tushirmaydi\n4️⃣ Vilkani (yoki avtomatni) uzib, 5 daqiqa kuting, qayta ulang — himoya tizimi shu tarzda \"reset\" bo'lishi mumkin\n5️⃣ Tashqi blok ventilyatori aylanayaptimi, lekin kompressor ovozi yo'qmi kuzating — bu kompressor muammosidan darak berishi mumkin\n6️⃣ Tashqi blokdan g'ing'illagan yoki taqillagan tovush kelib, keyin o'chib qolsa — bu kondensator yoki kompressor nosozligiga o'xshaydi\n\n⚠️ Kompressor yoki kondensator nosoz bo'lsa — bu qimmatroq ta'mirlash hisoblanadi, albatta usta chaqiring va ichini o'zingiz ochmang (yuqori kuchlanish xavfi bor).", "text_ru": "❄️ *КОНДИЦИОНЕР — ВНЕШНИЙ БЛОК НЕ РАБОТАЕТ*\n\n🔍 *Возможные причины:*\n• Сработала защита (overload/overcurrent protection)\n• Выбило предохранитель или автомат в электрощитке\n• Обрыв кабеля к наружному блоку или окислились контакты\n• Вздулся или лопнул пусковой конденсатор компрессора\n• Сгорел или заклинил сам компрессор\n• Обрыв сигнального кабеля между внутренним и наружным блоком\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте, работает ли внутренний блок — если да, подождите 3-5 минут, наружный блок включается с задержкой (таймер защиты)\n2️⃣ Проверьте, не выбило ли автомат в электрощитке\n3️⃣ Если есть мультиметр, проверьте наличие 220V в розетке — низкое напряжение не запускает компрессор\n4️⃣ Отключите вилку (или автомат), подождите 5 минут, включите снова — иногда это сбрасывает защиту\n5️⃣ Проверьте, крутится ли вентилятор наружного блока, но нет звука компрессора — это может говорить о проблеме компрессора\n6️⃣ Гудение или щелчки из наружного блока с последующим отключением — похоже на неисправность конденсатора или компрессора\n\n⚠️ Если неисправен компрессор или конденсатор — это дорогостоящий ремонт, обязательно вызовите мастера и не вскрывайте блок самостоятельно (высокое напряжение)."}, {"label_uz": "❄️ Yonadi lekin ishlamaydi", "label_ru": "❄️ Включается но не работает", "text_uz": "❄️ *KONDITSIONER — YONADI, LEKIN ISHLAMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Ekranda xato kod chiqqan (sensor yoki plata muammosi)\n• Filtr juda kir — havo umuman aylanmayapti\n• Pult batareyasi tugagan yoki pult nosoz\n• Ichki va tashqi blok orasidagi aloqa uzilgan\n• Taymer yoki uyqu rejimi tasodifan yoqilgan\n• Displey/boshqaruv platasi nosoz — buyruqlarni qabul qilmayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Ekranda xato kod bormi tekshiring (E1, E2, F1, F3...) — bo'lsa, ustaga aytish uchun yozib qo'ying\n2️⃣ Filtrni chiqarib tozalang — havo aylanishi yaxshilansa muammo yo'qolishi mumkin\n3️⃣ Pult batareyasini yangisiga almashtiring\n4️⃣ Vilkani 5-10 daqiqaga rozetkadan uzib, qayta ulang (bu ko'p hollarda plata xatosini \"reset\" qiladi)\n5️⃣ Pult va konditsioner orasida to'siq yo'qligini, masofa yaqinligini tekshiring\n6️⃣ Ichki blokdagi tugma orqali (pultsiz) yoqib ko'ring — ishlasа, muammo pultda\n7️⃣ Taymer yoki Sleep rejimi yoqilmaganini pult menyusidan tekshiring", "text_ru": "❄️ *КОНДИЦИОНЕР — ВКЛЮЧАЕТСЯ, НО НЕ РАБОТАЕТ*\n\n🔍 *Возможные причины:*\n• На дисплее код ошибки (проблема с датчиком или платой)\n• Очень грязный фильтр — воздух вообще не циркулирует\n• Разрядились батарейки пульта или он неисправен\n• Потеряна связь между внутренним и наружным блоком\n• Случайно включён таймер или режим сна\n• Неисправна плата дисплея/управления — не принимает команды\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте, есть ли код ошибки на дисплее (E1, E2, F1, F3...) — если есть, запишите для мастера\n2️⃣ Снимите и почистите фильтр — если циркуляция воздуха улучшится, проблема может исчезнуть\n3️⃣ Замените батарейки пульта\n4️⃣ Отключите от сети на 5-10 минут и включите снова (это часто сбрасывает ошибку платы)\n5️⃣ Проверьте, нет ли преграды между пультом и кондиционером, попробуйте подойти ближе\n6️⃣ Включите кнопкой на самом внутреннем блоке (без пульта) — если заработает, проблема в пульте\n7️⃣ Проверьте в меню пульта, не включён ли таймер или режим Sleep"}, {"label_uz": "❄️ Qizdirmaydi (qishda)", "label_ru": "❄️ Не греет (зимой)", "text_uz": "❄️ *KONDITSIONER — QISH KUNI ISITMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• HEAT rejimi tanlanmagan (COOL yoki FAN rejimida qolib ketgan)\n• Tashqi harorat juda past (-5°C dan past) — oddiy konditsionerlar bunday sharoitda samarasiz\n• Tashqi blok muzlab qolgan — defrost (erish) tsikli o'z vaqtida ishlamayapti\n• Freon kamaygan — issiqlikni ko'tara olmayapti\n• Havo filtri kir, issiq havo yetarli chiqmayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Pultdan ♨️ *HEAT* rejimini tanlaganingizni tekshiring (❄️ COOL emas!)\n2️⃣ Haroratni 24-26°C ga qo'ying\n3️⃣ Dastlabki 5-10 daqiqa sovuqroq yoki xira havo kelishi NORMAL — kompressor isinishi kerak, keyin isitadi\n4️⃣ Tashqi blokda muz bormi tekshiring — bo'lsa, avtomatik defrost tsikli o'zi eritishi kerak, bu 10-15 daqiqa davom etishi mumkin\n5️⃣ Filtrni tozalang — kir filtr issiq havo chiqishini kamaytiradi\n6️⃣ Tashqi harorat -5°C dan past bo'lsa — bu oddiy (invertor bo'lmagan) konditsionerlar uchun normal holat, ular past haroratda samarasiz ishlaydi\n7️⃣ Agar konditsioner \"Invertor + Low Temperature Heating\" funksiyasiga ega bo'lsa, shu funksiya yoqilganini tekshiring", "text_ru": "❄️ *КОНДИЦИОНЕР — НЕ ГРЕЕТ ЗИМОЙ*\n\n🔍 *Возможные причины:*\n• Не выбран режим HEAT (остался режим COOL или FAN)\n• Слишком низкая температура на улице (ниже -5°C) — обычные кондиционеры в таких условиях неэффективны\n• Наружный блок покрылся льдом — цикл оттайки (defrost) не срабатывает вовремя\n• Снизился уровень фреона — не хватает мощности для обогрева\n• Грязный фильтр, недостаточно тёплого воздуха на выходе\n\n✅ *Попробуйте сами:*\n1️⃣ Проверьте, выбран ли на пульте режим ♨️ *HEAT* (не ❄️ COOL!)\n2️⃣ Установите температуру 24-26°C\n3️⃣ Первые 5-10 минут холодный или слабый воздух — это НОРМАЛЬНО, компрессору нужно прогреться\n4️⃣ Проверьте наружный блок на наличие льда — автоматический цикл оттайки должен растопить его сам, это может занять 10-15 минут\n5️⃣ Почистите фильтр — грязный фильтр снижает поток тёплого воздуха\n6️⃣ Если на улице ниже -5°C — это нормально для обычных (не инверторных) кондиционеров, они неэффективны при низких температурах\n7️⃣ Если у кондиционера есть функция \"Инвертор + обогрев при низких температурах\", проверьте, включена ли она"}, {"label_uz": "❄️ Yomon hid chiqaradi", "label_ru": "❄️ Неприятный запах", "text_uz": "❄️ *KONDITSIONER — YOMON HID CHIQARADI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Filtrda chang, kir va bakteriya to'planib qolgan\n• Drenaj tizimida namlik natijasida mog' (pleseň) paydo bo'lgan\n• Ichki blok ichida o'lik hasharot yoki chirigan barg qolib ketgan\n• Issiqlik almashtirgich (evaporator) uzoq vaqt tozalanmagan — unda namlik va chang yig'ilib qoladi\n• Tamaki tutuni yoki pishirilgan ovqat hidlari filtrga singib qolgan\n• Yangi o'rnatilgan konditsionerda \"yangi plastik\" hidi — bu normal holat, bir necha kunda o'tib ketadi\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Filtrni chiqarib, iliq sovunli suvda yuving va to'liq quriting, keyin qayta o'rnating\n2️⃣ Drenaj trubkasini tekshiring — namlik turg'un qolib, mog' hidi chiqishi mumkin\n3️⃣ Konditsionerni 2-3 soat DRY (namlikni kamaytirish) rejimida ishlating — bu ichki qismni quritib, mog'ni kamaytiradi\n4️⃣ Ichki blok qopqog'ini ochib, ko'zga ko'rinadigan chang yoki begona narsa yo'qligini tekshiring\n5️⃣ Hid faqat yoqilgan payt kelib, keyin yo'qolib qolsa — bu odatda filtr yoki namlik bilan bog'liq, jiddiy emas\n\n⚠️ Agar hid kuygan plastik yoki elektr simiga o'xshasa — darhol o'chirib, ustaga murojaat qiling, bu elektr nosozligi belgisi bo'lishi mumkin. Ichki qismni chuqur (evaporator) tozalash uchun mutaxassis kerak.", "text_ru": "❄️ *КОНДИЦИОНЕР — НЕПРИЯТНЫЙ ЗАПАХ*\n\n🔍 *Возможные причины:*\n• В фильтре скопилась пыль, грязь и бактерии\n• В дренажной системе из-за влажности образовалась плесень\n• Внутри блока осталось мёртвое насекомое или гнилой лист\n• Теплообменник (испаритель) давно не чистился — в нём скапливается влага и пыль\n• Запах табачного дыма или приготовленной пищи впитался в фильтр\n• У нового кондиционера запах \"нового пластика\" — это нормально, проходит за несколько дней\n\n✅ *Попробуйте сами:*\n1️⃣ Снимите фильтр, промойте тёплой мыльной водой, полностью просушите и установите обратно\n2️⃣ Проверьте дренажную трубку — застоявшаяся влага может давать запах плесени\n3️⃣ Включите кондиционер на 2-3 часа в режиме DRY (осушение) — это подсушит внутренние части и уменьшит плесень\n4️⃣ Откройте крышку внутреннего блока и проверьте на наличие видимой пыли или посторонних предметов\n5️⃣ Если запах появляется только при включении и потом исчезает — обычно это связано с фильтром или влагой, не критично\n\n⚠️ Если запах напоминает горелый пластик или проводку — немедленно выключите и обратитесь к мастеру, это может быть признаком электрической неисправности. Для глубокой чистки испарителя нужен специалист."}, {"label_uz": "❄️ Qattiq shovqin chiqaradi", "label_ru": "❄️ Сильный шум", "text_uz": "❄️ *KONDITSIONER QATTIQ SHOVQIN/TOVUSH CHIQARADI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Ventilyator pichoqlariga begona narsa tegib turibdi yoki ular changlangan\n• Montaj (o'rnatish) noto'g'ri — blok mahkam o'rnatilmagan, tebranish bor\n• Kompressorda eskirish yoki moy (yog') kamayishi\n• Tashqi blokning montaj panellari yoki kronshteyni bo'shashgan\n• Ichki qismdagi plastik detallar issiqlikdan kengayib \"kre-kre\" tovush chiqarishi — ko'pincha normal holat\n• Freon aylanish tovushi (shildirash) — odatda normal, lekin haddan tashqari kuchli bo'lsa muammo bo'lishi mumkin\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Tovush qanday ekanini aniqlang: g'ijirlash, taqillash, uvillash yoki vizillash — bu ustaga tashxis qo'yishda yordam beradi\n2️⃣ Tovush ichki blokdanmi yoki tashqi blokdanmi ekanligini aniqlang\n3️⃣ Ichki blokning devorga mahkam o'rnatilganini, tebranmayotganini tekshiring\n4️⃣ Tashqi blokning taglik yoki kronshteynini qo'l bilan sekin bosib, mahkamligini tekshiring — bo'shashgan bo'lsa, tebranish tovush chiqaradi\n5️⃣ Ventilyator panjarasida barg, plastik yoki boshqa begona narsa yo'qligini tekshiring\n6️⃣ Tovush faqat yoqilgan yoki o'chirilgan paytda (bir martalik \"tars\" tovush) bo'lsa — bu odatda issiqlikdan kengayish, jiddiy emas\n7️⃣ Tovush doimiy va kuchayib boryaptimi kuzating — bunday holatda kompressor yoki ventilyator motoriga tashxis kerak bo'lishi mumkin", "text_ru": "❄️ *КОНДИЦИОНЕР ИЗДАЁТ СИЛЬНЫЙ ШУМ/ЗВУК*\n\n🔍 *Возможные причины:*\n• Лопасти вентилятора задевают посторонний предмет или запылены\n• Неправильный монтаж — блок закреплён не жёстко, есть вибрация\n• Износ компрессора или недостаток масла\n• Ослабли монтажные панели или кронштейн наружного блока\n• Пластиковые детали внутри расширяются от тепла и издают потрескивание — часто это нормально\n• Звук циркуляции фреона (журчание) — обычно нормально, но при чрезмерной громкости может быть проблемой\n\n✅ *Попробуйте сами:*\n1️⃣ Определите характер звука: скрип, стук, гудение или свист — это поможет мастеру в диагностике\n2️⃣ Определите, идёт ли звук от внутреннего или наружного блока\n3️⃣ Проверьте, надёжно ли закреплён внутренний блок на стене, нет ли вибрации\n4️⃣ Аккуратно нажмите рукой на основание или кронштейн наружного блока — проверьте надёжность крепления, ослабленное крепление даёт вибрацию\n5️⃣ Проверьте решётку вентилятора на наличие листьев, пластика или других посторонних предметов\n6️⃣ Если звук возникает только при включении/выключении (однократный треск) — обычно это тепловое расширение, не критично\n7️⃣ Следите, постоянный ли звук и усиливается ли он — в этом случае может потребоваться диагностика компрессора или мотора вентилятора"}, {"label_uz": "❄️ O'zi to'xtaydi", "label_ru": "❄️ Сам отключается", "text_uz": "❄️ *KONDITSIONER O'ZI TO'XTAYDI / VAQTI-VAQTI BILAN ISHLAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Harorat datchigi noto'g'ri o'lchayapti — konditsioner xonani \"sovub bo'ldi\" deb o'ylaydi\n• Filtr juda kir — havo aylanishi yomonlashgan, himoya tizimi ishga tushadi\n• Freon kam — bosim pasayib, himoya tizimi kompressorni to'xtatadi\n• Tashqi blok atrofida havo aylanishi yetarli emas (devorga yaqin, to'g'ridan-to'g'ri quyoshda)\n• Elektr kuchlanishi beqaror — kuchlanish sakrashi himoya tizimini ishga tushiradi\n• Kompressor qizib ketyapti va issiqlik himoyasi tufayli vaqtincha to'xtayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Filtrni chiqarib tozalang — bu eng oddiy va tez-tez yordam beradigan usul\n2️⃣ Tashqi blok atrofida kamida 30-50 sm bo'sh joy borligini ta'minlang, to'g'ridan-to'g'ri quyoshdan soyalab qo'ying\n3️⃣ Haroratni xona haroratidan atigi 2-3°C past belgilang — haddan tashqari past qo'yish tez-tez to'xtashga sabab bo'lishi mumkin\n4️⃣ Necha daqiqa ishlab, necha daqiqa to'xtab turishini soat bilan o'lchang — bu intervalni ustaga aytish foydali bo'ladi\n5️⃣ Imkon bo'lsa, stabilizator yoki tarmoq filtri orqali ulab ko'ring — kuchlanish beqarorligini tekshirish uchun\n6️⃣ Konditsionerni bir necha soatga o'chirib, to'liq \"sovushiga\" imkon bering, keyin qayta yoqing\n\n⚠️ Agar tez-tez (har 5-10 daqiqada) to'xtab-yonib tursa — bu ko'pincha freon yoki datchik muammosidan darak beradi, usta chaqirish tavsiya etiladi.", "text_ru": "❄️ *КОНДИЦИОНЕР САМ ОТКЛЮЧАЕТСЯ / РАБОТАЕТ С ПЕРЕБОЯМИ*\n\n🔍 *Возможные причины:*\n• Датчик температуры измеряет неверно — кондиционер \"думает\", что комната уже охлаждена\n• Очень грязный фильтр — ухудшена циркуляция воздуха, срабатывает защита\n• Мало фреона — падает давление, защита отключает компрессор\n• Недостаточная циркуляция воздуха вокруг наружного блока (близко к стене, на солнце)\n• Нестабильное напряжение в сети — скачки включают защиту\n• Перегревается компрессор, срабатывает тепловая защита и временно отключает его\n\n✅ *Попробуйте сами:*\n1️⃣ Снимите и почистите фильтр — самый простой и часто помогающий способ\n2️⃣ Обеспечьте вокруг наружного блока минимум 30-50 см свободного пространства, притените от прямого солнца\n3️⃣ Установите температуру всего на 2-3°C ниже комнатной — слишком низкая температура может вызывать частые отключения\n4️⃣ Засеките по часам, сколько минут работает и сколько стоит — этот интервал будет полезен мастеру\n5️⃣ Если возможно, подключите через стабилизатор или сетевой фильтр — чтобы проверить нестабильность напряжения\n6️⃣ Выключите кондиционер на несколько часов, дайте ему полностью \"остыть\", затем включите снова\n\n⚠️ Если отключения частые (каждые 5-10 минут) — это часто говорит о проблеме с фреоном или датчиком, рекомендуется вызвать мастера."}, {"label_uz": "❄️ Ichki blok muzlaydi", "label_ru": "❄️ Внутренний блок обмерзает", "text_uz": "❄️ *ICHKI BLOK MUZLAYDI (ICHIDA MUZ QOTADI)*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Filtr kir — havo yetarlicha aylanmayapti, sovuq havo bir joyda to'planib muzlaydi\n• Freon kam — bosim tushib ketgan, bu muz hosil bo'lishining eng ko'p uchraydigan sababi\n• Harorat juda past qo'yilgan va konditsioner uzluksiz ishlayapti\n• Tashqi harorat past bo'lganda (masalan kechqurun yoki bahorda) COOL rejimida uzoq ishlatilgan\n• Ventilyator tezligi juda past sozlangan — havo yetarlicha aylanmayapti\n• Ichki blokning issiqlik almashtirgichi (evaporator) juda kirlangan\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Konditsionerni darhol o'chiring va muz to'liq erishini kuting — bu odatda bir necha soat vaqt oladi, majburan qirmang yoki narsa bilan urmang\n2️⃣ Filtrni chiqarib yuving va quriting\n3️⃣ Haroratni 22-24°C ga ko'taring — juda past harorat muzlashni tezlashtiradi\n4️⃣ Fan tezligini AUTO yoki HIGH ga qo'ying — bu havo aylanishini yaxshilaydi\n5️⃣ Muz to'liq erigach, konditsionerni qayta yoqib, normal ishlayotganini kuzating\n6️⃣ Kechqurun yoki tashqi harorat past bo'lganda COOL rejimidan ko'ra FAN rejimidan foydalaning\n\n⚠️ Agar muzlash tez-tez qaytalansa — bu ko'pincha freon kamayganidan yoki sensor nosozligidan darak beradi, bunday holatda o'zingiz emas, usta tekshirishi kerak.", "text_ru": "❄️ *ВНУТРЕННИЙ БЛОК ОБМЕРЗАЕТ (ОБРАЗУЕТСЯ ЛЁД ВНУТРИ)*\n\n🔍 *Возможные причины:*\n• Грязный фильтр — недостаточная циркуляция воздуха, холодный воздух скапливается и замерзает\n• Мало фреона — падение давления, самая частая причина обмерзания\n• Установлена слишком низкая температура, и кондиционер работает непрерывно\n• Долгая работа в режиме COOL при низкой температуре на улице (вечером или весной)\n• Слишком низкая скорость вентилятора — недостаточная циркуляция воздуха\n• Сильно загрязнён теплообменник (испаритель) внутреннего блока\n\n✅ *Попробуйте сами:*\n1️⃣ Немедленно выключите кондиционер и дайте льду полностью растаять — обычно это занимает несколько часов, не соскабливайте и не бейте лёд\n2️⃣ Снимите фильтр, промойте и просушите\n3️⃣ Поднимите температуру до 22-24°C — слишком низкая температура ускоряет обмерзание\n4️⃣ Установите скорость вентилятора на AUTO или HIGH — это улучшит циркуляцию воздуха\n5️⃣ После полного оттаивания включите кондиционер снова и понаблюдайте за нормальной работой\n6️⃣ Вечером или при низкой уличной температуре используйте режим FAN вместо COOL\n\n⚠️ Если обмерзание повторяется часто — это обычно говорит о нехватке фреона или неисправности датчика, в этом случае нужна проверка мастером, а не самостоятельный ремонт."}, {"label_uz": "❄️ Pult ishlamaydi", "label_ru": "❄️ Пульт не работает", "text_uz": "❄️ *PULT KONDITSIONERNI BOSHQARMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Pult batareyalari tugagan yoki noto'g'ri o'rnatilgan\n• Pultning infraqizil (IR) chirog'i nosoz\n• Konditsionerning IR qabul qiluvchisi (sensor) chang bosgan\n• Pult va konditsioner orasida to'siq bor yoki masofa uzoq\n• Pult displeyida hech narsa ko'rinmasa — pultning o'zi butunlay nosoz\n• Konditsionerning boshqaruv platasi buyruqlarni qabul qilmayapti\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Pult batareyalarini yangisiga almashtiring, + va − qutblarini to'g'ri joylashtiring\n2️⃣ Telefon kamerasi orqali pultning old (IR chiroq) qismiga qarab, tugmani bosing — kamerada binafsha rangda chiroq yonib-o'chsa, pult ishlayapti\n3️⃣ Pult bilan konditsioner orasidagi masofani 1-2 metrgacha qisqartiring, to'sqinlik yo'qligini tekshiring\n4️⃣ Konditsionerning IR sensor qismini (odatda old panelda) yumshoq, quruq mato bilan artib tozalang\n5️⃣ Ichki blokdagi \"Auto\" yoki jismoniy tugma orqali (pultsiz) yoqib ko'ring — ishlasa, muammo pultda, konditsionerning o'zida emas\n6️⃣ Pult displeyida raqamlar to'liq va aniq ko'rinayaptimi tekshiring — xira yoki qisman ko'rinsa, ekran nosoz bo'lishi mumkin", "text_ru": "❄️ *ПУЛЬТ НЕ УПРАВЛЯЕТ КОНДИЦИОНЕРОМ*\n\n🔍 *Возможные причины:*\n• Сели батарейки в пульте или неправильно установлены\n• Неисправен инфракрасный (ИК) светодиод пульта\n• ИК-приёмник (сенсор) кондиционера запылился\n• Между пультом и кондиционером есть препятствие или большое расстояние\n• На дисплее пульта ничего не отображается — пульт полностью неисправен\n• Плата управления кондиционера не принимает команды\n\n✅ *Попробуйте сами:*\n1️⃣ Замените батарейки на новые, правильно расположив полюса + и −\n2️⃣ Направьте переднюю часть пульта (ИК-диод) на камеру телефона и нажмите кнопку — если на камере видно мигание фиолетового света, пульт исправен\n3️⃣ Сократите расстояние между пультом и кондиционером до 1-2 метров, проверьте отсутствие препятствий\n4️⃣ Протрите ИК-сенсор кондиционера (обычно на передней панели) мягкой сухой тканью\n5️⃣ Включите кнопкой \"Auto\" или физической кнопкой на внутреннем блоке (без пульта) — если заработает, проблема в пульте, а не в кондиционере\n6️⃣ Проверьте, чётко ли отображаются цифры на дисплее пульта — тусклое или частичное отображение говорит о неисправности экрана"}, {"label_uz": "❄️ Umuman yoqilmaydi", "label_ru": "❄️ Вообще не включается", "text_uz": "❄️ *KONDITSIONER UMUMAN YOQILMAYDI*\n\n🔍 *Sabab bo'lishi mumkin:*\n• Elektr tarmog'ida tok yo'q yoki avtomat tushib qolgan\n• Ichki blokdagi sigorta (fuse) kuyib ketgan\n• Quvvat kabeli (vilka yoki uning ichki simlari) uzilgan\n• Asosiy plata (main board) nosoz\n• Rozetka yoki uzaytirgichning o'zi ishlamayapti\n• Displey yoki indikator chiroqlar butunlay o'chgan — quvvat blokida muammo\n\n✅ *O'zingiz sinab ko'ring:*\n1️⃣ Elektr qutisidagi avtomat (sigorta) tushib qolm
