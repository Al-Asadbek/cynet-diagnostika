повтор ошибки\n3️⃣ Проверьте стабильность электросети\n4️⃣ Это серьёзная аппаратная неисправность — нужна замена модуля фьюзера\n5️⃣ При сильном запахе гари немедленно выключите и обратитесь к мастеру"}, {"label_uz": "🖨️ Samsung: Rasm takrorlanadi (ghosting)", "label_ru": "🖨️ Samsung: Повторяющееся изображение (ghosting)", "text_uz": "🖨️ *SAMSUNG (LAZER) — RASM TAKRORLANADI (GHOSTING)*\n\n🔍 *Keng tavsif:*\nChop etilgan sahifada bir xil tasvir soyasi pastroqda qaytarilib chiqadi. Sabab — drum eskirgani, tozalash raklasi nosoz yoki drum yorug'likka uzoq ta'sirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drumni yorug'likdan himoyalang\n2️⃣ Boshqa kartrij bilan sinab ko'ring, ghosting yo'qolsa — muammo drumda\n3️⃣ Quruq, qorong'i joyda saqlang\n4️⃣ Drum resursi tugagan bo'lsa (odatda 10,000-19,000 sahifa) — almashtiring\n5️⃣ Davom etsa, tozalash raklasi nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ПОВТОРЯЮЩЕЕСЯ ИЗОБРАЖЕНИЕ (GHOSTING)*\n\n🔍 *Подробное описание:*\nНа отпечатке ниже повторяется тень одного и того же изображения. Причина — износ барабана, неисправность чистящего лезвия или долгое воздействие света на барабан.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, защитите барабан от света\n2️⃣ Проверьте с другим картриджем — если исчезло, проблема в барабане\n3️⃣ Храните в сухом тёмном месте\n4️⃣ При исчерпании ресурса барабана (обычно 10 000–19 000 страниц) — замените\n5️⃣ Если не помогает — неисправно чистящее лезвие, нужна диагностика у мастера"}, {"label_uz": "🖨️ Samsung: Juda sekin ishga tushadi", "label_ru": "🖨️ Samsung: Очень долгий прогрев/запуск", "text_uz": "🖨️ *SAMSUNG (LAZER) — JUDA SEKIN ISHGA TUSHADI*\n\n🔍 *Keng tavsif:*\nPrinter yoqilgandan chop etishga tayyor bo'lishigacha g'ayrioddiy uzoq vaqt o'tadi (warm-up). Sabab — sovuq muhit, eskirgan fuser yoki firmware/drayver muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni issiqroq, quruq xonaga o'tkazing\n2️⃣ Firmware'ni Samsung/HP (Samsung printer bo'limi HP tarkibida) rasmiy dasturi orqali yangilang\n3️⃣ Print Spooler xizmatini qayta ishga tushiring\n4️⃣ Drayverni qayta o'rnating\n5️⃣ Davom etsa, fuser eskirgan — ustaxonada tekshirtiring", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ОЧЕНЬ ДОЛГИЙ ПРОГРЕВ/ЗАПУСК*\n\n🔍 *Подробное описание:*\nОт включения принтера до готовности к печати проходит необычно много времени (warm-up). Причина — холодное помещение, изношенный фьюзер или проблема прошивки/драйвера.\n\n✅ *Подробное решение:*\n1️⃣ Переставьте принтер в тёплое сухое помещение\n2️⃣ Обновите прошивку через официальную программу Samsung/HP (линейка Samsung входит в состав HP)\n3️⃣ Перезапустите службу Print Spooler\n4️⃣ Переустановите драйвер\n5️⃣ Если не помогает — изношен фьюзер, нужна диагностика у мастера"}, {"label_uz": "🖨️ Samsung: Duplex (ikki tomonlama) xato", "label_ru": "🖨️ Samsung: Ошибка двусторонней печати (duplex)", "text_uz": "🖨️ *SAMSUNG (LAZER) — DUPLEX (IKKI TOMONLAMA) XATO*\n\n🔍 *Keng tavsif:*\nIkki tomonlama chop etishda qog'oz noto'g'ri aylanadi, ikkinchi tomon bo'sh chiqadi yoki duplex yo'lida qisilib qoladi. Sabab — modul to'liq o'rnatilmagan, mos kelmaydigan qog'oz yoki sensor kirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Duplex modulni chiqarib, to'liq va tekis qaytadan o'rnating\n2️⃣ Drayverda ikki tomonlama chop etish yoqilganini tekshiring\n3️⃣ Faqat mos qalinlikdagi qog'oz ishlating\n4️⃣ Modul rolik va sensorlarini changdan tozalang\n5️⃣ Davom etsa, modul mexanik jihatdan nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *SAMSUNG (ЛАЗЕРНЫЙ) — ОШИБКА ДВУСТОРОННЕЙ ПЕЧАТИ (DUPLEX)*\n\n🔍 *Подробное описание:*\nПри двусторонней печати бумага неправильно переворачивается, вторая сторона выходит пустой или застревает в пути duplex. Причина — модуль установлен не до конца, неподходящая бумага или загрязнён датчик.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките модуль duplex и установите заново полностью и ровно\n2️⃣ Проверьте включение двусторонней печати в драйвере\n3️⃣ Используйте бумагу только подходящей плотности\n4️⃣ Очистите ролики и датчики модуля от пыли\n5️⃣ Если не помогает — модуль механически неисправен, нужна диагностика у мастера"}]}, {"name": "🖨️ Xerox (lazer)", "items": [{"label_uz": "🖨️ Xerox: Bo'sh/oq varaq chiqadi", "label_ru": "🖨️ Xerox: Выходит пустой лист", "text_uz": "🖨️ *XEROX (LAZER) — BO'SH/OQ VARAQ CHIQADI*\n\n🔍 *Keng tavsif:*\nPrinter chop etadi, lekin varaq bo'sh chiqadi. Sabab — toner tugagan, kartrij muhri olinmagan yoki yuklash g'ildiragida kontakt yo'q.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, muhrlovchi lenta/qopqoq to'liq olib tashlanganini tekshiring\n2️⃣ Kartrijni asta chapdan o'ngga bir necha marta silkiting\n3️⃣ Toner darajasini printer paneli yoki Xerox dasturi orqali tekshiring\n4️⃣ Kartrij kontaktlarini quruq mato bilan artib, mahkam qaytadan o'rnating\n5️⃣ Test sahifasini chop eting va natijani tekshiring\n6️⃣ Yordam bermasa — drum yoki yuklash bloki nosoz, ustaxonada tekshirish kerak", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ВЫХОДИТ ПУСТОЙ ЛИСТ*\n\n🔍 *Подробное описание:*\nПринтер печатает, но лист выходит пустым. Причина — закончился тонер, не снята защитная лента картриджа или нет контакта на ролике переноса.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, проверьте, полностью ли снята защитная лента/крышка\n2️⃣ Аккуратно покачайте картридж из стороны в сторону несколько раз\n3️⃣ Проверьте уровень тонера через панель принтера или программу Xerox\n4️⃣ Протрите контакты картриджа сухой тканью и плотно установите обратно\n5️⃣ Распечатайте тестовую страницу и проверьте результат\n6️⃣ Если не помогает — неисправен барабан или узел переноса, нужна проверка у мастера"}, {"label_uz": "🖨️ Xerox: Chiziqlar, dog'lar", "label_ru": "🖨️ Xerox: Полосы, пятна", "text_uz": "🖨️ *XEROX (LAZER) — CHIZIQLAR, DOG'LAR*\n\n🔍 *Keng tavsif:*\nChop etilgan varaqda takrorlanuvchi chiziqlar yoki dog'lar ko'rinadi. Sabab — drum tirnalgani/ifloslangani yoki tozalash pichog'i yeyilgani.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drum yuzasini yorug'likda tekshiring\n2️⃣ Chiziqlar orasidagi masofani o'lchab, drum yoki fyuzer sabab ekanligini aniqlang\n3️⃣ Kartrijni tashqi tomondan yumshoq mato bilan artib, drumga tegmasdan changini tozalang\n4️⃣ Sifatsiz qayta to'ldirilgan kartrij drumni tezroq shikastlaydi — sifatli kartrijga o'ting\n5️⃣ Muammo davom etsa, drum yoki fyuzer almashtirilishi kerak — ustaxonada bajariladi", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ПОЛОСЫ, ПЯТНА*\n\n🔍 *Подробное описание:*\nНа отпечатке видны повторяющиеся полосы или пятна. Причина — поцарапан/загрязнён барабан или изношено чистящее лезвие.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж и осмотрите барабан на свету\n2️⃣ Измерьте расстояние между полосами, чтобы понять, барабан или печка являются причиной\n3️⃣ Протрите картридж снаружи мягкой тканью, не касаясь барабана\n4️⃣ Некачественный перезаправленный картридж быстрее повреждает барабан — перейдите на качественный\n5️⃣ Если не помогает — требуется замена барабана или печки, ремонт у мастера"}, {"label_uz": "🖨️ Xerox: \"Kartrij umri tugadi\" xabari", "label_ru": "🖨️ Xerox: Сообщение \"Ресурс картриджа исчерпан\"", "text_uz": "🖨️ *XEROX (LAZER) — \"KARTRIJ UMRI TUGADI\" XABARI*\n\n🔍 *Keng tavsif:*\nPrinter hali toner bor bo'lsa ham \"Cartridge end of life\" yoki \"Toner cartridge is empty\" xabarini beradi. Sabab — kartrij chipidagi sahifa hisoblagichi belgilangan chegaraga yetgan, garchi haqiqiy toner miqdori yetarli bo'lsa ham.\n\n✅ *Batafsil yechim:*\n1️⃣ Xabarni yopib \"Continue\"/\"Davom etish\" tugmasini bosing — ko'p hollarda printer yana bir muncha vaqt ishlayveradi\n2️⃣ Kartrijni chiqarib qayta o'rnating — ba'zi modellarda bu hisoblagichni yangilaydi\n3️⃣ Printer sozlamalarida \"Cartridge alerts\"/\"Ogohlantirishlar\" darajasini tekshiring, agar imkon bo'lsa moslashtiring\n4️⃣ Chop etish sifati haqiqatan pasaygan bo'lsa (xira chop) — bu safar toner haqiqatan tugagan, kartrijni almashtirish kerak\n5️⃣ Doimiy takrorlansa — chip yoki hisoblagich noto'g'ri ishlayapti, ustadan maslahat oling", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — СООБЩЕНИЕ \"РЕСУРС КАРТРИДЖА ИСЧЕРПАН\"*\n\n🔍 *Подробное описание:*\nПринтер выдаёт \"Cartridge end of life\" или \"Toner cartridge is empty\", даже если тонер ещё есть. Причина — счётчик страниц на чипе картриджа достиг установленного предела, хотя реального тонера может быть достаточно.\n\n✅ *Подробное решение:*\n1️⃣ Закройте сообщение и нажмите \"Continue\"/\"Продолжить\" — часто принтер продолжает работать\n2️⃣ Извлеките картридж и заново установите — на некоторых моделях это обновляет счётчик\n3️⃣ Проверьте уровень \"Cartridge alerts\"/оповещений в настройках принтера, при возможности настройте\n4️⃣ Если качество печати реально ухудшилось (бледная печать) — тонер действительно закончился, замените картридж\n5️⃣ Если повторяется постоянно — неверно работает чип или счётчик, проконсультируйтесь с мастером"}, {"label_uz": "🖨️ Xerox: Qog'oz qisilib qoladi / sensor xato", "label_ru": "🖨️ Xerox: Замятие бумаги / ошибка датчика", "text_uz": "🖨️ *XEROX (LAZER) — QOG'OZ QISILIB QOLADI / SENSOR XATO*\n\n🔍 *Keng tavsif:*\nQog'oz yo'lda tiqilib qoladi yoki sezgich xato ko'rsatib, qog'oz bo'lmasa ham \"Jam\" xatosi beradi. Sabab — rolik yeyilgani yoki qog'oz sezgichi changlangani/nosoz bo'lishi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, barcha qopqoqlarni ochib qisilgan qog'ozni asta torting\n2️⃣ Fonar yordamida printer ichida mayda qog'oz bo'lagi qolmaganini tekshiring\n3️⃣ Sezgichni (odatda kichik plastik richag) toping va uni asta bosib-qo'yib, erkin harakatlanishini tekshiring\n4️⃣ Rolikni sal namlangan mato bilan artib, changdan tozalang\n5️⃣ Mos, quruq va tekis qog'oz ishlating, lotokka ko'p qog'oz solmang\n6️⃣ Xato takrorlansa — rolik yoki sezgich almashtirilishi kerak, ustaxonada bajariladi", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ЗАМЯТИЕ БУМАГИ / ОШИБКА ДАТЧИКА*\n\n🔍 *Подробное описание:*\nБумага застревает по пути или датчик выдаёт ошибку \"Jam\", даже когда бумаги нет. Причина — износ ролика или загрязнён/неисправен датчик бумаги.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер, откройте все крышки и аккуратно извлеките застрявшую бумагу\n2️⃣ С фонариком проверьте, не остался ли внутри мелкий кусочек бумаги\n3️⃣ Найдите датчик (обычно маленький пластиковый рычажок) и проверьте, свободно ли он двигается при нажатии\n4️⃣ Протрите ролик слегка влажной тканью от пыли\n5️⃣ Используйте подходящую сухую ровную бумагу, не перегружайте лоток\n6️⃣ Если ошибка повторяется — нужна замена ролика или датчика, ремонт у мастера"}, {"label_uz": "🖨️ Xerox: Toner erimay, qog'ozdan qirilib tushadi", "label_ru": "🖨️ Xerox: Тонер не закрепляется, осыпается", "text_uz": "🖨️ *XEROX (LAZER) — TONER ERIMAY, QOG'OZDAN QIRILIB TUSHADI*\n\n🔍 *Keng tavsif:*\nChop etilgan matn/rasm osongina artilib yoki qirilib tushadi — toner qog'ozga to'liq \"yopishmayapti\". Sabab — fyuzer yetarlicha isimayapti yoki isitish elementi eskirgan.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer sozlamalarida qog'oz turi (oddiy/qalin) to'g'ri tanlanganini tekshiring\n2️⃣ Printerni bir necha daqiqa ishlatib, fyuzerning to'liq isishini kuting\n3️⃣ Qog'ozni quruq joyda saqlang — nam qog'oz toner yopishishini yomonlashtiradi\n4️⃣ Sovuq xonada birinchi chop sifatsiz chiqishi mumkin — printerni iliqroq joyga o'tkazing\n5️⃣ Muammo doimiy bo'lsa — fyuzerning isitish elementi yoki termostati nosoz, ustaxonada fyuzer blokini almashtirish kerak", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ТОНЕР НЕ ЗАКРЕПЛЯЕТСЯ, ОСЫПАЕТСЯ*\n\n🔍 *Подробное описание:*\nНапечатанный текст/изображение легко стирается или осыпается — тонер полностью не \"запекается\" на бумаге. Причина — печка недостаточно нагревается или изношен нагревательный элемент.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте, правильно ли выбран тип бумаги (обычная/плотная) в настройках\n2️⃣ Дайте принтеру поработать несколько минут, чтобы печка полностью прогрелась\n3️⃣ Храните бумагу в сухом месте — влажная бумага ухудшает закрепление тонера\n4️⃣ В холодном помещении первая печать может быть некачественной — переместите принтер в более тёплое место\n5️⃣ Если проблема постоянная — неисправен нагревательный элемент или термостат печки, у мастера нужна замена блока печки"}, {"label_uz": "🖨️ Xerox: Tarmoq/drayver muammosi", "label_ru": "🖨️ Xerox: Проблема с сетью/драйвером", "text_uz": "🖨️ *XEROX (LAZER) — TARMOQ/DRAYVER MUAMMOSI*\n\n🔍 *Keng tavsif:*\nKompyuter yoki telefon printerni tarmoqda topa olmaydi yoki chop etishga urinishda drayver xatosi chiqadi. Sabab — printer boshqa tarmoqqa ulangan, drayver eskirgan yoki port/kabel muammosi.\n\n✅ *Batafsil yechim:*\n1️⃣ Printer panelidan tarmoq sozlamalarini tekshirib, kerak bo'lsa qaytadan sozlang\n2️⃣ Drayverni Xerox rasmiy saytidan eng so'nggi versiyaga yangilang\n3️⃣ Printer va kompyuter/telefon bir xil tarmoqda ekanini tasdiqlang\n4️⃣ Windows'da \"Print Spooler\" xizmatini qayta ishga tushiring\n5️⃣ Router va printerni qayta ishga tushiring (reboot)\n6️⃣ Yordam bermasa, USB orqali vaqtincha ulang va ustadan tarmoq sozlashni so'rang", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ПРОБЛЕМА С СЕТЬЮ/ДРАЙВЕРОМ*\n\n🔍 *Подробное описание:*\nКомпьютер или телефон не находят принтер в сети, либо при печати появляется ошибка драйвера. Причина — принтер подключён к другой сети, устарел драйвер или проблема с портом/кабелем.\n\n✅ *Подробное решение:*\n1️⃣ Проверьте сетевые настройки через панель принтера, при необходимости настройте заново\n2️⃣ Обновите драйвер до последней версии с официального сайта Xerox\n3️⃣ Убедитесь, что принтер и компьютер/телефон в одной сети\n4️⃣ Перезапустите службу \"Диспетчер печати\" в Windows\n5️⃣ Перезагрузите роутер и принтер\n6️⃣ Если не помогает — временно подключитесь через USB и обратитесь к мастеру для настройки сети"}, {"label_uz": "🖨️ Xerox: Fuser (termoblok) xatosi", "label_ru": "🖨️ Xerox: Ошибка фьюзера (термоблока)", "text_uz": "🖨️ *XEROX (LAZER) — FUSER (TERMOBLOK) XATOSI*\n\n🔍 *Keng tavsif:*\nPrinter ekranida fuser bilan bog'liq xato kodi chiqadi, toner qog'ozga to'liq birikmaydi yoki kuygan hid sezilishi mumkin. Sabab — fuser isitish elementi yoki termistor nosoz.\n\n✅ *Batafsil yechim:*\n1️⃣ Printerni o'chirib, 15-20 daqiqa sovutish uchun kutib turing\n2️⃣ Qayta yoqib, xato takrorlanishini kuzating\n3️⃣ Elektr tarmog'i barqarorligini tekshiring\n4️⃣ Bu qattiq apparat nosozligi — fuser moduli almashtirilishi kerak\n5️⃣ Kuchli kuygan hidda darhol o'chiring va ustaxonaga olib boring", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ОШИБКА ФЬЮЗЕРА (ТЕРМОБЛОКА)*\n\n🔍 *Подробное описание:*\nНа экране принтера появляется код ошибки фьюзера, тонер плохо закрепляется на бумаге или ощущается запах гари. Причина — неисправен нагревательный элемент или термистор фьюзера.\n\n✅ *Подробное решение:*\n1️⃣ Выключите принтер и дайте остыть 15-20 минут\n2️⃣ Включите снова и проверьте повтор ошибки\n3️⃣ Проверьте стабильность электросети\n4️⃣ Это серьёзная аппаратная неисправность — нужна замена модуля фьюзера\n5️⃣ При сильном запахе гари немедленно выключите и обратитесь к мастеру"}, {"label_uz": "🖨️ Xerox: Rasm takrorlanadi (ghosting)", "label_ru": "🖨️ Xerox: Повторяющееся изображение (ghosting)", "text_uz": "🖨️ *XEROX (LAZER) — RASM TAKRORLANADI (GHOSTING)*\n\n🔍 *Keng tavsif:*\nSahifada bir xil tasvir soyasi pastroqda takrorlanadi. Sabab — drum eskirgani, tozalash raklasi nosoz yoki drum yorug'likka uzoq muddat ta'sirlangan.\n\n✅ *Batafsil yechim:*\n1️⃣ Kartrijni chiqarib, drumni yorug'likdan himoyalang\n2️⃣ Boshqa kartrij bilan sinab ko'ring, ghosting yo'qolsa — muammo drumda\n3️⃣ Quruq, qorong'i joyda saqlang\n4️⃣ Drum resursi tugagan bo'lsa — almashtiring\n5️⃣ Davom etsa, tozalash raklasi nosoz — ustaxonada tekshirtiring", "text_ru": "🖨️ *XEROX (ЛАЗЕРНЫЙ) — ПОВТОРЯЮЩЕЕСЯ ИЗОБРАЖЕНИЕ (GHOSTING)*\n\n🔍 *Подробное описание:*\nНа странице ниже повторяется тень одного и того же изображения. Причина — износ барабана, неисправность чистящего лезвия или долгое воздействие света на барабан.\n\n✅ *Подробное решение:*\n1️⃣ Извлеките картридж, защитите барабан от света\n2️⃣ Проверьте с другим кар
